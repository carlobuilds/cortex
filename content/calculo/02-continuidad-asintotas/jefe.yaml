# 016 (90) + 020 (120) + 021 (90) + 023 (150) + 024 (150) + 025 (120) = 930. Repaso, sin tiempo_estimado_s propio, con
# el de su dificultad (config.ts, flow.estimatedSecondsByDifficulty): calc-01-005 (d3, 75) + calc-01-023 (d3, 75) +
# calc-01-025 (d2, 45) = 195. Total 1125; con el 10 %, 1237.5, redondeado a 1238 s (20.6 min).
