materia: calculo
notacion: "Usamos f'(x) para la derivada y lim sin límites laterales salvo que se indique x→a⁺ o x→a⁻. Escribimos sen, arcsen y senh (la app también acepta sin, asin y sinh); ln es el logaritmo natural y los de otra base llevan la base escrita (log₁₀, log₂). Las derivadas laterales se escriben f'₊(a) y f'₋(a) (con h→0⁺ y h→0⁻), no f'(a⁺); el incremento se escribe h o Δx, que son lo mismo. Las hiperbólicas recíprocas se escriben sech, csch y coth. En la app, sec² se escribe sec(x)^2 y log_b x se escribe log(x, b)."
# Temario aprobado por Carlo el 2026-11-10 contra curriculum/programas/calculo.pdf (IIA, plan 2020).
# Cada bloque es una unidad de Cortex; entre paréntesis, la sección del programa oficial.
# Los números de unidad son permanentes (van en los ids de ejercicio): 00 va antes del piloto 01.
