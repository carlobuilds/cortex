  # razonamiento: deductivo (sin esenciales: contar las coberturas mínimas del anillo) · R3
  # Anillo de 8 de experto-matematicas. Pistas modelo de arquitecto-razonamiento (esquema-14).
  # Era `numerico` (solo el 2); pasó a `completar` con el mismo id en los arreglos del 2026-11-14.
  # verificar: plantilla K de M; número de esenciales, de coberturas mínimas y literales de cada una (todas las mínimas
  # tienen las mismas, por definición; la primera basta).
  - id: disc-14-023
    tipo: completar
    dificultad: 5
    conceptos: [sop-minima]
    enunciado: >-
      Sea $F(w,x,y,z)=\Sigma m(3,4,6,7,9,11,12,13)$. Una SOP mínima es una suma de productos con el menor número de literales (cada aparición cuenta: $\bar wy+\bar wz$ tiene 4). Cuenta los primos esenciales de $F$ y sus SOP mínimas distintas; dos SOP que solo cambian el orden de sus términos cuentan como una.
    texto: >-
      Esenciales: ___ · SOP mínimas distintas: ___ · literales de cada una: ___
    respuestas: ["0", "2", "12"]
    verificar: { python: "(lambda r: [len(r[1]), len(r[2]), sum(4 - t.count('-') for t in r[2][0])])((lambda n, F: (lambda R: (lambda cov: (lambda P: (lambda E, C: (P, E, [S for S in C if sum(n - t.count('-') for t in S) == min(sum(n - t.count('-') for t in T) for T in C)]))([p for p in P if any(sum(1 for q in P if i in cov(q)) == 1 for i in cov(p))], [S for k in range(1, len(P) + 1) for S in itertools.combinations(P, k) if set().union(*[cov(t) for t in S]) == F]))((lambda I: [p for p in I if not any(q != p and cov(p) < cov(q) for q in I)])([''.join(t) for t in itertools.product('01-', repeat=n) if cov(''.join(t)) and cov(''.join(t)) <= F])))(lambda t: {i for i, r in enumerate(R) if all(c == '-' or int(c) == b for c, b in zip(t, r))}))(list(itertools.product((0, 1), repeat=n))))(4, {3, 4, 6, 7, 9, 11, 12, 13}))" }
    pistas:
      - >-
        ¿Cuentas cualquier cobertura o solo las de menos literales? ¿Qué celdas toca cada primo?
      - >-
        ¿Hay alguna celda que solo cubra un primo? Si no, dibuja cada primo como una línea entre sus celdas: ¿qué figura sale?
      - >-
        ¿Por qué no te alcanza con menos términos? ¿Contaste la misma SOP dos veces, en otro orden?
    explicacion: >-
      **Primos.** Ninguna celda cabe en un grupo de 4, y cada una está en exactamente dos pares. Hay 8 primos de 2 celdas: $\bar wxy$ ($m_6$ y $m_7$), $\bar wyz$ ($m_3$ y $m_7$), $\bar xyz$ ($m_3$ y $m_{11}$), $w\bar xz$ ($m_9$ y $m_{11}$), $w\bar yz$ ($m_9$ y $m_{13}$), $wx\bar y$ ($m_{12}$ y $m_{13}$), $x\bar y\bar z$ ($m_4$ y $m_{12}$) y $\bar wx\bar z$ ($m_4$ y $m_6$). **Sin esenciales.** Si dibujas cada primo como una línea entre sus dos celdas, sale un anillo que pasa por las 8: 6, 7, 3, 11, 9, 13, 12, 4 y de vuelta al 6. Ninguna celda tiene un solo primo: 0 esenciales. **Cuántos términos.** Cada primo cubre 2 de las 8 celdas, así que hacen falta al menos 4, y 4 alcanzan solo si no se enciman: hay que tomar uno sí y uno no alrededor del anillo. Eso da exactamente 2 maneras: $\bar wxy+\bar xyz+w\bar yz+x\bar y\bar z$ y $\bar wyz+w\bar xz+wx\bar y+\bar wx\bar z$, las dos con 4 términos y 12 literales. Revisa: en cada una, las 8 celdas quedan cubiertas una sola vez, y cualquier otra elección de 4 primos repite una celda y deja otra sin cubrir.
