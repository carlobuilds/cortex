    respuesta_modelo: >-
      $F=y+x\bar z=\Sigma m(2,3,4,6,7)$. Mapa: con $x=0$, 0 0 1 1; con $x=1$, 1 0 1 1. Primos esenciales: $y$ y $x\bar z$, que da la vuelta. Circuito: NOT, AND y OR, 3 compuertas contra 9. Revisión: 101 da 0 y 011 da 1, como dice la frase.
    verificar: { revision: "manual" }
    pistas:
