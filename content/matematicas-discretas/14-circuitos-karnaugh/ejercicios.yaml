  # razonamiento: algorítmico (cada compuerta por separado y luego la AND) · R1
  # verificar: la lista evaluada en las 8 filas.
  - id: disc-14-012
    tipo: conjunto
    dificultad: 3
    conceptos: [circuitos-combinatorios]
    enunciado: >-
      Un circuito con entradas $(x,y,z)$: $g_1=\mathrm{NAND}(x,z)$, $g_2=\mathrm{XOR}(x,y)$ y $F=\mathrm{AND}(g_1,g_2)$. ¿En qué filas vale 1 $F$? Numera de 0 a 7 con $x$ como bit más significativo y escribe los índices separados por comas, como `0, 6`.
    respuesta: ["2", "3", "4"]
    verificar: { python: "{i for i, (x, y, z) in enumerate(itertools.product((0, 1), repeat=3)) if (1 - (x & z)) & (x ^ y)}" }
    pistas:
      - >-
        ¿En qué filas vale 1 cada compuerta por separado? ¿Qué pide una AND de las dos?
      - >-
        ¿Cuándo vale 0 una NAND? ¿Cuándo vale 1 un XOR?
    explicacion: >-
      **$g_2=x\oplus y$** vale 1 cuando $x\neq y$: filas 010, 011, 100 y 101 (2, 3, 4 y 5). **$g_1=\overline{xz}$** vale 0 solo con $x=1$ y $z=1$, en 101 y 111. **$F$** pide las dos: de 2, 3, 4 y 5 se va la 5, donde $g_1=0$, y quedan 2, 3 y 4. Como expresión, $F=\overline{xz}\,(x\oplus y)=(\bar x+\bar z)(\bar xy+x\bar y)=\bar xy+x\bar y\bar z$. Revisa: en la fila 5 (101), $g_1=\overline{1\cdot1}=0$ y $F=0$; en la 4 (100), $g_1=1$ y $g_2=1\oplus0=1$, así que $F=1$.
    tiempo_estimado_s: 75

  # razonamiento: espacial (leer cada celda con las etiquetas de Gray, no con su posición) · R1
  # Trampa: leer las filas en orden de conteo da 1, 3, 4, 6, 10, 13 y 15.
  # verificar: lee el mapa con el código de Gray i ^ (i >> 1) en filas y columnas.
  - id: disc-14-013
    tipo: conjunto
    dificultad: 3
    conceptos: [mapas-karnaugh]
    enunciado: |-
      Este es el mapa de Karnaugh de una función $F(w,x,y,z)$, con filas $wx$ y columnas $yz$ en orden de Gray:

      $$\begin{array}{c|cccc} wx\backslash yz & 00 & 01 & 11 & 10\\\hline 00 & 0 & 1 & 1 & 0\\ 01 & 1 & 0 & 0 & 1\\ 11 & 0 & 0 & 0 & 1\\ 10 & 0 & 1 & 1 & 0\end{array}$$

      Escribe $F$ como $\Sigma m(\dots)$: ¿qué índices lleva? Numera con $w$ como bit más significativo y escribe los índices separados por comas, como `0, 2, 5`.
    respuesta: ["1", "3", "4", "6", "9", "11", "14"]
    verificar: { python: "(lambda g: {4 * g[r] + g[c] for r, fila in enumerate([[0, 1, 1, 0], [1, 0, 0, 1], [0, 0, 0, 1], [0, 1, 1, 0]]) for c, v in enumerate(fila) if v})([i ^ (i >> 1) for i in range(4)])" }
    pistas:
      - >-
        ¿Qué número de 4 bits le toca a cada celda, si juntas la etiqueta de su fila con la de su columna?
      - >-
        ¿La tercera fila del mapa es $wx=10$ o $wx=11$? ¿Y la tercera columna?
    explicacion: >-
      Cada celda es el minitérmino cuyo número sale de juntar la etiqueta de su fila ($wx$) con la de su columna ($yz$). **Fila 00:** columnas 01 y 11, es decir, 0001 y 0011: 1 y 3. **Fila 01:** columnas 00 y 10: 0100 y 0110, 4 y 6. **Fila 11:** columna 10: 1110, 14. **Fila 10:** columnas 01 y 11: 1001 y 1011, 9 y 11. $F=\Sigma m(1,3,4,6,9,11,14)$. La trampa es leer las filas en orden de conteo: si tomas la tercera fila como 10 y la cuarta como 11, sale 1, 3, 4, 6, 10, 13 y 15. Revisa: la celda de la fila 11 y la columna 10 es $m_{14}$, porque $1110=8+4+2=14$, igual que en el mapa de la lección.
    tiempo_estimado_s: 75

