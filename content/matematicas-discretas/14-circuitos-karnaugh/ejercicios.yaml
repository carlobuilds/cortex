    verificar: { python: "(lambda P, F, R: (lambda d: [d[0], F(*P[d[0]]), R(*P[d[0]])] if len(d) == 1 else None)([i for i, v in enumerate(P) if F(*v) != R(*v)]))(list(itertools.product((0, 1), repeat=4)), lambda w, x, y, z: int(8 * w + 4 * x + 2 * y + z in {0, 2, 4, 5, 6, 7, 8, 10, 13}), lambda w, x, y, z: ((1 - w) & x) | ((1 - x) & (1 - z)) | (x & z))" }
