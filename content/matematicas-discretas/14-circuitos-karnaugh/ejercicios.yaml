        ¿Cuántas condiciones lo hacen sonar y a cuál le toca el «excepto»?
      - >-
        ¿Entre columnas vecinas cambia una sola variable? ¿Algún 1 cabe en un grupo mayor si el mapa da la vuelta?
      - >-
        Sin rehacer el mapa, ¿qué da tu expresión donde la frase dice que no suena?
    explicacion: >-
      **Traduce por oración.** «Suena en el recreo, excepto en día de examen» es $x\bar z$; «también suena cada vez que la dirección oprime el botón» es $y$, sin excepción. $F=y+x\bar z$. **Tabla y mapa.** $y$ vale 1 en 010, 011, 110 y 111, y $x\bar z$ en 100 y 110: $F=\Sigma m(2,3,4,6,7)$. En el mapa, $y$ son las columnas 11 y 10 completas, y $\{m_4,m_6\}$ da la vuelta en la fila $x=1$. **Mínima.** $y$ y $x\bar z$ son los únicos primos y los dos son esenciales: 2 términos y 3 literales. **Circuito.** NOT, AND y OR: 3 compuertas, contra 9 de la $\Sigma m$ (NOT de $x$, $y$ y $z$, cinco AND y una OR). Si el «excepto» te tocó también al botón, te salió $\bar z(x+y)=\Sigma m(2,4,6)$. Revisa: en 101 (recreo en día de examen, sin botón) no suena, y en 011 (botón en día de examen) sí.
