    enunciado: >-
      Hipotético: el timbre de una escuela, con $x$ = recreo, $y$ = la dirección oprime el botón y $z$ = día de examen (1 = sí). Suena en el recreo, excepto en día de examen. También suena cada vez que la dirección oprime el botón. En papel: la expresión de cada oración, la tabla, el mapa con sus grupos, la SOP mínima y la lista de compuertas. Revisa en dos filas.
    rubrica:
