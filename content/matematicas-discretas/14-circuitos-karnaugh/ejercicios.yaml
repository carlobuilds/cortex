  # razonamiento: algorítmico (listar primos con la vuelta, tomar esenciales y cubrir lo que falta) · R2
  # Pistas modelo de arquitecto-razonamiento (esquema-14).
  # verificar: plantilla K de M; número de primos, de esenciales y literales de la única mínima.
  - id: disc-14-018
    tipo: completar
    dificultad: 4
    conceptos: [sop-minima]
    enunciado: >-
