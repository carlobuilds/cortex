  - id: disc-14-020
    tipo: completar
    dificultad: 3
    conceptos: [sintesis-circuitos]
    enunciado: >-
      Supón el invernadero de la lección, con sus cuatro sensores en este orden: $w$ (hay agua en el tanque), $s$ (suelo seco), $r$ (llueve) y $n$ (es de noche), cada uno con 1 = sí y $w$ como bit más significativo. La salida $F$ vale 1 si riega, con el tanque o con la red. Cambia la regla: «con agua en el tanque, riega si el suelo está seco; sin agua, usa la red si y solo si el suelo está seco y no llueve (las dos a la vez), a cualquier hora del día o de la noche. En cualquier otro caso, no riega». En el primer hueco escribe 1 (sí) o 0 (no).
    texto: >-
      Sin agua, con suelo seco, sin lluvia y de día, ¿riega? ___ · $F$ tiene ___ minitérminos · su SOP mínima tiene ___ términos y ___ literales, y usa ___ de los cuatro sensores
    respuestas: ["1", "6", "2", "4", "3"]
    verificar: { python: "(lambda f: (lambda F: (lambda r: [f(0, 1, 0, 0), len(F), len(r[2][0]), sum(4 - t.count('-') for t in r[2][0]), len({j for t in r[2][0] for j, c in enumerate(t) if c != '-'})] if len(r[2]) == 1 else None)((lambda n, F: (lambda R: (lambda cov: (lambda P: (lambda E, C: (P, E, [S for S in C if sum(n - t.count('-') for t in S) == min(sum(n - t.count('-') for t in T) for T in C)]))([p for p in P if any(sum(1 for q in P if i in cov(q)) == 1 for i in cov(p))], [S for k in range(1, len(P) + 1) for S in itertools.combinations(P, k) if set().union(*[cov(t) for t in S]) == F]))((lambda I: [p for p in I if not any(q != p and cov(p) < cov(q) for q in I)])([''.join(t) for t in itertools.product('01-', repeat=n) if cov(''.join(t)) and cov(''.join(t)) <= F])))(lambda t: {i for i, r in enumerate(R) if all(c == '-' or int(c) == b for c, b in zip(t, r))}))(list(itertools.product((0, 1), repeat=n))))(4, F)))({i for i, v in enumerate(itertools.product((0, 1), repeat=4)) if f(*v)}))(lambda w, s, r, n: (w & s) | ((1 - w) & s & (1 - r)))" }
    pistas:
      - >-
        ¿A qué parte de la regla le toca el «si y solo si», y qué dice de la hora?
      - >-
        ¿Todos los sensores cambian la salida? ¿Qué grupo te lo mostraría?
    explicacion: >-
      **El caso.** Sin agua ($w=0$), con suelo seco, sin lluvia y de día ($n=0$): la red se usa a cualquier hora, así que riega, 1. Con la regla de la lección («solo de noche») daría 0. **Traduce.** $F=ws+\bar ws\bar r$. $ws$ cubre de 1100 a 1111 (12, 13, 14 y 15), y $\bar ws\bar r$, 0100 y 0101 (4 y 5): 6 minitérminos. **Mapa** (filas $ws$, columnas $rn$). La fila 11 completa da $ws$. $m_4$, $m_5$, $m_{12}$ y $m_{13}$ forman el cuadrado de las filas 01 y 11 con las columnas 00 y 01, donde no cambian $s=1$ ni $r=0$: $s\bar r$. $F=ws+s\bar r$: 2 términos, 4 literales y 3 sensores, porque $n$ sobra. Si se te quedó el «solo de noche» de la lección, sale $\Sigma m(5,12,13,14,15)$; si el «no llueve» también le tocara al tanque con agua, saldría $s\bar r=\Sigma m(4,5,12,13)$. Revisa: en 0100 (sin agua, suelo seco, sin lluvia, de día), $ws+s\bar r=0+1\cdot1=1$, como dice la frase.
