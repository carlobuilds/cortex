    conceptos: [sintesis-circuitos]
    enunciado: >-
      Supón una bomba que sube agua de la cisterna al tinaco, con cuatro entradas en este orden: $w$ (la cisterna tiene agua), $x$ (el tinaco está lleno), $y$ (modo manual) y $z$ (alarma de fuga), cada una con 1 = sí y $w$ como bit más significativo. La regla: «Con la cisterna vacía nunca enciende, pase lo que pase. Con agua en la cisterna, enciende si el tinaco no está lleno, o si la bomba está en modo manual, aunque el tinaco esté lleno (basta una de las dos). Pero si suena la alarma de fuga, no enciende, excepto en modo manual». En el primer hueco escribe 1 (enciende) o 0 (no enciende). Cuenta las compuertas con la convención de la lección.
    texto: >-
      Con agua, tinaco no lleno, sin modo manual y con alarma, ¿enciende? ___ · $F$ tiene ___ minitérminos · su SOP mínima tiene ___ términos y ___ literales · el circuito de la SOP mínima usa ___ compuertas
    respuestas: ["0", "5", "2", "5", "5"]
    verificar: { python: "(lambda f: (lambda F: (lambda r: (lambda S: [f(1, 0, 0, 1), len(F), len(S), sum(4 - t.count('-') for t in S), sum(1 for t in S if 4 - t.count('-') > 1) + int(len(S) > 1) + len({j for t in S for j, c in enumerate(t) if c == '0'})])(r[2][0]) if len(r[2]) == 1 else None)((lambda n, F: (lambda R: (lambda cov: (lambda P: (lambda E, C: (P, E, [S for S in C if sum(n - t.count('-') for t in S) == min(sum(n - t.count('-') for t in T) for T in C)]))([p for p in P if any(sum(1 for q in P if i in cov(q)) == 1 for i in cov(p))], [S for k in range(1, len(P) + 1) for S in itertools.combinations(P, k) if set().union(*[cov(t) for t in S]) == F]))((lambda I: [p for p in I if not any(q != p and cov(p) < cov(q) for q in I)])([''.join(t) for t in itertools.product('01-', repeat=n) if cov(''.join(t)) and cov(''.join(t)) <= F])))(lambda t: {i for i, r in enumerate(R) if all(c == '-' or int(c) == b for c, b in zip(t, r))}))(list(itertools.product((0, 1), repeat=n))))(4, F)))({i for i, v in enumerate(itertools.product((0, 1), repeat=4)) if f(*v)}))(lambda w, x, y, z: w & ((1 - x) | y) & ((1 - z) | y))" }
    pistas:
      - >-
        ¿Qué filas deja fuera la primera oración? ¿Y el «pero»? ¿A qué condición le toca el «excepto»?
      - >-
        Antes de minimizar, ¿qué celdas apaga la alarma? ¿Cuáles de ellas se salvan por el modo manual?
      - >-
        En la fila 1001, ¿qué dice la frase, palabra por palabra? ¿Coincide con tu SOP?
    explicacion: >-
      **El caso.** Con agua y el tinaco no lleno enciende, pero suena la alarma y no está en modo manual: el «pero» manda, y no enciende, 0. **Traduce.** Las dos primeras oraciones dan $w(\bar x+y)$. El «pero… excepto en modo manual» quita las filas con $z=1$ y $y=0$, es decir, multiplica por $\overline{z\bar y}=\bar z+y$: $F=w(\bar x+y)(\bar z+y)$. **Filas.** $w(\bar x+y)$ vale 1 en 8, 9, 10, 11, 14 y 15; el «pero» quita la 9 (1001), y quedan 8, 10, 11, 14 y 15: 5 minitérminos. **Mínima.** $\{m_{10},m_{11},m_{14},m_{15}\}$, de las filas 11 y 10 con las columnas 11 y 10, da $wy$; $m_8$ solo se junta con $m_{10}$, por la vuelta de las columnas: $w\bar x\bar z$. $F=wy+w\bar x\bar z$: 2 términos y 5 literales. **Circuito:** $g_1=\mathrm{NOT}(x)$, $g_2=\mathrm{NOT}(z)$, $g_3=\mathrm{AND}(w,y)$, $g_4=\mathrm{AND}(w,g_1,g_2)$, $F=\mathrm{OR}(g_3,g_4)$: 5 compuertas. Sin el «pero» sale $\Sigma m(8,9,10,11,14,15)=w\bar x+wy$, que enciende en 1001. Revisa: en 1001, $wy+w\bar x\bar z=0+1\cdot1\cdot0=0$, como dice la frase; y en 1011 (con alarma, pero en modo manual), $wy=1$.
