        Traduce cada oración antes de la tabla: $x\bar z$ y $y$. El «excepto» solo toca al recreo: las filas 011 y 111 valen 1.
      - >-
        Llega a $\Sigma m(2,3,4,6,7)$ con columnas $yz=00,01,11,10$. Encierra el grupo de 4 de $y$ y la pareja $\{m_4,m_6\}$, que da la vuelta, sin dejar $m_4$ sola.
      - >-
