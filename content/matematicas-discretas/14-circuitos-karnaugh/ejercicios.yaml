# Unidad 14 · Circuitos y mapas de Karnaugh (Unidad IV, 4.1.4 y 4.1.5; práctica oficial 5, «Síntesis de circuitos
# combinatorios»). Para el 3.er parcial (semana del 23 al 27 de noviembre de 2026).
# Esquema v1 aprobado por Carlo el 2026-11-13 (esquema-14), revisado por experto-matematicas, pedagogo y
# arquitecto-razonamiento. Carlo confirmó que su clase usa las condiciones de «no importa»: entran en la lección, en el 014 y en el jefe.
# Ids en el orden de la tabla del esquema: el 020 es de d3 y va después del 017; el 018 y el 019 son de d4.
# Anclas (primer ejercicio de cada concepto, workedExampleFor): 001 CL, 002 CC, 003 MK, 004 AK, 005 SM y 006 SC, con
# explicación completa; la del 005 y la del 006 llegan hasta la lista de compuertas.
# Un solo concepto por ejercicio, porque workedExampleFor muestra el más fácil de CUALQUIER concepto compartido.
# Abreviaturas: CL compuertas-logicas · CC circuitos-combinatorios · MK mapas-karnaugh · AK agrupar-karnaugh ·
# SM sop-minima · SC sintesis-circuitos.
# Convenciones (también en la `notacion`, y repetidas en cada enunciado que las usa): filas de 0 a 2ⁿ − 1 con la primera
# variable como bit más significativo; mapas con filas x (3 variables) o wx (4 variables) y columnas yz, en orden de Gray
# 00, 01, 11, 10. Implicante primo: un grupo de puros 1 que no cabe en otro de puros 1 más grande. Esencial: un primo que
# es el único en cubrir cierta celda con 1. SOP mínima: una SOP con el menor número de literales, donde cada aparición
# cuenta (en las 65,536 funciones de 4 variables coincide con «menos términos y, a empate, menos literales»). Conteo de compuertas de una SOP en dos niveles: una NOT por variable complementada distinta,
# una AND por término de más de una literal, una OR si hay más de un término, sin límite de entradas.
# `verificar`: solo |, &, ^ y 1 - x sobre 0 y 1 (nunca + ni ~). Las SOP mínimas salen por fuerza bruta con la plantilla
# K(n, F) de experto-matematicas, copiada en cada ejercicio que la usa: los términos son cadenas de '0', '1' y '-' (una
# por variable), y K devuelve (primos, esenciales, coberturas mínimas por literales). El 014 usa KD(n, F, D), que deja a
# los implicantes cubrir celdas de F ∪ D y solo exige cubrir F. Las opciones múltiples verificables llevan
# `valores: ["0", "1", "2", "3"]` y un `verificar` que devuelve el índice de la única opción buena.
# `completar`: huecos fuera de KaTeX y solo enteros. `conjunto`: «escribe los índices separados por comas», con un
# ejemplo de formato que no está en la respuesta.
# Síntesis (006, 020, 021 y 025): cada regla lleva un «solo», un «excepto» o un «pero», y la explicación dice qué
# conjunto sale con la mala lectura; en el 020 y el 025, el primer hueco es justo el caso en palabras donde esa mala
# lectura cambia la salida.
# Pistas como preguntas, sin valores intermedios: 1 en d1–2, 2 en d3 (el 017 lleva 3) y 3 en d4–5. Desde d3, la explicación cierra con
# «Revisa:». Las explicaciones de opción y selección múltiple dicen cuáles son las correctas, porque WorkedExample no
# muestra las opciones.
# Manuales: 017 y 021.
unidad: matematicas-discretas/14-circuitos-karnaugh
ejercicios:
  # razonamiento: algorítmico (evaluar cada compuerta con su tabla) · R0
  # verificar: los operadores de bits de Python sobre 1 y 0.
  - id: disc-14-001
    tipo: completar
    dificultad: 1
    conceptos: [compuertas-logicas]
    enunciado: >-
      Evalúa cada compuerta con las entradas $x=1$ y $y=0$.
    texto: >-
      $\mathrm{AND}(1,0)=$ ___ · $\mathrm{OR}(1,0)=$ ___ · $\mathrm{NAND}(1,0)=$ ___ · $\mathrm{NOR}(1,0)=$ ___ · $\mathrm{XOR}(1,0)=$ ___
    respuestas: ["0", "1", "1", "0", "1"]
    verificar: { python: "[1 & 0, 1 | 0, 1 - (1 & 0), 1 - (1 | 0), 1 ^ 0]" }
    pistas:
      - >-
        ¿Qué operación booleana hace cada compuerta? NAND y NOR, ¿qué le hacen al resultado de AND y al de OR?
    explicacion: >-
      AND es el producto: $1\cdot0=0$, porque necesita que las dos entradas valgan 1. OR es la suma: $1+0=1$, porque basta que una valga 1. NAND es AND negada: $\overline{1\cdot0}=\bar0=1$. NOR es OR negada: $\overline{1+0}=\bar1=0$. XOR vale 1 cuando las entradas son distintas: $1\oplus0=1$. Fíjate en las parejas: con cualquier entrada, NAND da lo contrario de AND y NOR lo contrario de OR.
    tiempo_estimado_s: 40

  # razonamiento: algorítmico (aplicar la convención de conteo término por término) · R0
  # verificar: cuenta sobre los términos escritos como cadenas, solo si esas cadenas cubren exactamente las filas de
  # x̄y + xz (si no, da None y falla).
  - id: disc-14-002
    tipo: completar
    dificultad: 1
    conceptos: [circuitos-combinatorios]
    enunciado: >-
      Cuenta las compuertas del circuito de dos niveles de la SOP $F=\bar xy+xz$, con la convención de la lección: una NOT por cada variable complementada distinta, una AND por cada término de más de una literal y una OR si hay más de un término.
    texto: >-
      AND: ___ · OR: ___ · NOT: ___
    respuestas: ["2", "1", "1"]
    verificar: { python: "(lambda S, cov: [sum(1 for t in S if 3 - t.count('-') > 1), int(len(S) > 1), len({j for t in S for j, c in enumerate(t) if c == '0'})] if set().union(*[cov(t) for t in S]) == {i for i, (x, y, z) in enumerate(itertools.product((0, 1), repeat=3)) if ((1 - x) & y) | (x & z)} else None)(['01-', '1-1'], lambda t: {i for i, b in enumerate(itertools.product((0, 1), repeat=3)) if all(c == '-' or int(c) == v for c, v in zip(t, b))})" }
    pistas:
      - >-
        ¿Cuántos términos tiene la suma, y cuántas literales tiene cada uno? ¿Qué variables llevan barra?
    explicacion: >-
      Los términos son $\bar xy$ y $xz$, los dos de dos literales: 2 AND. Hay más de un término, así que 1 OR los suma. La única variable con barra es $x$: 1 NOT. La lista: $g_1=\mathrm{NOT}(x)$, $g_2=\mathrm{AND}(g_1,y)$, $g_3=\mathrm{AND}(x,z)$, $F=\mathrm{OR}(g_2,g_3)$, con 4 compuertas en total. Las AND forman el primer nivel y la OR el segundo; la NOT solo prepara la entrada $\bar x$.
    tiempo_estimado_s: 40

  # razonamiento: espacial (ubicar la celda y sus lados, con la vuelta) · R0
  # verificar: arma la cuadrícula con el código de Gray i ^ (i >> 1) y busca las celdas a un paso, con la vuelta.
  - id: disc-14-003
    tipo: conjunto
    dificultad: 1
    conceptos: [mapas-karnaugh]
    enunciado: >-
      En el mapa de Karnaugh de 3 variables $(x,y,z)$, con filas $x=0,1$ y columnas $yz=00,01,11,10$, ¿qué celdas son vecinas de $m_4$? Cuenta la vuelta. Escribe los índices separados por comas, como `2, 7`.
    respuesta: ["0", "5", "6"]
    verificar: { python: "(lambda g: (lambda G: {G[(r + dr) % 2][(c + dc) % 4] for r in range(2) for c in range(4) if G[r][c] == 4 for dr, dc in [(1, 0), (-1, 0), (0, 1), (0, -1)]})([[4 * r + g[c] for c in range(4)] for r in range(2)]))([i ^ (i >> 1) for i in range(4)])" }
    pistas:
      - >-
        ¿En qué fila y columna está $m_4$? ¿Qué celdas tocan sus lados, y cuál queda del otro lado del mapa por la vuelta?
    explicacion: >-
      $4=100$: $m_4$ está en la fila $x=1$ y la columna $yz=00$. Sus vecinas son, arriba, $m_0$ (000); a la derecha, $m_5$ (101); y, por la vuelta, la celda de la última columna de su fila, $m_6$ (110), porque las columnas 00 y 10 difieren en un bit. Cada vecina difiere de 100 en una sola variable: $m_0$ en $x$, $m_5$ en $z$ y $m_6$ en $y$. Con 3 variables, cada celda tiene 3 vecinas, una por variable. $m_7$ (111) no es vecina: difiere en dos.
    tiempo_estimado_s: 40

  # razonamiento: espacial (de un producto a su grupo de celdas) · R0
  # Término yz̄ y no x̄z, porque la lección ya resuelve x̄z = {m1, m3} dos veces (§6 y el primer desvanecido).
  # verificar: las filas donde yz̄ vale 1, por enumeración.
  - id: disc-14-004
    tipo: conjunto
    dificultad: 1
    conceptos: [agrupar-karnaugh]
    enunciado: >-
      En el mapa de 3 variables $(x,y,z)$, ¿qué celdas forman el grupo del término $y\bar z$? Las celdas se numeran con $x$ como bit más significativo (la 101 es la 5). Escribe los índices separados por comas, como `0, 4`.
    respuesta: ["2", "6"]
    verificar: { python: "{i for i, (x, y, z) in enumerate(itertools.product((0, 1), repeat=3)) if y & (1 - z)}" }
    pistas:
      - >-
        ¿Qué variables fija $y\bar z$, y en qué valor? ¿Cuál queda libre, y cuántas celdas salen?
    explicacion: >-
      $y\bar z$ fija $y=1$ y $z=0$, y deja libre a $x$, así que cubre $2^1=2$ celdas: 010 y 110, es decir, $m_2$ y $m_6$. En el mapa están en la columna $yz=10$, en las filas $x=0$ y $x=1$: son vecinas, porque solo cambia $x$. Al revés funciona igual: de un grupo se lee el producto con las variables que no cambian. Cada variable que falta en el término duplica las celdas del grupo.
    tiempo_estimado_s: 35

  # razonamiento: espacial (ver el grupo de 4 y leer la variable que no cambia) · R0
  # Explicación completa hasta la lista de compuertas (ancla de SM). Nombra los tres pasos del procedimiento, porque es
  # el ejemplo resuelto que se muestra al fallar cualquier ejercicio de SOP mínima.
  # verificar: plantilla K de M; términos y literales de la única cobertura mínima.
  - id: disc-14-005
    tipo: completar
    dificultad: 1
    conceptos: [sop-minima]
    enunciado: >-
      Sea $F(x,y,z)=\Sigma m(4,5,6,7)$. Con el mapa de 3 variables, encuentra su SOP mínima.
    texto: >-
      Términos: ___ · literales: ___
    respuestas: ["1", "1"]
    verificar: { python: "(lambda r: [len(r[2][0]), sum(3 - t.count('-') for t in r[2][0])] if len(r[2]) == 1 else None)((lambda n, F: (lambda R: (lambda cov: (lambda P: (lambda E, C: (P, E, [S for S in C if sum(n - t.count('-') for t in S) == min(sum(n - t.count('-') for t in T) for T in C)]))([p for p in P if any(sum(1 for q in P if i in cov(q)) == 1 for i in cov(p))], [S for k in range(1, len(P) + 1) for S in itertools.combinations(P, k) if set().union(*[cov(t) for t in S]) == F]))((lambda I: [p for p in I if not any(q != p and cov(p) < cov(q) for q in I)])([''.join(t) for t in itertools.product('01-', repeat=n) if cov(''.join(t)) and cov(''.join(t)) <= F])))(lambda t: {i for i, r in enumerate(R) if all(c == '-' or int(c) == b for c, b in zip(t, r))}))(list(itertools.product((0, 1), repeat=n))))(3, {4, 5, 6, 7}))" }
    pistas:
      - >-
        ¿Dónde quedan esas cuatro celdas en el mapa? ¿Qué variable vale lo mismo en las cuatro?
    explicacion: >-
      **(1) Marca los 1.** Las cuatro celdas, 100, 101, 111 y 110, son toda la fila $x=1$: un grupo de 4 en el que solo $x$ no cambia, y $y$ y $z$ toman todos sus valores. Primo: la fila $x=1$, que no cabe en un grupo de 8 porque la fila $x=0$ vale 0. **(2) Esencial:** $x$, el único primo. **(3) No falta nada.** El producto es $x$: 1 término con 1 literal, y $F=x$. **El circuito:** una literal sola no necesita AND, y con un solo término no hace falta OR, así que la lista queda vacía: la salida es el alambre de la entrada $x$, con 0 compuertas. Sin agrupar, la $\Sigma m$ tendría 4 términos de 3 literales.
    tiempo_estimado_s: 40

  # razonamiento: deductivo (traducir la regla con el alcance del «solo») · R1
  # Explicación completa hasta la lista de compuertas (ancla de SC). Caso hipotético y original.
  # verificar: la regla traducida, (z + x)ȳ, evaluada en las 8 filas.
  - id: disc-14-006
    tipo: conjunto
    dificultad: 1
    conceptos: [sintesis-circuitos]
    enunciado: >-
      Supón la alarma de una bodega con tres sensores, en este orden: $x$ (la puerta está abierta), $y$ (es horario laboral) y $z$ (hay movimiento), cada uno con 1 = sí. La regla: «suena si hay movimiento o si la puerta está abierta (basta una de las dos), pero en los dos casos solo fuera del horario laboral». ¿En qué filas vale 1? Numera de 0 a 7 con $x$ como bit más significativo y escribe los índices separados por comas, como `2, 6`.
    respuesta: ["1", "4", "5"]
    verificar: { python: "{i for i, (x, y, z) in enumerate(itertools.product((0, 1), repeat=3)) if (z | x) & (1 - y)}" }
    pistas:
      - >-
        ¿Qué parte de la regla es un «o», y a qué parte le toca el «solo fuera del horario»?
    explicacion: >-
      **Traduce.** «Movimiento o puerta abierta» es $z+x$, y «solo fuera del horario» multiplica todo por $\bar y$: $F=(x+z)\bar y$. **Filas.** Con $y=0$ y al menos uno de $x$ y $z$ en 1: 001, 100 y 101, es decir, 1, 4 y 5. **SOP mínima.** En el mapa, $\{m_4,m_5\}$ da $x\bar y$ y $\{m_1,m_5\}$ da $\bar yz$; los dos son esenciales y $F=x\bar y+\bar yz$. **Circuito:** $g_1=\mathrm{NOT}(y)$, $g_2=\mathrm{AND}(x,g_1)$, $g_3=\mathrm{AND}(g_1,z)$, $F=\mathrm{OR}(g_2,g_3)$. Si el «solo fuera del horario» tocara solo a la puerta, saldría $x\bar y+z$, con las filas 1, 3, 4, 5 y 7.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (evaluar cada compuerta en 00) · R1
  # verificar: cada compuerta como función de bits, evaluada en (0, 0) (True = da 1).
  - id: disc-14-007
    tipo: seleccion_multiple
    dificultad: 2
    conceptos: [compuertas-logicas]
    enunciado: >-
      ¿Cuáles compuertas dan 1 con las entradas $x=0$ y $y=0$? Puede haber varias.
    opciones:
      - "OR"
      - "NAND"
      - "AND"
      - "XOR"
      - "NOR"
    correctas: [1, 4]
    verificar: { python: "[f(0, 0) == 1 for f in [lambda x, y: x | y, lambda x, y: 1 - (x & y), lambda x, y: x & y, lambda x, y: x ^ y, lambda x, y: 1 - (x | y)]]" }
    pistas:
      - >-
        Con las dos entradas en 0, ¿cuánto valen $xy$, $x+y$ y $x\oplus y$? ¿Qué cambia al negar?
    explicacion: >-
      Dan 1 NAND y NOR; AND, OR y XOR dan 0. Con $x=y=0$: AND es $0\cdot0=0$, OR es $0+0=0$ y XOR es $0\oplus0=0$, porque las entradas son iguales. NAND niega a AND: $\overline{0\cdot0}=1$. NOR niega a OR: $\overline{0+0}=1$. En 00 solo encienden las negadas; en 11, en cambio, NAND y NOR dan 0.
    tiempo_estimado_s: 40

  # razonamiento: algorítmico (seguir la lista compuerta por compuerta) · R1
  # verificar: NAND y NOR como funciones de bits, y F = OR de las dos en los tres puntos.
  - id: disc-14-008
    tipo: completar
    dificultad: 2
    conceptos: [circuitos-combinatorios]
    enunciado: >-
      Un circuito con entradas $(x,y,z)$: $g_1=\mathrm{NAND}(x,y)$, $g_2=\mathrm{NOR}(y,z)$ y $F=\mathrm{OR}(g_1,g_2)$. Evalúa $F$ en tres entradas.
    texto: >-
      $F(1,1,0)=$ ___ · $F(1,1,1)=$ ___ · $F(0,0,0)=$ ___
    respuestas: ["0", "0", "1"]
    verificar: { python: "(lambda N, R: (lambda F: [F(1, 1, 0), F(1, 1, 1), F(0, 0, 0)])(lambda x, y, z: N(x, y) | R(y, z)))(lambda a, b: 1 - (a & b), lambda a, b: 1 - (a | b))" }
    pistas:
      - >-
        ¿Cuánto vale cada compuerta, en orden, con la primera entrada? ¿Cuándo da 0 una NAND, y cuándo da 1 una NOR?
    explicacion: >-
      Se evalúa compuerta por compuerta. **(1,1,0):** $g_1=\overline{1\cdot1}=0$, $g_2=\overline{1+0}=0$ y $F=0+0=0$. **(1,1,1):** $g_1=0$, $g_2=\overline{1+1}=0$ y $F=0$. **(0,0,0):** $g_1=\overline{0\cdot0}=1$, y con eso $F=1$, sin importar $g_2$ (que también vale 1). Como expresión, $F=\overline{xy}+\overline{y+z}=\bar x+\bar y+\bar y\bar z=\bar x+\bar y$: vale 0 solo si $x=y=1$, como en las dos primeras entradas.
    tiempo_estimado_s: 50

  # razonamiento: espacial (ubicar la celda en el mapa de 4 y sus cuatro lados) · R1
  # verificar: cuadrícula de 4 × 4 con el código de Gray i ^ (i >> 1) en filas y columnas, y la vuelta en las dos.
  - id: disc-14-009
    tipo: conjunto
    dificultad: 2
    conceptos: [mapas-karnaugh]
    enunciado: >-
      En el mapa de Karnaugh de 4 variables $(w,x,y,z)$, con filas $wx=00,01,11,10$ y columnas $yz=00,01,11,10$, ¿qué celdas son vecinas de $m_5$? Cuenta la vuelta. Escribe los índices separados por comas, como `0, 2`.
    respuesta: ["1", "4", "7", "13"]
    verificar: { python: "(lambda g: (lambda G: {G[(r + dr) % 4][(c + dc) % 4] for r in range(4) for c in range(4) if G[r][c] == 5 for dr, dc in [(1, 0), (-1, 0), (0, 1), (0, -1)]})([[4 * g[r] + g[c] for c in range(4)] for r in range(4)]))([i ^ (i >> 1) for i in range(4)])" }
    pistas:
      - >-
        ¿En qué fila y columna está $m_5$? ¿Cuántas vecinas tiene una celda con 4 variables?
    explicacion: >-
      $5=0101$: fila $wx=01$ y columna $yz=01$. Sus cuatro vecinas, una por variable, son: arriba, $m_1$ (0001, cambia $x$); abajo, $m_{13}$ (1101, cambia $w$; la fila de abajo es la 11, no la 10); a la izquierda, $m_4$ (0100, cambia $z$); y a la derecha, $m_7$ (0111, cambia $y$). Aquí no hace falta la vuelta, pero con 4 variables toda celda tiene 4 vecinas, con vuelta o sin ella. Si pusiste $m_9$, leíste las filas en orden de conteo, y si pusiste $m_6$, las columnas: 1001 y 0110 difieren de 0101 en dos bits.
    tiempo_estimado_s: 45

  # razonamiento: espacial (un grupo es el conjunto de celdas de un producto) · R1
  # verificar: para cada conjunto, si es exactamente el de las celdas de alguno de los 81 productos de 4 variables.
  - id: disc-14-010
    tipo: seleccion_multiple
    dificultad: 2
    conceptos: [agrupar-karnaugh]
    enunciado: >-
      En un mapa de Karnaugh de 4 variables (filas $wx$ y columnas $yz$ en orden de Gray), ¿cuáles de estos conjuntos de celdas son un grupo válido, es decir, un rectángulo de $2^k$ celdas que puede dar la vuelta? Puede haber varias.
    opciones:
      - >-
        $\{m_1,m_3,m_5\}$
      - >-
        $\{m_0,m_2,m_8,m_{10}\}$
      - >-
        $\{m_3,m_{11}\}$
      - >-
        $\{m_5,m_6\}$
      - >-
        $\{m_0,m_1,m_4,m_5\}$
      - >-
        $\{m_0,m_1,m_3,m_2\}$
    correctas: [1, 2, 4, 5]
    verificar: { python: "[any({i for i, b in enumerate(itertools.product((0, 1), repeat=4)) if all(c == '-' or int(c) == v for c, v in zip(''.join(t), b))} == g for t in itertools.product('01-', repeat=4)) for g in [{1, 3, 5}, {0, 2, 8, 10}, {3, 11}, {5, 6}, {0, 1, 4, 5}, {0, 1, 3, 2}]]" }
    pistas:
      - >-
        ¿Cuántas celdas tiene cada conjunto? En los de tamaño correcto, ¿hay variables que no cambien en ninguna de sus celdas?
    explicacion: >-
      Son grupos $\{m_0,m_1,m_3,m_2\}$, $\{m_0,m_2,m_8,m_{10}\}$, $\{m_0,m_1,m_4,m_5\}$ y $\{m_3,m_{11}\}$; no lo son $\{m_1,m_3,m_5\}$ ni $\{m_5,m_6\}$. Un grupo válido es justo el conjunto de celdas de un producto. $\{m_0,m_1,m_3,m_2\}$ es la fila 00: $\bar w\bar x$. $\{m_0,m_2,m_8,m_{10}\}$ son las cuatro esquinas, que se juntan por las dos vueltas: $\bar x\bar z$. $\{m_0,m_1,m_4,m_5\}$ es un cuadrado de $2\times2$: $\bar w\bar y$. $\{m_3,m_{11}\}$ está en las filas 00 y 10 de la columna 11, vecinas por la vuelta: $\bar xyz$. $\{m_1,m_3,m_5\}$ tiene 3 celdas, y 3 no es potencia de 2. $m_5$ y $m_6$ (0101 y 0110) difieren en dos variables: no son vecinas.
    tiempo_estimado_s: 50

  # razonamiento: espacial (el grupo de 8 y el cuadrado encimado) · R1
  # Distractores, uno por error: grupo no máximo (4 literales), no juntar dos filas (6) y dejar fuera una celda.
  # verificar: plantilla K de M; índice de la única opción igual a F con el mínimo de literales.
  - id: disc-14-011
    tipo: opcion_multiple
    dificultad: 2
    conceptos: [sop-minima]
    enunciado: >-
      ¿Cuál es la SOP mínima de $F(w,x,y,z)=\Sigma m(0,1,4,5,6,7,12,13,14,15)$?
    opciones:
      - >-
        $\bar wx+wx+\bar w\bar y$
      - >-
        $x+\bar w\bar y\bar z$
      - >-
        $x+\bar w\bar y$
      - >-
        $x+\bar w\bar x\bar y$
    valores: ["0", "1", "2", "3"]
    correcta: 2
