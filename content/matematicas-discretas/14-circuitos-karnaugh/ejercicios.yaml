    verificar: { python: "(lambda r: (lambda S: [sum(1 for t in S if 4 - t.count('-') > 1), int(len(S) > 1), len({j for t in S for j, c in enumerate(t) if c == '0'})] if len(r[2]) == 1 else None)(r[2][0]))((lambda n, F: (lambda R: (lambda cov: (lambda P: (lambda E, C: (P, E, [S for S in C if sum(n - t.count('-') for t in S) == min(sum(n - t.count('-') for t in T) for T in C)]))([p for p in P if any(sum(1 for q in P if i in cov(q)) == 1 for i in cov(p))], [S for k in range(1, len(P) + 1) for S in itertools.combinations(P, k) if set().union(*[cov(t) for t in S]) == F]))((lambda I: [p for p in I if not any(q != p and cov(p) < cov(q) for q in I)])([''.join(t) for t in itertools.product('01-', repeat=n) if cov(''.join(t)) and cov(''.join(t)) <= F])))(lambda t: {i for i, r in enumerate(R) if all(c == '-' or int(c) == b for c, b in zip(t, r))}))(list(itertools.product((0, 1), repeat=n))))(4, {0, 1, 2, 3, 5, 6, 7, 8, 9, 10, 11}))" }
    pistas:
      - >-
        ¿Qué grupo de 8 hay en el mapa? ¿Qué celdas quedan fuera de él?
      - >-
        Para las que faltan, ¿cuál es el grupo más grande que contiene a cada una, aunque se encime?
      - >-
        ¿Un término de una sola literal necesita AND? ¿Contaste dos veces la NOT de una variable que aparece en dos términos?
    explicacion: >-
      **Mínima.** Las filas 00 y 10 del mapa (celdas 0 a 3 y 8 a 11) son las ocho con $x=0$: $\bar x$. Fuera quedan $m_5$, $m_6$ y $m_7$, en la fila 01. $m_5$ y $m_7$ caben en el cuadrado $\{m_1,m_3,m_5,m_7\}$, que da $\bar wz$; $m_6$ y $m_7$, en $\{m_2,m_3,m_6,m_7\}$, que da $\bar wy$. Los tres son esenciales: $F=\bar x+\bar wy+\bar wz$. **Compuertas.** $\bar x$ es una literal sola: va directo a la OR, sin AND. $\bar wy$ y $\bar wz$ llevan 2 AND, y 1 OR suma los tres términos. Las variables con barra son $x$ y $w$: 2 NOT, y la de $w$ sirve a los dos términos. Lista: $g_1=\mathrm{NOT}(x)$, $g_2=\mathrm{NOT}(w)$, $g_3=\mathrm{AND}(g_2,y)$, $g_4=\mathrm{AND}(g_2,z)$, $F=\mathrm{OR}(g_1,g_3,g_4)$. Si contaste 3 AND, le pusiste una a $\bar x$; si contaste 3 NOT, repetiste la de $w$. Revisa: $m_4$ (0100) no está en $F$, y ahí $\bar x+\bar wy+\bar wz=0+0+0=0$.
