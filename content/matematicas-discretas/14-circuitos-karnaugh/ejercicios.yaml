  # razonamiento: deductivo (De Morgan para leer cada lista de NAND) · R1
  # verificar: NAND como función de bits; índice de la única lista que coincide con x | y en las 4 entradas.
  - id: disc-14-016
    tipo: opcion_multiple
    dificultad: 3
    conceptos: [compuertas-logicas]
    enunciado: >-
      ¿Cuál de estos circuitos, hechos solo con NAND, da $\mathrm{OR}(x,y)=x+y$?
    opciones:
      - >-
        $\mathrm{NAND}(\mathrm{NAND}(x,y),\mathrm{NAND}(x,y))$
      - >-
        $\mathrm{NAND}(\mathrm{NAND}(x,x),y)$
      - >-
        $\mathrm{NAND}(g,g)$, con $g=\mathrm{NAND}(\mathrm{NAND}(x,x),\mathrm{NAND}(y,y))$
      - >-
        $\mathrm{NAND}(\mathrm{NAND}(x,x),\mathrm{NAND}(y,y))$
    valores: ["0", "1", "2", "3"]
    correcta: 3
    verificar: { python: "(lambda N: (lambda L: L[0] if len(L) == 1 else None)([i for i, f in enumerate([lambda x, y: N(N(x, y), N(x, y)), lambda x, y: N(N(x, x), y), lambda x, y: N(N(N(x, x), N(y, y)), N(N(x, x), N(y, y))), lambda x, y: N(N(x, x), N(y, y))]) if all(f(x, y) == (x | y) for x in (0, 1) for y in (0, 1))]))(lambda a, b: 1 - (a & b))" }
    pistas:
      - >-
        ¿Qué da $\mathrm{NAND}(x,x)$? Con De Morgan, ¿cómo se escribe $x+y$ como la negación de un producto?
      - >-
        Para cada opción, ¿qué expresión sale si la lees de adentro hacia afuera?
    explicacion: >-
      La correcta es $\mathrm{NAND}(\mathrm{NAND}(x,x),\mathrm{NAND}(y,y))$. Como $\mathrm{NAND}(x,x)=\overline{xx}=\bar x$, esa lista es $\overline{\bar x\,\bar y}=\bar{\bar x}+\bar{\bar y}=x+y$, por De Morgan. Las otras: $\mathrm{NAND}(\mathrm{NAND}(x,y),\mathrm{NAND}(x,y))$ niega dos veces el producto y da $xy$, que es AND; $\mathrm{NAND}(\mathrm{NAND}(x,x),y)=\overline{\bar xy}=x+\bar y$; y $\mathrm{NAND}(g,g)=\bar g$ niega la correcta y da $\overline{x+y}$, que es NOR. Revisa en $(x,y)=(1,0)$: la correcta da $\overline{\bar1\cdot\bar0}=\overline{0\cdot1}=1$, igual que $1+0$.
    tiempo_estimado_s: 75

  # razonamiento: abductivo (de un grupo imposible a la causa: las etiquetas) · R1
  # Revisión manual (opción múltiple conceptual). Comprobado por enumeración: 001 y 010 difieren en 2 bits, y {1, 2} no
  # es el conjunto de celdas de ningún producto de 3 variables. El mapa de Paco es Σm(1, 2, 5) con columnas 00, 01, 10, 11.
  # Tres pistas, aunque es de d3 (docs/05 permite hasta 3): la 1 es nueva (arreglos del 2026-11-14) y las otras dos son
  # las que tenía, en el mismo orden.
  - id: disc-14-017
    tipo: opcion_multiple
    dificultad: 3
    conceptos: [agrupar-karnaugh]
    enunciado: |-
      Paco busca la SOP mínima de $F(x,y,z)=\Sigma m(1,2,5)$. Dibujó el mapa con las columnas en este orden y encerró en un grupo $m_1$ y $m_2$, que le quedaron juntas en la fila $x=0$:

      $$\begin{array}{c|cccc} x\backslash yz & 00 & 01 & 10 & 11\\\hline 0 & 0 & 1 & 1 & 0\\ 1 & 0 & 1 & 0 & 0\end{array}$$

      ¿Qué hizo mal?
    opciones:
      - >-
        Olvidó la vuelta: la primera y la última columna son vecinas, y el grupo debía cruzar de una a la otra.
      - >-
        Los grupos deben tener 4 celdas; uno de 2 no sirve.
      - >-
        Sus columnas no van en orden de Gray: $m_1$ (001) y $m_2$ (010) difieren en dos variables, así que no son vecinas ni forman un grupo.
      - >-
        Debía agrupar los ceros, no los unos.
    correcta: 2
    verificar: { revision: "manual" }
    pistas:
      - >-
        ¿Qué deben cumplir dos celdas para formar un grupo de 2? ¿Lo cumplen $m_1$ y $m_2$?
      - >-
        ¿Entre cada par de columnas seguidas de Paco cambia un solo bit?
      - >-
        ¿Hay algún producto que valga 1 justo en las celdas 001 y 010, y en ninguna otra?
    explicacion: >-
      El error es el orden: las columnas de Paco no van en orden de Gray, porque entre 01 y 10 cambian los dos bits. Por eso $m_1=\bar x\bar yz$ y $m_2=\bar xy\bar z$ le quedaron juntas, pero difieren en $y$ y en $z$: ningún producto vale 1 justo en esas dos celdas, así que no son un grupo. Con el orden de Gray (00, 01, 11, 10), $m_2$ pasa a la última columna. Las demás opciones no son el problema: la vuelta no tiene que ver (en el mapa de Paco, las orillas de esa fila valen 0; con Gray, $m_2$ queda en la orilla, pero $m_0$ vale 0), un grupo de 2 es válido y una SOP agrupa unos. Revisa: con el orden de Gray, $m_1$ se agrupa con $m_5$ en $\bar yz$, y $m_2$ se queda sola, en $\bar xy\bar z$.
    tiempo_estimado_s: 60

  # razonamiento: deductivo (alcance del «si y solo si» y de «a cualquier hora»; comparar con el gancho) · R2
  # Variante del invernadero de la lección (hipotético). Pistas de arquitecto-razonamiento, ajustadas a este caso.
  # verificar: la regla traducida; el caso en palabras, sus filas y, con la plantilla K de M, términos, literales y
