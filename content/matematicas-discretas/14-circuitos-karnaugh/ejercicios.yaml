  # razonamiento: deductivo (demostrar o refutar afirmaciones generales sobre las SOP mínimas) · R4
  # Demostraciones de experto-matematicas; pistas modelo de arquitecto-razonamiento (esquema-14).
  # verificar: las 255 funciones no nulas de 3 variables (v024 de M, ajustado a estas 5 opciones). Para cada una: primos,
  # esenciales, el mínimo de literales entre las coberturas con primos y TODAS las coberturas con implicantes
  # cualesquiera que no lo superan (con a lo más mínimo + 1 términos, porque cada término salvo «1» tiene una literal o
  # más). En orden: [toda mínima es de primos (y nada tiene menos literales), la mínima es única, si todo primo es
  # esencial la mínima es única, sin esenciales => constante, toda mínima lleva los esenciales]. La función del 023 es
  # el contraejemplo de 4 variables que da la explicación. Fuera del jefe desde el 2026-11-14: su explicación, que el jefe
  # muestra tras cada respuesta, resuelve el 023.
  - id: disc-14-024
    tipo: seleccion_multiple
    dificultad: 5
    conceptos: [sop-minima]
    enunciado: >-
      Una SOP mínima es una suma de productos con el menor número de literales (cada aparición cuenta: $\bar wy+\bar wz$ tiene 4). ¿Cuáles de estas afirmaciones son ciertas para toda función booleana? Puede haber varias.
    opciones:
      - >-
        Toda SOP mínima está hecha de implicantes primos.
      - >-
        La SOP mínima de una función es única.
      - >-
        Si todo implicante primo de la función es esencial, su SOP mínima es única.
      - >-
        Si una función no tiene primos esenciales, es constante.
      - >-
        Toda SOP mínima usa todos los primos esenciales.
    correctas: [0, 2, 4]
    verificar: { python: "(lambda R: (lambda cov, lits: (lambda info: [all(all(lits(S) == b and all(t in P for t in S) for S in low) for F, P, e, b, low in info), all(sum(1 for S in low if lits(S) == b) == 1 for F, P, e, b, low in info), all(sum(1 for S in low if lits(S) == b) == 1 for F, P, e, b, low in info if set(e) == set(P)), all(len(e) > 0 or len(F) == 8 for F, P, e, b, low in info), all(all(set(e) <= set(S) for S in low if lits(S) == b) for F, P, e, b, low in info)])([(lambda F: (lambda I: (lambda P: (lambda e, b: (F, P, e, b, [S for k in range(1, b + 2) for S in itertools.combinations(I, k) if lits(S) <= b and set().union(*[cov(t) for t in S]) == F]))([p for p in P if any(sum(1 for q in P if i in cov(q)) == 1 for i in cov(p))], min(lits(S) for k in range(1, len(P) + 1) for S in itertools.combinations(P, k) if set().union(*[cov(t) for t in S]) == F)))([p for p in I if not any(q != p and cov(p) < cov(q) for q in I)]))([''.join(t) for t in itertools.product('01-', repeat=3) if cov(''.join(t)) and cov(''.join(t)) <= F]))({i for i in range(8) if f >> i & 1}) for f in range(1, 256)]))(lambda t: {i for i, r in enumerate(R) if all(c == '-' or int(c) == b for c, b in zip(t, r))}, lambda S: sum(3 - t.count('-') for t in S)))(list(itertools.product((0, 1), repeat=3)))" }
    pistas:
      - >-
        ¿Qué basta para tumbar un «siempre»? ¿Qué función de esta unidad cumple la hipótesis que sospechas?
      - >-
        Para las que resisten, supón una SOP mínima que las rompa: ¿puedes mejorarla? ¿Qué contradice eso?
      - >-
        ¿Tu contraejemplo cumple la hipótesis y rompe la conclusión? ¿Dónde usaste «mínima» y dónde «esencial»?
    explicacion: >-
      Son ciertas «toda SOP mínima está hecha de implicantes primos», «toda SOP mínima usa todos los primos esenciales» y «si todo implicante primo es esencial, la SOP mínima es única»; son falsas «la mínima es única» y «sin esenciales, es constante». **De primos.** Si una SOP mínima tuviera un término que no es primo, ese grupo cabría en uno más grande, cuyo producto tiene menos literales y tampoco cubre ningún 0. Al cambiarlo, la SOP seguiría siendo igual a $F$ con menos literales, y no sería mínima. **Con los esenciales.** Un esencial es el único primo que cubre cierta celda con 1. Toda SOP mínima está hecha de primos y debe cubrir esa celda, así que lo lleva. **Única si todos son esenciales.** Toda mínima lleva todos los esenciales y solo primos; si todos los primos son esenciales, lleva todos los primos y nada más, así que solo hay una. **Las falsas.** $\Sigma m(3,4,6,7,9,11,12,13)$, de $(w,x,y,z)$, no es constante y no tiene esenciales (cada celda está en dos primos de 2 celdas), y tiene dos SOP mínimas distintas: $\bar wxy+\bar xyz+w\bar yz+x\bar y\bar z$ y $\bar wyz+w\bar xz+wx\bar y+\bar wx\bar z$. Tumba las dos de un golpe. Revisa: el contraejemplo cumple la hipótesis de las dos falsas («no tiene esenciales», o ninguna) y rompe su conclusión; y cada demostración usa «mínima» (no se pueden quitar literales) o «esencial» (único primo de una celda).
    tiempo_estimado_s: 240

