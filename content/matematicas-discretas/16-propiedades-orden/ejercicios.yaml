  # razonamiento: deductivo (tumbar un «siempre» con un orden concreto o demostrarlo bajando) · R4
  # Afirmaciones y demostraciones de experto-matematicas, todas con «finito no vacío»; pistas de
  # arquitecto-razonamiento, tal cual. Hace par con disc-15-013 en el jefe (tumbar un «siempre»). Sus contraejemplos,
  # {6, 7} y {3, 6, 15, 30}, no son datos de otra pregunta del jefe.
  # verificar: todos los órdenes parciales sobre {0, …, n − 1}, n = 1 a 4 (1 + 3 + 19 + 219).
  - id: disc-16-024
    tipo: seleccion_multiple
    dificultad: 5
    conceptos: [extremos-orden, orden-total]
    enunciado: >-
      Sea $(A,\preceq)$ un orden parcial con $A$ finito y no vacío. ¿Cuáles de estas afirmaciones valen siempre? Puede haber varias.
    opciones:
      - >-
        $A$ tiene al menos un minimal.
      - >-
        Si $A$ tiene un solo minimal, ese minimal es el mínimo.
      - >-
        Si el orden es total, $A$ tiene mínimo.
      - >-
        Si $A$ tiene mínimo, ese mínimo es el único minimal.
      - >-
        Todo minimal de $A$ es mínimo.
      - >-
        Si $A$ tiene un solo minimal y un solo maximal, el orden es total.
    correctas: [0, 1, 2, 3]
    verificar: { python: "(lambda P: (lambda mins, mn, maxs, tot: [all(len(mins(A, R)) >= 1 for (A, R) in P), all(mn(A, R) == mins(A, R) for (A, R) in P if len(mins(A, R)) == 1), all(len(mn(A, R)) == 1 for (A, R) in P if tot(A, R)), all(mins(A, R) == mn(A, R) for (A, R) in P if mn(A, R)), all(mins(A, R) == mn(A, R) for (A, R) in P), all(tot(A, R) for (A, R) in P if len(mins(A, R)) == 1 and len(maxs(A, R)) == 1)])(lambda A, R: [m for m in A if not any(x != m and (x, m) in R for x in A)], lambda A, R: [m for m in A if all((m, x) in R for x in A)], lambda A, R: [m for m in A if not any(x != m and (m, x) in R for x in A)], lambda A, R: all((a,b) in R or (b,a) in R for a in A for b in A)))([(list(range(n)), S) for n in range(1,5) for off in [[(a,b) for a in range(n) for b in range(n) if a != b]] for S in ({(a,a) for a in range(n)} | {off[i] for i in range(len(off)) if m >> i & 1} for m in range(2 ** len(off))) if all(a == b or (b,a) not in S for (a,b) in S) and all((a,d) in S for (a,b) in S for (c,d) in S if b == c)])" }
    pistas:
      - >-
        ¿Qué basta para tumbar un «siempre», y qué hace falta para aceptarlo?
      - >-
        Dibuja Hasse de hasta 4 elementos: ¿en cuál falla cada afirmación dudosa?
      - >-
        En las que no tumbaste: si bajas mientras haya alguien debajo, ¿qué garantiza que te detengas?
    explicacion: >-
      Valen siempre las cuatro primeras: hay un minimal; un único minimal es el mínimo; un orden total tiene mínimo; y si hay mínimo, es el único minimal. Fallan «todo minimal es mínimo» y «un solo minimal y un solo maximal hacen total el orden». **Bajar:** desde cualquier $x$, si alguien está debajo, se baja a él, y así sucesivamente. No se puede volver a un elemento ya visitado: por transitividad, dos elementos distintos del camino quedarían cada uno debajo del otro, contra la antisimetría; como $A$ es finito, el descenso se detiene, y se detiene en un minimal que está debajo de $x$. **Hay un minimal:** $A$ no es vacío, así que hay un $x$ de dónde bajar. **Un solo minimal $m$:** desde cualquier $x$ se baja hasta un minimal, que tiene que ser $m$; así, $m\preceq x$ para todo $x$, y $m$ es el mínimo. **Total:** un minimal $m$ se compara con todos, y como nadie distinto queda debajo, $m\preceq x$ para todo $x$. **Con mínimo $m$:** $m$ es minimal: si $x\preceq m$, como también $m\preceq x$, la antisimetría da $x=m$. Y si $x$ es minimal, $m\preceq x$ y nadie distinto de $x$ está debajo de $x$, así que $x=m$. **Las que fallan**, con un orden concreto: en $\{6,7\}$ con $\mid$, el 6 es minimal y no es mínimo, porque no divide al 7; en $\{3,6,15,30\}$ con $\mid$, el único minimal es el 3 y el único maximal, el 30, pero el 6 y el 15 no se comparan. Revisa: las hipótesis importan; en $\varnothing$ no hay minimales, y en $(\mathbb Z,\le)$, que es infinito, tampoco.
    tiempo_estimado_s: 180

  # razonamiento: analógico (traducir un plan de tareas a orden, extremos, cadena más larga y Hasse) · R2
  # Transferencia, hipotético. Dependencias de experto-matematicas; solo cambia la letra de «entrenar» (e en lugar de t),
  # para que cada tarea vaya con su inicial. La explicación no dice que un único maximal sea el máximo, porque es la
  # dual de una opción del 024 y los dos van en el jefe.
  # verificar: las tareas sin flechas de llegada y sin flechas de salida, la cadena más larga en la cerradura transitiva
  # (por fuerza bruta sobre subconjuntos) y las dependencias que se recuperan sin ellas.
  - id: disc-16-025
    tipo: completar
    dificultad: 5
    conceptos: [diagrama-hasse, extremos-orden]
    enunciado: >-
      Supón un proyecto de aprendizaje automático con nueve tareas: $r$ recolectar datos, $l$ limpiarlos, $d$ dividirlos en entrenamiento y prueba, $n$ normalizar, $a$ elegir la arquitectura, $e$ entrenar, $v$ validar, $g$ hacer gráficas exploratorias e $i$ escribir el informe. Cada dependencia $x\to y$ dice que $y$ no puede empezar hasta que termine $x$: $r\to l$, $l\to d$, $d\to n$, $n\to e$, $e\to v$, $v\to i$, $l\to g$, $g\to i$, $a\to e$, $r\to d$, $d\to e$ y $l\to i$. Ordénalas con «$x\preceq y$ si $x=y$, o si $y$ espera a $x$, directa o indirectamente». Cada tarea dura un día, y el mismo día se pueden hacer varias, sin límite.
    texto: >-
      Número de tareas que pueden empezar sin esperar a ninguna: ___ · número de tareas finales, a las que ninguna espera: ___ · menor número de días para terminar las nueve: ___ · número de dependencias de la lista que no son líneas del Hasse: ___
    respuestas: ["2", "1", "7", "3"]
    verificar: { python: "(lambda T, E: (lambda clo: (lambda C: [sum(1 for x in T if not any(b == x for (a,b) in E)), sum(1 for x in T if not any(a == x for (a,b) in E)), max(len(S) for k in range(1, len(T) + 1) for S in itertools.combinations(T, k) if all(x == y or (x,y) in C or (y,x) in C for x in S for y in S)), sum(1 for p in E if p in clo(E - {p}))])(clo(E)))(lambda S: (lambda f: f(f(f(f(S)))))(lambda Q: Q | {(a,d) for (a,b) in Q for (c,d) in Q if b == c})))(list('rldnevgia'), {('r','l'),('l','d'),('d','n'),('n','e'),('e','v'),('v','i'),('l','g'),('g','i'),('a','e'),('r','d'),('d','e'),('l','i')})" }
    pistas:
      - >-
        ¿Qué son, en el orden, las tareas que no esperan a ninguna y las que ninguna espera?
      - >-
        Si cada tarea dura un día, ¿qué te obliga a tardar más: el número de tareas o la cadena de esperas más larga?
      - >-
        Para cada dependencia $x\to y$, ¿hay otro camino de $x$ a $y$ en la lista?
    explicacion: >-
      **El orden** es como el de las materias de la lección: reflexivo por el «$x=y$», transitivo por el «indirectamente» y antisimétrico porque no hay esperas en círculo. **Empiezan sin esperar** los minimales, las tareas a las que no llega ninguna flecha: $r$ y $a$, 2. **Finales** son los maximales, de los que no sale ninguna flecha: solo $i$, 1. **Días:** la cadena más larga, $r\to l\to d\to n\to e\to v\to i$, tiene 7 tareas, y cada una espera a la anterior, así que no baja de 7 días. Y 7 alcanzan: el día $k$ se hacen las tareas cuya cadena más larga hasta ellas tiene $k$ tareas (día 1, $r$ y $a$; día 2, $l$; día 3, $d$ y $g$; días 4 a 7, $n$, $e$, $v$ e $i$). **Sobran en el Hasse** las que salen por transitividad: $r\to d$, por $l$; $d\to e$, por $n$; y $l\to i$, por $g$: 3. Las otras 9 son coberturas. Revisa: con las 9 coberturas se recuperan las 3 que sobraron subiendo, y la cadena de 7 usa solo coberturas.
    tiempo_estimado_s: 180
