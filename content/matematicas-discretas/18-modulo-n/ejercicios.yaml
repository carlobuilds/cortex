  # razonamiento: deductivo (demostrar con la definición de n ∣ m, una letra por «existe») · R3
  # Datos y modelo del producto de experto-matematicas; rúbrica con la estructura de arquitecto-razonamiento (definición
  # con «existe» y una letra distinta por cada uno). Revisión manual. La respuesta modelo cumple cada criterio: escribe la
  # definición y prueba con enteros cualesquiera, con 0 = n · 0 (1); nombra cada propiedad con letras distintas, k y m,
  # y llega a b − a = n(−k) y a − c = n(k + m) (2); hace la suma con a' = a + nk y b' = b + nm (3); y llega a
  # a'b' = ab + n(am + bk + nkm), dice por qué el paréntesis es entero y cierra con «bien definidas» (4).
  - id: disc-18-019
    tipo: autoevaluacion
    dificultad: 4
    conceptos: [congruencia-modulo, aritmetica-modular]
    enunciado: >-
      En papel. Sea $n\ge2$. Escribe la definición de $n\mid m$ antes de usarla. **(1)** Demuestra que la congruencia módulo $n$, $a\equiv b\pmod{n}$ si $n\mid a-b$, es una relación de equivalencia sobre $\mathbb Z$. **(2)** Demuestra que la suma y el producto de clases están bien definidos: si $a'\equiv a$ y $b'\equiv b\pmod{n}$, entonces $a'+b'\equiv a+b$ y $a'b'\equiv ab\pmod{n}$.
    rubrica:
      - >-
        Escribe «$n\mid m$ si existe $k\in\mathbb Z$ con $m=nk$» y prueba cada propiedad con enteros cualesquiera, no con ejemplos. Reflexiva: $a-a=0=n\cdot0$, con $0\in\mathbb Z$.
      - >-
        Nombra cada propiedad y usa una letra distinta para cada «existe». Simétrica: de $a-b=nk$ llega a $b-a=n(-k)$. Transitiva: de $a-b=nk$ y $b-c=nm$ llega a $a-c=n(k+m)$.
      - >-
        Para la suma, escribe $a'=a+nk$ y $b'=b+nm$, con letras distintas, y llega a $(a'+b')-(a+b)=n(k+m)$.
      - >-
        Para el producto, llega a $a'b'=ab+n(am+bk+nkm)$ y dice por qué $am+bk+nkm$ es entero. Cierra con lo que significa «bien definido»: el resultado no depende del elemento que se tome de cada clase.
    respuesta_modelo: >-
      Uso la definición: $n\mid m$ si existe $k\in\mathbb Z$ con $m=nk$. Sean $a,b,c\in\mathbb Z$ cualesquiera. **(1) Reflexiva:** $a-a=0=n\cdot0$, con $0\in\mathbb Z$, así que $a\equiv a$. **Simétrica:** si $a\equiv b$, hay $k\in\mathbb Z$ con $a-b=nk$; entonces $b-a=n(-k)$, con $-k\in\mathbb Z$, así que $b\equiv a$. **Transitiva:** si $a\equiv b$ y $b\equiv c$, hay $k,m\in\mathbb Z$ con $a-b=nk$ y $b-c=nm$; entonces $a-c=(a-b)+(b-c)=n(k+m)$, con $k+m\in\mathbb Z$, así que $a\equiv c$. **(2)** Si $a'\equiv a$ y $b'\equiv b$, hay $k,m\in\mathbb Z$ con $a'=a+nk$ y $b'=b+nm$. **Suma:** $(a'+b')-(a+b)=nk+nm=n(k+m)$, así que $a'+b'\equiv a+b$. **Producto:** $a'b'=(a+nk)(b+nm)=ab+anm+bnk+n^2km=ab+n(am+bk+nkm)$, y $am+bk+nkm$ es entero porque los enteros son cerrados bajo la suma y el producto; así, $a'b'\equiv ab$. Por eso $[a]+[b]=[a+b]$ y $[a][b]=[ab]$ no dependen del elemento que se tome de cada clase: están bien definidas. Revisa: con $n=5$, $7\equiv2$ y $8\equiv3$, y $7\cdot8=56\equiv1\equiv2\cdot3$.
    verificar: { revision: "manual" }
    pistas:
      - >-
        ¿Qué dice $n\mid m$ con un «existe»? Escríbelo antes que nada.
      - >-
        Para la transitiva, ¿cómo escribes $a-c$ con $a-b$ y $b-c$? ¿Usaste una letra distinta para cada «existe»?
      - >-
        En el producto, al sustituir $a'=a+nk$ y $b'=b+nm$, ¿qué término no lleva un factor $n$?
    explicacion: >-
      **La definición primero:** $n\mid m$ si existe $k\in\mathbb Z$ con $m=nk$; cada paso termina en «es $n$ por un entero». **Reflexiva:** $a-a=n\cdot0$. **Simétrica:** $b-a=-(a-b)=n(-k)$. **Transitiva:** $a-c=(a-b)+(b-c)=n(k+m)$. Con la misma $k$ en las dos hipótesis, solo probaste el caso en que los dos cocientes coinciden. **Suma y producto:** con $a'=a+nk$ y $b'=b+nm$, la suma difiere de $a+b$ en $n(k+m)$, y el producto, $a'b'-ab=n(am+bk+nkm)$; el único término sin $n$ es $ab$. Probarlo con números no basta: un ejemplo no cubre todos los enteros. Revisa: con $n=6$, $9\equiv3$ y $10\equiv4$, y $9\cdot10=90\equiv0\equiv3\cdot4$.
    tarjeta: false
    tiempo_estimado_s: 360

  # razonamiento: algorítmico (el procedimiento que califica el parcial: revisar los módulos par por par, sustituir,
  # despejar sin dividir y comprobar en todas) · R2
  # De arquitecto-razonamiento, tal cual: rúbrica, respuesta modelo y pistas (las comillas rectas de los criterios 1 y 3
  # pasan a «…», como en la 16). Revisión manual. Verificado con sympy (crt) y por enumeración: 259 módulo 440.
  - id: disc-18-020
    tipo: autoevaluacion
    dificultad: 4
    conceptos: [teorema-chino-residuo]
    enunciado: >-
      En papel, como en el parcial. Resuelve a mano el sistema $x\equiv4\pmod{5}$, $x\equiv3\pmod{8}$, $x\equiv6\pmod{11}$. Antes de calcular, di cuántas soluciones hay y módulo qué número; al final, comprueba tu resultado.
    rubrica:
      - >-
        Antes de calcular, revisa que 5, 8 y 11 son coprimos dos a dos y anuncia que hay una sola solución módulo 440. No basta decir «son primos»: 8 no lo es.
      - >-
        Sustituye $x=3+8k$ en la de módulo 5, llega a $3k\equiv1$ y a $k\equiv2$ ($3\cdot2=6\equiv1$), y escribe $x=19+40j$. Otro orden vale. No cuenta $x=19+8j$: el nuevo módulo es el producto de los módulos usados.
      - >-
        Reduce a $7j\equiv9\pmod{11}$ y halla $7^{-1}\equiv8$ por Euclides ($1=2\cdot11-3\cdot7$) o mostrando $7\cdot8=56\equiv1$; llega a $j\equiv6$. No cuenta «dividir entre 7».
      - >-
        Da $x\equiv259\pmod{440}$ y lo sustituye en las tres: $259=51\cdot5+4=32\cdot8+3=23\cdot11+6$. No basta revisar la última congruencia, que se cumple por construcción.
    respuesta_modelo: >-
      Los módulos son coprimos dos a dos, así que la solución es única módulo 440. Con $x=3+8k$ queda $3k\equiv1\pmod{5}$, de donde $k\equiv2$ y $x=19+40j$. Luego $8+7j\equiv6\pmod{11}$, o sea $7j\equiv9$. Como $1=2\cdot11-3\cdot7$, $7^{-1}\equiv8$ y $j\equiv72\equiv6$. Entonces $x=259+440t$. Revisa: $259=51\cdot5+4=32\cdot8+3=23\cdot11+6$.
    verificar: { revision: "manual" }
    pistas:
      - >-
        ¿Qué deben cumplir los módulos para que haya una sola solución? ¿Módulo cuánto? Revísalo par por par.
      - >-
        ¿Puedes resolver primero solo dos? Escribe una como $x=r+mk$ y sustitúyela en otra: ¿qué congruencia queda para $k$?
      - >-
        Si te queda $ak\equiv b$, ¿cómo despejas sin dividir? Al final, ¿sustituiste en las tres?
    explicacion: >-
      **Antes de calcular:** $\mathrm{mcd}(5,8)=\mathrm{mcd}(5,11)=\mathrm{mcd}(8,11)=1$, así que hay una sola solución módulo $5\cdot8\cdot11=440$; que 8 no sea primo no importa. **Primera ronda:** $x=3+8k$ en la de módulo 5 da $3+3k\equiv4$, o sea $3k\equiv1$ y $k\equiv2$; entonces $x=3+8(2+5j)=19+40j$, con módulo $8\cdot5=40$, no 8. **Segunda ronda:** $19+40j\equiv6\pmod{11}$ da $8+7j\equiv6$, o sea $7j\equiv9$; se multiplica por $7^{-1}\equiv8$, nunca se «divide entre 7». **Al final:** $x\equiv259\pmod{440}$, y se sustituye en las tres. La de módulo 11 se cumple por construcción; un error de la primera ronda aparece al revisar las otras dos. Revisa: $259+440=699$ también cumple las tres, porque $699=139\cdot5+4=87\cdot8+3=63\cdot11+6$.
    tarjeta: false
    tiempo_estimado_s: 300

  # razonamiento: algorítmico (d = mcd(18, 42) = 6 ∣ 30; dividir todo entre 6 y listar las 6) · R2
  # La explicación despeja 3x ≡ 5 (mod 7) con 5 ≡ 12 y cancela el 3, sin dar 3⁻¹ mod 7, que sirve en el 025.
  # verificar: los x de {0, …, 41} con 42 ∣ 18x − 30.
  - id: disc-18-021
    tipo: conjunto
    dificultad: 4
    conceptos: [congruencias-lineales]
    enunciado: >-
      Escribe todas las soluciones de $18x\equiv30\pmod{42}$ en $\{0,1,\dots,41\}$, como `1, 2`.
    respuesta: ["4", "11", "18", "25", "32", "39"]
    verificar: { python: "{x for x in range(42) if (18 * x - 30) % 42 == 0}" }
    pistas:
      - >-
        ¿Cuánto vale $\mathrm{mcd}(18,42)$, y divide a 30? ¿Cuántas soluciones da eso?
      - >-
        Si divides entre el mcd, ¿qué le pasa al módulo?
      - >-
        Con la solución de la congruencia reducida, ¿de cuánto en cuánto van las demás en $\{0,\dots,41\}$?
    explicacion: >-
      **¿Hay?** $d=\mathrm{mcd}(18,42)=6$ y $6\mid30$: hay exactamente 6 soluciones. **Reducir:** se divide todo entre 6, incluido el módulo: $3x\equiv5\pmod{7}$. Como $5\equiv12\pmod{7}$, queda $3x\equiv3\cdot4$, y como $\mathrm{mcd}(3,7)=1$, se cancela el 3: $x\equiv4\pmod{7}$. **Las 6:** de 7 en 7 desde el 4, $\{4,11,18,25,32,39\}$. Un error común es dividir entre 6 sin cambiar el módulo: $3x\equiv5\pmod{42}$ no tiene solución, porque $\mathrm{mcd}(3,42)=3\nmid5$. Revisa: $18\cdot11=198=4\cdot42+30$.
    tiempo_estimado_s: 120

  # razonamiento: inductivo (buscar la potencia que vuelve al 1 y quedarse con el resto del exponente) · R2
  # verificar: el entero exacto 3²⁰²⁶ y sus dos últimas cifras como texto, sin aritmética modular.
  - id: disc-18-022
    tipo: numerico
    dificultad: 4
    conceptos: [aritmetica-modular]
    enunciado: >-
      ¿Qué número forman las dos últimas cifras de $3^{2026}$?
    respuesta: 29
    tolerancia: 0
    verificar: { python: "int(str(3 ** 2026)[-2:])" }
    pistas:
      - >-
        ¿Qué operación módulo algo te da las dos últimas cifras de un número?
      - >-
        Con cuadrados sucesivos, ¿cuánto valen $3^2$, $3^4$, $3^8$ y $3^{16}$ módulo 100? ¿Hay una potencia chica que dé 1?
      - >-
        Si $3^p\equiv1$, ¿qué parte de 2026 importa?
    explicacion: >-
      Las dos últimas cifras de $N$ son $N\bmod100$. **Cuadrados:** módulo 100, $3^2=9$, $3^4=81$, $3^8\equiv81^2=6561\equiv61$ y $3^{16}\equiv61^2=3721\equiv21$. **Un periodo:** $3^{20}=3^{16}\cdot3^4\equiv21\cdot81=1701\equiv1$. **El exponente:** $2026=20\cdot101+6$, así que $3^{2026}=(3^{20})^{101}\cdot3^6\equiv3^6=729\equiv29$. Las dos últimas cifras son 29. Aquí $2026\bmod100=26$ daría lo mismo, solo porque $3^{20}\equiv1$ y $20\mid100$; con otro módulo falla. Revisa por otro camino: $3^{10}=59049\equiv49$, y $49^2=2401\equiv1$, que confirma $3^{20}\equiv1$.
    tiempo_estimado_s: 150

  # razonamiento: deductivo (tumbar un «siempre» con un n concreto o demostrarlo con inversos y el lema de Euclides) · R4
  # De experto-matematicas, con n ≥ 2; pistas de arquitecto-razonamiento, con «siempre» entre comillas latinas y «tablas
  # de multiplicar» en lugar de «tablas». La explicación no da la regla de cancelación con n/mcd(c, n), que decidiría
  # opciones del 014 y el 021.
  # verificar: n de 2 a 30 y a, b, c en {0, …, n − 1}, con inversos, primos y mcd por búsqueda.
  - id: disc-18-023
    tipo: seleccion_multiple
    dificultad: 5
    conceptos: [inverso-modular, aritmetica-modular]
    enunciado: >-
      Sea $n\ge2$. ¿Cuáles de estas afirmaciones valen siempre, para todo $n\ge2$ y todos los enteros $a$, $b$ y $c$? Puede haber varias.
    opciones:
      - >-
        Si $\mathrm{mcd}(c,n)=1$ y $ac\equiv bc\pmod{n}$, entonces $a\equiv b\pmod{n}$.
      - >-
        Si $ab\equiv0\pmod{n}$, entonces $a\equiv0\pmod{n}$ o $b\equiv0\pmod{n}$ (o ambas).
      - >-
        Si $n$ es primo y $ab\equiv0\pmod{n}$, entonces $a\equiv0\pmod{n}$ o $b\equiv0\pmod{n}$ (o ambas).
      - >-
        Si $c\not\equiv0\pmod{n}$ y $ac\equiv bc\pmod{n}$, entonces $a\equiv b\pmod{n}$.
      - >-
        $n$ es primo si y solo si todas las clases de $\mathbb Z_n$ distintas de $[0]_n$ tienen inverso.
      - >-
        Si $a$ y $b$ tienen inverso módulo $n$, entonces $a+b$ también tiene inverso módulo $n$.
    correctas: [0, 2, 4]
    verificar: { python: "(lambda N, u, p, g: [all((a - b) % n == 0 for n in N for c in range(n) if g(c, n) == 1 for a in range(n) for b in range(n) if (a * c - b * c) % n == 0), all(a % n == 0 or b % n == 0 for n in N for a in range(n) for b in range(n) if (a * b) % n == 0), all(a % n == 0 or b % n == 0 for n in N if p(n) for a in range(n) for b in range(n) if (a * b) % n == 0), all((a - b) % n == 0 for n in N for c in range(1, n) for a in range(n) for b in range(n) if (a * c - b * c) % n == 0), all(all(u(a, n) for a in range(1, n)) == p(n) for n in N), all(u((a + b) % n, n) for n in N for a in range(n) if u(a, n) for b in range(n) if u(b, n))])(range(2, 31), lambda a, n: any((a * x - 1) % n == 0 for x in range(n)), lambda n: n > 1 and all(n % q for q in range(2, n)), lambda a, b: max(d for d in range(1, max(a, b) + 1) if a % d == 0 and b % d == 0))" }
    pistas:
      - >-
        ¿Hablan de todo $n\ge2$ o solo de algunos? ¿Qué basta para tumbar un «siempre», y qué hace falta para aceptarlo?
      - >-
        Haz las tablas de multiplicar de $\mathbb Z_4$, $\mathbb Z_5$ y $\mathbb Z_6$. ¿Dónde sale un 0 fuera de la fila y la columna del 0? ¿Dónde tiene un 1 cada fila no nula?
      - >-
        Si $n=rs$ con $1<r,s<n$, ¿cuánto vale $[r][s]$? ¿Puede $[r]$ tener inverso? Si $n$ es primo y $n\mid ab$, ¿qué sabes de $a$ o de $b$?
    explicacion: >-
      Valen «si $\mathrm{mcd}(c,n)=1$, se cancela $c$», «con $n$ primo, $ab\equiv0$ obliga a $a\equiv0$ o $b\equiv0$» y «$n$ es primo si y solo si todas las clases no nulas tienen inverso»; las otras tres fallan. **Contraejemplos:** $3\cdot5=15\equiv0\pmod{15}$, con $3\not\equiv0$ y $5\not\equiv0$. $2\cdot1\equiv2\cdot5\pmod{8}$, porque $10-2=8$, con $2\not\equiv0$ y $1\not\equiv5$. El 1 y el 6 tienen inverso módulo 7, pero $1+6\equiv0$, que no lo tiene. **Las que valen:** si $\mathrm{mcd}(c,n)=1$, $c$ tiene inverso, y multiplicar $ac\equiv bc$ por él da $a\equiv b$. Si $n$ es primo y $n\mid ab$, el lema de Euclides da $n\mid a$ o $n\mid b$. Para la de los inversos: si $n$ es primo y $[a]\neq[0]$, entonces $n\nmid a$, así que $\mathrm{mcd}(a,n)=1$ y hay inverso; si $n$ no es primo, $n=rs$ con $1<r,s<n$, y $[r]$ no tiene inverso, porque $\mathrm{mcd}(r,n)=r>1$. Revisa: en $\mathbb Z_6$, $[2][3]=[0]$, y la fila del 2 en la tabla de multiplicar, 0, 2, 4, 0, 2, 4, no tiene ningún 1.
    tiempo_estimado_s: 180

  # razonamiento: analógico (llevar un calendario de tareas a un sistema de congruencias, y reconocer módulos no
  # coprimos) · R2
  # Transferencia, hipotético (M). Los días de cada tarea van listados en el enunciado, para que «desde el día 3» no
  # tenga dos lecturas. La explicación sustituye en el orden 5, 9, 8 (5k ≡ 3 (mod 9), k ≡ 6; 5j ≡ 3 (mod 8), j ≡ 7;
  # arreglos-18, M): no resuelve ninguna congruencia módulo 5, así que no repite la cuenta 2x ≡ 3 (mod 5) del 025, que
  # va en la misma oleada, ni pasa por el 4j ≡ 5 (mod 9) del orden 8, 5, 9. Huecos 2 y 3 reescritos (arreglos-18): «cada
  # cuántos días vuelven a coincidir» da 360 sin la duda entre 360 y 359.
  # verificar: simula los días 0 a 3000 con conjuntos, sin congruencias.
  - id: disc-18-024
    tipo: completar
    dificultad: 5
    conceptos: [teorema-chino-residuo, clases-residuo]
    enunciado: >-
      Supón que un servidor corre cuatro tareas programadas, con los días contados desde el día 0: un respaldo cada 8 días desde el día 3 (días 3, 11, 19, …), una limpieza cada 9 días desde el día 5 (días 5, 14, 23, …), un reporte cada 5 días desde el día 2 (días 2, 7, 12, …) y una auditoría cada 6 días desde el día 4 (días 4, 10, 16, …). En el hueco de sí o no, escribe 1 (sí) o 0 (no).
    texto: >-
      Número del primer día en que corren el respaldo, la limpieza y el reporte, el mismo día: ___ · cada cuántos días vuelven a coincidir esas tres: ___ · en cuántos de los días 0 a 1000, los dos incluidos, corren esas tres: ___ · ¿la auditoría coincide algún día con el respaldo? ___
    respuestas: ["347", "360", "2", "0"]
    verificar: { python: "(lambda R, L, P, L6: (lambda C: [C[0], C[1] - C[0], len([d for d in C if d <= 1000]), int(len(R & L6) > 0)])(sorted(R & L & P)))(set(range(3, 3001, 8)), set(range(5, 3001, 9)), set(range(2, 3001, 5)), set(range(4, 3001, 6)))" }
    pistas:
      - >-
        ¿Qué congruencia cumple un día en que corre el respaldo? ¿Y uno de la limpieza, y uno del reporte?
      - >-
        ¿Son coprimos dos a dos 8, 9 y 5? Entonces, ¿cada cuánto se repite la solución?
      - >-
        Para la auditoría y el respaldo, 8 y 6 no son coprimos: ¿qué tienen que cumplir sus días módulo $\mathrm{mcd}(8,6)$?
    explicacion: >-
      **Las congruencias:** el respaldo corre los días con $x\equiv3\pmod{8}$; la limpieza, con $x\equiv5\pmod{9}$; y el reporte, con $x\equiv2\pmod{5}$. 8, 9 y 5 son coprimos dos a dos, así que hay una sola solución módulo 360. **Por sustitución:** de la del reporte, $x=2+5k$, y en la de la limpieza queda $2+5k\equiv5$, o sea $5k\equiv3\pmod{9}$; con $5\cdot2=10\equiv1$, $k\equiv6$, así que $x=2+5(6+9j)=32+45j$. En la del respaldo, como $32\equiv0$ y $45\equiv5\pmod{8}$, queda $5j\equiv3$; con $5\cdot5=25\equiv1$, $j\equiv15\equiv7$, y $x=32+315=347$. **Las cuentas:** las tres coinciden los días 347, 707, 1067, …, de 360 en 360; del 0 al 1000, dos veces. **La auditoría:** los días del respaldo son impares, porque $x=3+8k$, y los de la auditoría son pares, porque $x=4+6t$: nunca coinciden. Aquí el teorema chino no aplica, porque 8 y 6 comparten el 2. Revisa: $347=43\cdot8+3=38\cdot9+5=69\cdot5+2$.
    tiempo_estimado_s: 180

  # razonamiento: algorítmico (resolver cada lineal, ver que la de módulo 10 es una clase módulo 5 y juntarlas con el
  # teorema chino) · R2
  # La explicación da x ≡ 3 (mod 7) comprobando 3 · 3 = 9 ≡ 2, sin dar 3⁻¹ mod 7, que sirve en el 021.
  # verificar: los x de {0, …, 69} que cumplen las dos, por búsqueda.
  - id: disc-18-025
    tipo: conjunto
    dificultad: 5
    conceptos: [congruencias-lineales, teorema-chino-residuo]
    enunciado: >-
      Escribe todos los $x\in\{0,1,\dots,69\}$ que cumplen a la vez $3x\equiv2\pmod{7}$ y $4x\equiv6\pmod{10}$, como `5, 40`.
    respuesta: ["24", "59"]
    verificar: { python: "{x for x in range(70) if (3 * x - 2) % 7 == 0 and (4 * x - 6) % 10 == 0}" }
    pistas:
      - >-
        ¿Cuántas soluciones tiene cada congruencia por separado, y módulo qué número?
      - >-
        ¿$4x\equiv6\pmod{10}$ equivale a una sola congruencia con otro módulo?
      - >-
        Con las dos en la forma $x\equiv r\pmod{m}$, ¿los módulos son coprimos? ¿Cuántas veces cabe su producto en $\{0,\dots,69\}$?
    explicacion: >-
      **La primera:** $\mathrm{mcd}(3,7)=1$, así que tiene una sola solución módulo 7, y es $x\equiv3$, porque $3\cdot3=9\equiv2$. **La segunda:** $\mathrm{mcd}(4,10)=2$ y $2\mid6$; se divide todo entre 2: $2x\equiv3\pmod{5}$, y como $2\cdot4=8\equiv3$, $x\equiv4\pmod{5}$. En $\{0,\dots,9\}$ son el 4 y el 9, una sola clase módulo 5. **Juntas:** $x\equiv3\pmod{7}$ y $x\equiv4\pmod{5}$, con 7 y 5 coprimos. Con $x=3+7k$ queda $3+2k\equiv4$, o sea $2k\equiv1$ y $k\equiv3$, así que $x\equiv24\pmod{35}$. **En $\{0,\dots,69\}$:** el 24 y el $24+35=59$. Revisa: $3\cdot59=177=25\cdot7+2$ y $4\cdot59=236=23\cdot10+6$.
    tiempo_estimado_s: 150
