  # razonamiento: deductivo (contraejemplo o argumento con n − 1 aristas) · R2
  # Sobre todos los grafos simples de 6 vértices (2^15), M. «Garantizan» (no «siempre»). Errores que rechaza el
  # verificar (neg.py): agregar «5 aristas» o «sin ciclos», y quitar la (4).
  # verificar: enumera los 32,768 grafos simples con 6 vértices y prueba cada condición.
  - id: disc-21-007
    tipo: seleccion_multiple
    dificultad: 2
    conceptos: [arbol]
    enunciado: >-
      Un grafo simple tiene 6 vértices. ¿Cuáles de estas condiciones garantizan que es un árbol? Puede haber varias.
    opciones:
      - >-
        Es conexo y tiene 5 aristas.
      - >-
        Tiene 5 aristas.
      - >-
        No tiene ciclos y tiene 5 aristas.
      - >-
        Es conexo y tiene 6 aristas.
      - >-
        Es conexo, y al quitarle cualquier arista deja de ser conexo.
      - >-
        No tiene ciclos.
    correctas: [0, 2, 4]
    verificar: { python: "(lambda GS, R: (lambda con, acy: (lambda tree: [all(tree(E) for E in GS if con(E) and len(E) == 5), all(tree(E) for E in GS if len(E) == 5), all(tree(E) for E in GS if acy(E) and len(E) == 5), all(tree(E) for E in GS if con(E) and len(E) == 6), all(tree(E) for E in GS if con(E) and all(not con([f for f in E if f != e]) for e in E)), all(tree(E) for E in GS if acy(E))])(lambda E: con(E) and acy(E)))(lambda E: R(E, 0) == set(range(6)), lambda E: all(e[1] not in R([f for f in E if f != e], e[0]) for e in E)))([[P[i] for i in range(15) if m >> i & 1] for P in [list(itertools.combinations(range(6), 2))] for m in range(1 << 15)], lambda E, s: list(itertools.accumulate(range(6), lambda S, _: S | {w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x in S}, initial={s}))[-1])" }
    pistas:
      - >-
        Para descartar una, ¿qué grafo de 6 vértices la cumple sin ser árbol? Para aceptarla, ¿qué te falta probar: que es conexo o que no tiene ciclos?
    explicacion: >-
      Garantizan que es árbol «conexo y 5 aristas», «sin ciclos y 5 aristas» y «conexo, y quitar cualquier arista lo desconecta»; las otras tres no. **Las que no:** un ciclo de 5 vértices más un vértice suelto tiene 5 aristas y no es conexo; un árbol de 6 vértices tiene 5 aristas, así que uno conexo con 6 no es árbol: tiene un ciclo; y 6 vértices sueltos no tienen ciclos, pero no son conexos. **Conexo y 5 aristas:** si tuviera un ciclo, quitar una arista del ciclo lo dejaría conexo; repitiendo, quedaría un árbol de 6 vértices con menos de 5 aristas, y no lo hay. **Sin ciclos y 5 aristas:** cada componente es un árbol; con $k$ componentes de $n_1,\dots,n_k$ vértices hay $(n_1-1)+\dots+(n_k-1)=6-k$ aristas, así que $k=1$. **Toda arista desconecta:** una arista de un ciclo se puede quitar sin desconectar, así que no hay ciclos. Comprueba: en un árbol, quitar cualquier arista lo desconecta, porque era la única trayectoria entre sus extremos.
