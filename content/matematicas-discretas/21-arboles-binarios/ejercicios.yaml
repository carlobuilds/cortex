        ¿Cuántos padres tiene un vértice distinto de la raíz? ¿Cuántos hijos puede tener un vértice?
      - >-
        ¿Qué distingue a un camino de una trayectoria? Si quitas un vértice que tiene dos vecinos, ¿siguen unidos esos dos vecinos?
    explicacion: >-
      Valen «la regla del padre es función», «toda arista es puente» y «entre dos vértices distintos hay exactamente una trayectoria»; las otras tres no. **Padre:** cada vértice distinto de la raíz tiene un padre, y uno solo, el que le sigue en su trayectoria a la raíz; la regla le da exactamente un valor. **Hijo:** una hoja no tiene hijos, y un vértice puede tener dos o más, así que a unos la regla no les da valor y a otros les daría varios. **Trayectoria:** hay una porque el árbol es conexo, y no dos, porque la unión de dos trayectorias distintas entre los mismos vértices contiene un ciclo. **Puente:** si al quitar la arista $uv$ quedara una trayectoria de $u$ a $v$, con la arista cerraría un ciclo. **Camino:** un camino puede repetir; si $uv$ es arista, $u,v$ y $u,v,u,v$ son dos caminos distintos. **Quitar un vértice:** en el árbol con raíz $b$ e hijos $a$ y $c$, quitar $b$ deja a $a$ y a $c$ sin arista entre ellos. Revisa: cada arista une a un vértice con su padre y es la de uno solo, su extremo más lejano de la raíz; hay una por cada vértice distinto de la raíz: $n-1$.
