# Unidad 21 · Árboles binarios (Unidad IV, 4.5.5, que el programa numera 4.4.5, y práctica 8, «Recorridos»). Novena y
# última unidad de la IV; trae el jefe final del programa. Para el 3.er parcial (semana del 23 al 27 de noviembre de 2026).
# Esquema v1 aprobado por Carlo el 2026-11-14 (esquema-21), revisado por experto-matematicas (M), pedagogo (P),
# arquitecto-razonamiento (A) y linguista (L). Datos y `verificar` de M (herramientas/m21/verificar-21.py, v1, con el
# 014 corregido de `next` a `min`), comprobados por la sesión principal con código propio; el autor volvió a calcular
# con código propio (recorridos iterativos con pila explícita, reconstrucción por «la raíz parte el inorden» con
# unicidad por fuerza bruta entre todas las formas, y pila para las posfijas y la prefija) cada recorrido, árbol,
# número y paso de las explicaciones y de la lección.
# Ids en el orden de la tabla del v1, escalera 6/6/6/4/3: d1 001–006, d2 007–012, d3 013–018, d4 019–022, d5 023–025.
# Anclas (primer ejercicio de cada concepto, workedExampleFor): 001 AR, 002 AB, 003 PR, 004 IN, 005 PO y 006 AE, todas
# de d1, con la resolución completa en la explicación, que hace de ejemplo resuelto; como WorkedExample muestra solo
# enunciado y explicación, cada ancla con árbol lista sus hijos en la explicación.
# Abreviaturas: AR arbol · AB arbol-binario · PR recorrido-preorden · IN recorrido-inorden · PO recorrido-postorden ·
# AE arbol-expresion.
# Terminología (L, con la `notacion` que agrega la sesión principal): preorden, inorden y posorden, sin guion y con
# «pos-»; la lista es «el preorden de T»; «posfija», no «postfija»; nodo = vértice; entre dos nodos hay una única
# «trayectoria» (no «camino»); la altura cuenta aristas (un solo nodo: 0; la del árbol vacío, −1, nunca se pregunta); el
# nivel de la raíz es 0; no se dice «profundidad» de un nodo; «lleno» = cada nodo tiene 0 o 2 hijos («completo» no se
# usa); «ancestro» es estricto; un hijo único es izquierdo o derecho, y el enunciado o el dibujo lo dicen; en las listas
# de hijos, «ninguno», no «—». En los árboles sin raíz (019 y 021) se dice «vértice de grado 1», no «hoja» (A).
# Plataforma (P, M y A): no hay visual de árbol. El árbol va como `array` de KaTeX por niveles en el enunciado (altura
# ≤ 3, a lo más 10 nodos), generado por código desde la lista de hijos: cada nodo en su propia columna (dos columnas por
# posición del inorden), así que un hijo único nunca queda justo debajo de su padre, y cada arista es \diagup o
# \diagdown en el renglón de en medio. La lista de hijos va en la explicación: primero los nodos con hijos, por niveles,
# y luego las hojas, en orden alfabético. En el 009 y el 020 el enunciado da solo la lista o los recorridos; en los de
# reconstruir (015, 020 y 025), solo los recorridos. «Dibújalo en papel y luego contesta» va en el 009, el 020, el 022 y
# el 025, y el tiempo del dibujo está dentro de su tiempo_estimado_s; sus explicaciones traen el dibujo (en el 009, el
# 020 y el 025 tiene altura 4: el tope de altura 3 es del enunciado). Los `array` van sin espacios entre celdas.
# Huecos: los recorridos van como `completar`, una letra por hueco; las posfijas, como `opcion_multiple` con `valores`
# (010), porque «×», «*», «−» y «÷» no se comparan bien; los negativos y las fracciones, en ASCII (`-2`, `-7/4`, 022);
# ningún hueco pide palabras ni operadores, y 5040 va «sin separador de miles» (014). Cada hueco dice si pide un número
# o un nodo, y si se cuenta desde 1. Ningún recorrido pedido es alfabético ni igual al orden por niveles (revisado con
# código).
# `verificar`: los de M, en Python puro, sin cambios salvo el `min` del 014 (que ya trae su archivo). Vías: los
# recorridos ejecutan la definición recursiva; las reconstrucciones, fuerza bruta sobre todas las formas con n nodos,
# exigiendo un árbol único; las expresiones, shunting-yard y pila, comparadas con Python. Probados con el check_exercise
# real (24/24) y con las 72 respuestas alteradas de neg.py de M más las del autor, que fallan todas.
# Pistas como preguntas, sin valores intermedios: 1 en d1–2, 2 en d3 y 3 en d4–5 (las del 014, el 019 y el 023 son de
# A; las del 023, ajustadas a las opciones del R4 v1 de M). Desde d3, la explicación cierra con «Revisa:». Las
# explicaciones de selección y opción múltiple dicen cuáles son las correctas.
# Manuales: solo el 019 (autoevaluación de A, tal cual, tarjeta: false).
# Arreglos del 2026-11-15 (/revisar-contenido; Carlo aprobó «errores + mejoras» y el 018 en el jefe): 001, 002, 010,
# 013–025 (salvo el 018 en lo matemático) cambian texto, opciones, pistas o explicaciones; las claves de 001–019 y
# 021–024 no cambian. El 020 gana un hueco y el 025 cambia uno (los dos revisan de qué lado va un hijo único). Cada
# hueco que cuenta los nodos de un subárbol dice «contando su raíz». Ningún texto para el alumno dice «recorrido» a
# secas (L). Los 24 `verificar` vuelven a dar la clave con el check_exercise real, y las alteradas del 020, el 023 y
# el 025 (con el 0 del lado equivocado) fallan.
# Personajes: Diego (013, error plantado; Ana ya salió en la 16 y en la 19) y Lucía (014, metacognitivo de A).
# Textos con LaTeX en bloques `>-` (o `|-` cuando llevan `array` o listas): así no hay que escapar comillas ni barras.
unidad: matematicas-discretas/21-arboles-binarios
ejercicios:
  # razonamiento: espacial (la altura cuenta aristas) · R0
  # Ancla de AR: árbol con raíz que no es binario (a tiene tres hijos; el hijo único de b y el del medio de a van justo
  # debajo, con \vert, porque aquí no hay izquierdo ni derecho). La explicación da niveles, hojas y aristas, y lista el
  # árbol. Errores que rechaza el verificar (neg.py): altura 4 (contar niveles), 6 hojas y 9 aristas.
  # verificar: niveles subiendo por padres, hojas sin hijos y aristas contadas en la lista.
  # Arreglos del 2026-11-15 (L): «Altura del árbol, en aristas» y «número de aristas del árbol».
  - id: disc-21-001
    tipo: completar
    dificultad: 1
    conceptos: [arbol]
    enunciado: |-
      En un árbol con raíz, el **nivel** de un nodo es el número de aristas de su trayectoria a la raíz, y la raíz está en el nivel 0; la **altura** del árbol es el mayor nivel, y una **hoja** es un nodo sin hijos. Este árbol tiene raíz $a$ y no es binario: $a$ tiene tres hijos. Cada hueco es un número.

      $$\begin{array}{ccccccccccccc}&&&&a&&&&&&&&\\&&\diagup&&\vert&&&\diagdown&&&&&\\b&&&&c&&&&&&d&&\\\vert&&&&&&&&&\diagup&&\diagdown&\\e&&&&&&&&f&&&&g\\&&&&&&&\diagup&&\diagdown&&&\\&&&&&&h&&&&i&&\end{array}$$
    texto: >-
      Altura del árbol, en aristas: ___ · número de hojas: ___ · nivel de $g$: ___ · número de aristas del árbol: ___
    respuestas: ["3", "5", "2", "8"]
    verificar: { python: "(lambda C: (lambda r, lev: [max(lev(r, v) for v in C), sum(1 for v in C if not C[v]), lev(r, 'g'), sum(len(c) for c in C.values())])([u for u in C if not any(u in c for c in C.values())][0], (lambda f: lambda r, v: f(f, r, v))(lambda f, r, v: 0 if v == r else 1 + f(f, r, [p for p in C if v in C[p]][0]))))({'a': ['b', 'c', 'd'], 'b': ['e'], 'c': [], 'd': ['f', 'g'], 'e': [], 'f': ['h', 'i'], 'g': [], 'h': [], 'i': []})" }
    pistas:
      - >-
        ¿Cuántas aristas tiene la trayectoria más larga de la raíz a una hoja? ¿Cuántos nodos no tienen hijos?
    explicacion: >-
      El árbol, como lista de hijos: $a$: $b$, $c$, $d$ · $b$: $e$ · $d$: $f$, $g$ · $f$: $h$, $i$; hojas: $c$, $e$, $g$, $h$, $i$. **Niveles:** $a$ en el 0; $b$, $c$ y $d$ en el 1; $e$, $f$ y $g$ en el 2; $h$ e $i$ en el 3. **Altura:** el mayor nivel es 3, el de $h$ y el de $i$; por ejemplo, la trayectoria $a,d,f,h$ tiene 3 aristas. **Hojas:** $c$, $e$, $g$, $h$ e $i$, 5. **Nivel de $g$:** su trayectoria a la raíz, $g,d,a$, tiene 2 aristas. **Aristas:** $ab$, $ac$, $ad$, $be$, $df$, $dg$, $fh$ y $fi$, 8. Comprueba: si diste 4 de altura, contaste niveles (del 0 al 3 son cuatro); la altura cuenta aristas.
    tiempo_estimado_s: 60

  # razonamiento: deductivo (dónde va un nodo respecto a su hijo en cada recorrido) · R2
  # Ancla de AB (A: un nodo cuyo único hijo cambia de lado). valores 0–4. La explicación da los tres recorridos antes y
  # después, y lista el árbol. El verificar exige además que en todo árbol de 1 a 7 nodos mover un hijo único cambie
  # solo el inorden. Errores que rechaza (neg.py): «ninguno», «el inorden y el posorden» y «solo el preorden».
  # Arreglos del 2026-11-15 (L): la pregunta en singular, «¿cuál de los tres recorridos cambia?», descartaba por
  # gramática las opciones 3 y 4; ahora es «¿qué pasa con su preorden, su inorden y su posorden?», y las opciones
  # empiezan con el verbo. La pista ya no dice «recorrido» a secas. El orden de las opciones no cambia.
  - id: disc-21-002
    tipo: opcion_multiple
    dificultad: 1
    conceptos: [arbol-binario]
    enunciado: |-
      En este árbol binario, el único hijo de $b$ es $d$, y es **izquierdo**. Si $d$ pasa a ser el hijo **derecho** de $b$, sin cambiar nada más, ¿qué pasa con su preorden, su inorden y su posorden?

      $$\begin{array}{ccccccccccc}&&&&a&&&&&&\\&&&\diagup&&&\diagdown&&&&\\&&b&&&&&&c&&\\&\diagup&&&&&&\diagup&&\diagdown&\\d&&&&&&e&&&&f\end{array}$$
    opciones:
      - "Cambia solo el preorden"
      - "Cambia solo el inorden"
      - "Cambia solo el posorden"
      - "Cambian el inorden y el posorden"
      - "No cambia ninguno de los tres"
    valores: ["0", "1", "2", "3", "4"]
    correcta: 1
    verificar: { python: "(lambda t, Sh: (lambda pat: (lambda L: L[0] if len(L) == 1 else None)([i for (i, o) in enumerate([(True, False, False), (False, True, False), (False, False, True), (False, True, True), (False, False, False)]) if o == pat]) if all((lambda s: (lambda t2: (((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else [t[0]] + f(f, t[1]) + f(f, t[2])))(t2) != ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else [t[0]] + f(f, t[1]) + f(f, t[2])))(s), ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else f(f, t[1]) + [t[0]] + f(f, t[2])))(t2) != ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else f(f, t[1]) + [t[0]] + f(f, t[2])))(s), ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else f(f, t[1]) + f(f, t[2]) + [t[0]]))(t2) != ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else f(f, t[1]) + f(f, t[2]) + [t[0]]))(s)) == (False, True, False))(((lambda f: lambda t, x: f(f, t, x))(lambda f, t, x: None if t is None else ((t[0], t[2], t[1]) if t[0] == x else (t[0], f(f, t[1], x), f(f, t[2], x)))))(s, x)))(((lambda f: lambda x, s: f(f, x, s))(lambda f, x, s: None if x is None else (s[0], f(f, x[0], s[1:1 + ((lambda f: lambda x: f(f, x))(lambda f, x: 0 if x is None else 1 + f(f, x[0]) + f(f, x[1])))(x[0])]), f(f, x[1], s[1 + ((lambda f: lambda x: f(f, x))(lambda f, x: 0 if x is None else 1 + f(f, x[0]) + f(f, x[1])))(x[0]):]))))(y, 'abcdefg'[:n])) for n in range(1, 8) for y in Sh[n] for x in 'abcdefg'[:n] if (lambda q: (q[1] is None) != (q[2] is None))(((lambda f: lambda t, x: f(f, t, x))(lambda f, t, x: None if t is None else (t if t[0] == x else (f(f, t[1], x) or f(f, t[2], x)))))(((lambda f: lambda x, s: f(f, x, s))(lambda f, x, s: None if x is None else (s[0], f(f, x[0], s[1:1 + ((lambda f: lambda x: f(f, x))(lambda f, x: 0 if x is None else 1 + f(f, x[0]) + f(f, x[1])))(x[0])]), f(f, x[1], s[1 + ((lambda f: lambda x: f(f, x))(lambda f, x: 0 if x is None else 1 + f(f, x[0]) + f(f, x[1])))(x[0]):]))))(y, 'abcdefg'[:n]), x))) else None)((lambda t2: (((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else [t[0]] + f(f, t[1]) + f(f, t[2])))(t2) != ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else [t[0]] + f(f, t[1]) + f(f, t[2])))(t), ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else f(f, t[1]) + [t[0]] + f(f, t[2])))(t2) != ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else f(f, t[1]) + [t[0]] + f(f, t[2])))(t), ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else f(f, t[1]) + f(f, t[2]) + [t[0]]))(t2) != ((lambda f: lambda t: f(f, t))(lambda f, t: [] if t is None else f(f, t[1]) + f(f, t[2]) + [t[0]]))(t)))(((lambda f: lambda t, x: f(f, t, x))(lambda f, t, x: None if t is None else ((t[0], t[2], t[1]) if t[0] == x else (t[0], f(f, t[1], x), f(f, t[2], x)))))(t, 'b'))))((lambda T: (lambda f: f(f, (lambda T: [u for u in T if not any(u in c for c in T.values())][0])(T)))(lambda f, u: None if u is None else (u, f(f, (lambda T, u: T.get(u, (None, None)))(T, u)[0]), f(f, (lambda T, u: T.get(u, (None, None)))(T, u)[1]))))({x.split(': ')[0]: tuple(None if y == '-' else y for y in x.split(': ')[1].split(' ')) for x in 'a: b c; b: d -; c: e f'.split('; ')}), (lambda N: list(itertools.accumulate(range(1, N + 1), lambda S, n: S + [[(L, R) for k in range(n) for L in S[k] for R in S[n - 1 - k]]], initial=[[None]]))[-1])(7))" }
    pistas:
      - >-
        En el preorden, en el inorden y en el posorden, ¿dónde va $b$ respecto a su hijo $d$? ¿Eso depende de si $d$ es izquierdo o derecho?
    explicacion: >-
      Cambia solo el inorden. El árbol, como lista de hijos: $a$: izq. $b$, der. $c$ · $b$: izq. $d$, der. ninguno · $c$: izq. $e$, der. $f$; hojas: $d$, $e$, $f$. **Antes:** preorden $a,b,d,c,e,f$; inorden $d,b,a,e,c,f$; posorden $d,b,e,f,c,a$. **Después**, con $d$ a la derecha de $b$: preorden $a,b,d,c,e,f$; inorden $b,d,a,e,c,f$; posorden $d,b,e,f,c,a$. **Por qué:** en el preorden $b$ va antes de todo su subárbol, y en el posorden, después, sea izquierdo o derecho su hijo; en el inorden, $b$ va después de su subárbol izquierdo y antes del derecho, así que al cambiar $d$ de lado, $b$ y $d$ se intercambian. Comprueba: en el inorden cambian solo las dos primeras posiciones, que pasan de $d,b$ a $b,d$.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (la raíz y luego cada subárbol completo) · R1
  # Ancla de PR. Árbol de M para el 003, el 004 y el 005 (altura 3; e y f tienen el hijo izquierdo con la letra
  # posterior, y a y b tienen un hijo único derecho). Errores que rechaza el verificar (neg.py): los hijos en orden
  # alfabético, el orden por niveles y el derecho antes que el izquierdo en f.
  # verificar: ejecuta la definición recursiva del preorden sobre la lista de hijos.
  - id: disc-21-003
    tipo: completar
    dificultad: 1
    conceptos: [recorrido-preorden]
    enunciado: |-
      El **preorden** de un árbol binario lista la raíz, luego el subárbol izquierdo en preorden y luego el derecho en preorden. Escribe el preorden de este árbol; cada hueco es un nodo.

      $$\begin{array}{ccccccccccccccccc}&&&&&&&&&&&&e&&&&\\&&&&&&&&\diagup&&&&&\diagdown&&&\\&&&&h&&&&&&&&&&b&&\\&&\diagup&&&&\diagdown&&&&&&&&&\diagdown&\\a&&&&&&&&f&&&&&&&&c\\&\diagdown&&&&&&\diagup&&\diagdown&&&&&&&\\&&g&&&&i&&&&d&&&&&&\end{array}$$
    texto: >-
      Preorden: ___, ___, ___, ___, ___, ___, ___, ___, ___
    respuestas: ["e", "h", "a", "g", "f", "i", "d", "b", "c"]
    verificar: { python: "(lambda T: (lambda T, r: (lambda go: go(go, r))(lambda go, u: [] if u is None else [u] + go(go, (lambda T, u: T.get(u, (None, None)))(T, u)[0]) + go(go, (lambda T, u: T.get(u, (None, None)))(T, u)[1])))(T, (lambda T: [u for u in T if not any(u in c for c in T.values())][0])(T)))({x.split(': ')[0]: tuple(None if y == '-' else y for y in x.split(': ')[1].split(' ')) for x in 'e: h b; h: a f; b: - c; a: - g; f: i d'.split('; ')})" }
    pistas:
      - >-
        Después de la raíz, ¿terminas todo el subárbol izquierdo antes de pasar al derecho? Si un nodo no tiene hijo izquierdo, ¿qué va justo después de él?
    explicacion: |-
      El árbol, como lista de hijos: $e$: izq. $h$, der. $b$ · $h$: izq. $a$, der. $f$ · $b$: izq. ninguno, der. $c$ · $a$: izq. ninguno, der. $g$ · $f$: izq. $i$, der. $d$; hojas: $c$, $d$, $g$, $i$. Por bloques:

      1. La raíz, $e$.
      2. El subárbol de $h$, en preorden: $h$; luego el de $a$, que no tiene hijo izquierdo, $a,g$; luego el de $f$, $f,i,d$. Da $h,a,g,f,i,d$.
      3. El subárbol de $b$: $b$ y, como no tiene hijo izquierdo, $c$.

      El preorden es $e,h,a,g,f,i,d,b,c$. Un error común es escribir $b$ antes que $h$ por el orden alfabético: el hijo izquierdo de $e$ es $h$, aunque su letra vaya después. Comprueba: están los 9 nodos, y cada uno va antes que todos los de su subárbol.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (izquierdo, raíz, derecho) · R1
  # Ancla de IN. El mismo árbol del 003. Errores que rechaza el verificar (neg.py): g antes que a (el hijo único derecho
  # de a puesto antes de su padre) y c antes que b.
  # verificar: ejecuta la definición recursiva del inorden sobre la lista de hijos.
  - id: disc-21-004
    tipo: completar
    dificultad: 1
    conceptos: [recorrido-inorden]
    enunciado: |-
      El **inorden** de un árbol binario lista el subárbol izquierdo en inorden, luego la raíz y luego el subárbol derecho en inorden. Escribe el inorden de este árbol; cada hueco es un nodo.

      $$\begin{array}{ccccccccccccccccc}&&&&&&&&&&&&e&&&&\\&&&&&&&&\diagup&&&&&\diagdown&&&\\&&&&h&&&&&&&&&&b&&\\&&\diagup&&&&\diagdown&&&&&&&&&\diagdown&\\a&&&&&&&&f&&&&&&&&c\\&\diagdown&&&&&&\diagup&&\diagdown&&&&&&&\\&&g&&&&i&&&&d&&&&&&\end{array}$$
    texto: >-
      Inorden: ___, ___, ___, ___, ___, ___, ___, ___, ___
    respuestas: ["a", "g", "h", "i", "f", "d", "e", "b", "c"]
    verificar: { python: "(lambda T: (lambda go: go(go, (lambda T: [u for u in T if not any(u in c for c in T.values())][0])(T)))(lambda go, u: [] if u is None else go(go, (lambda T, u: T.get(u, (None, None)))(T, u)[0]) + [u] + go(go, (lambda T, u: T.get(u, (None, None)))(T, u)[1])))({x.split(': ')[0]: tuple(None if y == '-' else y for y in x.split(': ')[1].split(' ')) for x in 'e: h b; h: a f; b: - c; a: - g; f: i d'.split('; ')})" }
    pistas:
      - >-
        Si un nodo no tiene hijo izquierdo, ¿va él antes o después de su hijo derecho?
    explicacion: |-
      El árbol, como lista de hijos: $e$: izq. $h$, der. $b$ · $h$: izq. $a$, der. $f$ · $b$: izq. ninguno, der. $c$ · $a$: izq. ninguno, der. $g$ · $f$: izq. $i$, der. $d$; hojas: $c$, $d$, $g$, $i$. Por bloques:

      1. El subárbol de $h$: primero el de $a$, que no tiene hijo izquierdo, así que $a$ y luego $g$; después $h$; después el de $f$, $i,f,d$. Da $a,g,h,i,f,d$.
      2. La raíz, $e$.
      3. El subárbol de $b$: no tiene hijo izquierdo, así que $b$ y luego $c$.

      El inorden es $a,g,h,i,f,d,e,b,c$. Un error común es poner $g$ antes que $a$: $g$ es el hijo **derecho** de $a$, y va después de él. Comprueba: la raíz deja a su izquierda los 6 nodos del subárbol de $h$ y a su derecha los 2 del de $b$.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (cada subárbol completo y la raíz al final) · R1
  # Ancla de PO. El mismo árbol del 003. Errores que rechaza el verificar (neg.py): b antes que c y a antes que g.
  # verificar: ejecuta la definición recursiva del posorden sobre la lista de hijos.
  - id: disc-21-005
    tipo: completar
    dificultad: 1
    conceptos: [recorrido-postorden]
    enunciado: |-
      El **posorden** de un árbol binario lista el subárbol izquierdo en posorden, luego el derecho en posorden y al final la raíz. Escribe el posorden de este árbol; cada hueco es un nodo.

