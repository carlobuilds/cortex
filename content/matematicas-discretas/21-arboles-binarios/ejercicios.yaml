      - >-
        ¿Cuántas aristas tiene un árbol con $n$ vértices? ¿Qué relación hay entre el número de aristas y la suma de los grados?
      - >-
        En $A$, si $x$ vértices tienen grado 1 y $y$ tienen grado 3, ¿qué dos ecuaciones cumplen $x$ y $y$?
      - >-
        En $B$, ¿cuántos vértices hay? Si son $n$, ¿cuánto suman los grados contados de dos maneras?
    explicacion: >-
      **Lo que se usa:** por el apretón de manos, la suma de los grados es el doble del número de aristas, y un árbol con $n$ vértices tiene $n-1$ aristas: sus grados suman $2(n-1)$. **$A$:** con $x$ vértices de grado 1 y $y$ de grado 3, $x+y=8$ y $x+3y=2\cdot7=14$; restando, $2y=6$: $y=3$ y $x=5$. **$B$:** con $n$ vértices, los grados suman $5+3+(n-2)=n+6$, y tienen que sumar $2(n-1)$: $n+6=2n-2$, así que $n=8$, con $8-2=6$ de grado 1. Revisa: $A$ existe, por ejemplo, una trayectoria $u,v,w$ con dos vértices de grado 1 colgando de $u$, uno de $v$ y dos de $w$; $B$, un vértice unido a 4 de grado 1 y a otro que tiene 2 más.
