  # razonamiento: algorítmico (la pila de derecha a izquierda, o el árbol) · R2
  # Con − y ÷, donde importa el orden de los operandos (A). Errores que rechaza el verificar (neg.py): −8 y 2.
  # verificar: evalúa la prefija con una pila de derecha a izquierda y exige que dé lo mismo que
  # (9 - (2 + 3)) * (8 / (6 - 2)) en Python.
  # Arreglos del 2026-11-15 (P, aprobado por Carlo): entra al jefe, para que la pila tenga pregunta. Su «Revisa:» pasa
  # a «el árbol y la pila dan lo mismo, 8»: el de antes, «6 números y 5 operadores; cada operador junta dos valores en
  # uno», era la cuenta del 024 (11 partidos con 12 equipos). La explicación no habla de intercambiar hijos (022), de
  # torneos ni de conteos (024), ni enuncia nada general del R4.
  - id: disc-21-018
    tipo: numerico
    dificultad: 3
    conceptos: [arbol-expresion]
    enunciado: >-
      La **prefija** de un árbol de expresión es su preorden: cada operador va antes de sus dos operandos. ¿Cuánto vale `× − 9 + 2 3 ÷ 8 − 6 2`?
    respuesta: 8
    tolerancia: 0
    verificar: { python: "(lambda r: r[0] if len(r) == 1 and r[0] == (9 - (2 + 3)) * Fraction(8, 6 - 2) else None)((lambda toks: list(itertools.accumulate(toks[::-1], lambda s, t: (s[:-2] + [{'+': lambda a, b: a + b, '-': lambda a, b: a - b, '*': lambda a, b: a * b, '/': lambda a, b: Fraction(a) / b}[t](s[-1], s[-2])]) if t in {'+': lambda a, b: a + b, '-': lambda a, b: a - b, '*': lambda a, b: a * b, '/': lambda a, b: Fraction(a) / b} else s + [int(t)], initial=[]))[-1])('* - 9 + 2 3 / 8 - 6 2'.split()))" }
    pistas:
      - >-
        ¿Cuál es el primer operador que tiene a sus dos operandos escritos justo después, como números?
      - >-
        Si lees de derecha a izquierda con una pila, ¿cuál de los dos números que sacas es el operando izquierdo?
    explicacion: >-
      Vale 8. **El árbol:** la raíz es el primer símbolo, $\times$. Su operando izquierdo empieza en el $-$ que sigue: es $9-(2+3)$, porque tras el 9 viene `+ 2 3`. El derecho es lo que queda, `÷ 8 − 6 2`, que es $8\div(6-2)$. Así, $(9-(2+3))\times(8\div(6-2))=4\times2=8$. **Con una pila, de derecha a izquierda:** cada número se apila, y cada operador saca dos números, el de arriba como su operando izquierdo: $6-2=4$, $8\div4=2$, $2+3=5$, $9-5=4$ y $4\times2=8$. Revisa: el árbol y la pila dan lo mismo, 8.
    tiempo_estimado_s: 90

  # razonamiento: deductivo (inducción en n con un vértice de grado 1) · R3
  # De A, tal cual (rúbrica, respuesta modelo y pistas). Revisión manual. El enunciado recuerda la inducción (v1: el
  # repaso va aquí y no en la lección) y dice «vértice de grado 1» la rúbrica, no «hoja» (A). La lección da el n − 1
  # sin demostrarlo. La explicación es del autor: resume la respuesta modelo sin agregar nada. tarjeta: false, como las
  # autoevaluaciones de la 15 a la 20. Arreglos del 2026-11-15 (L y M): «agregarle un vértice de grado 1», no «una
  # hoja», y el lazo y la arista repetida en el criterio 2, la respuesta modelo y la explicación.
  - id: disc-21-019
    tipo: autoevaluacion
    dificultad: 4
    conceptos: [arbol]
    enunciado: >-
      En papel, demuestra por inducción en $n$ que todo árbol con $n\ge1$ vértices tiene $n-1$ aristas. Recuerda la **inducción**: si $P(1)$ vale y $P(n)$ implica $P(n+1)$ para cada $n\ge1$, entonces $P(n)$ vale para todo $n\ge1$.
    rubrica:
      - >-
        Enuncia qué prueba (todo árbol con $n\ge1$ vértices tiene $n-1$ aristas), hace la inducción en $n$ y prueba la base $n=1$ con su porqué: una arista tendría que ser un lazo, y un lazo es un ciclo. Error típico: comprobar $n=1,2,3$ y cerrar con «y así sucesivamente».
      - >-
        Prueba que un árbol con al menos 2 vértices tiene un vértice de grado 1, por ejemplo con el extremo de una trayectoria de largo máximo: otro vecino cerraría un ciclo o alargaría la trayectoria, y un lazo o una arista repetida también serían ciclos. Error típico: suponer que existe sin probarlo; en un ciclo no lo hay, y ahí es donde entra «sin ciclos».
      - >-
        Prueba que al quitar ese vértice y su arista queda un árbol: sin ciclos, porque un ciclo del grafo que queda estaría en el árbol, y conexo, porque una trayectoria entre otros dos vértices no pasa por un vértice de grado 1. Error típico: aplicar la hipótesis sin revisar que lo que queda siga conexo.
      - >-
        El paso parte de un árbol cualquiera con $n+1$ vértices, baja a $n$ y concluye $(n-1)+1=n$. Error típico: partir de un árbol de $n$ vértices y agregarle un vértice de grado 1; eso solo prueba el caso de los árboles que se arman así, a menos que pruebes que todos se arman así.
    respuesta_modelo: >-
      Un árbol es un grafo conexo y sin ciclos. Pruebo por inducción en $n\ge1$ que todo árbol con $n$ vértices tiene $n-1$ aristas. **Base, $n=1$:** con un solo vértice, una arista sería un lazo, y un lazo es un ciclo; así que no hay aristas: $0=1-1$. **Paso:** supongo que todo árbol con $n$ vértices tiene $n-1$ aristas, y sea $T$ un árbol cualquiera con $n+1\ge2$ vértices. *Hay un vértice de grado 1.* Como $T$ es conexo y tiene dos vértices o más, tiene aristas. Sea $v_0,v_1,\dots,v_k$ una trayectoria de $T$ con el mayor número de aristas posible; existe porque $T$ es finito, y $k\ge1$. $v_k$ es vecino de $v_{k-1}$. Si tuviera otro vecino $x$: si $x=v_i$ con $i<k-1$, entonces $v_i,v_{i+1},\dots,v_k,v_i$ sería un ciclo; si $x$ no está en la trayectoria, $v_0,\dots,v_k,x$ sería una trayectoria más larga. Las dos cosas son imposibles, y un lazo en $v_k$ o una segunda arista entre $v_{k-1}$ y $v_k$ serían ciclos, así que $v=v_k$ tiene grado 1. *Quitarlo deja un árbol.* Sea $T'$ lo que queda al quitar $v$ y su única arista. $T'$ no tiene ciclos, porque un ciclo de $T'$ también estaría en $T$. Es conexo: si $x$ y $y$ son vértices de $T'$, hay una trayectoria de $x$ a $y$ en $T$ (de un camino se saca quitando las vueltas), y no pasa por $v$, porque cada vértice intermedio de una trayectoria tiene dos vecinos en ella y $v$ solo tiene uno; así que esa trayectoria está en $T'$. Entonces $T'$ es un árbol con $n$ vértices y, por hipótesis, tiene $n-1$ aristas. *Conclusión:* $T$ tiene las de $T'$ más la de $v$: $(n-1)+1=n=(n+1)-1$. Como $T$ era cualquiera, vale para todo árbol con $n+1$ vértices. Revisa: el paso parte de un árbol cualquiera de $n+1$ vértices y le quita un vértice; si partiera de uno de $n$ y le agregara un vértice de grado 1, solo probaría el caso de los árboles que se arman así.
    verificar: { revision: "manual" }
    pistas:
      - >-
        ¿Sobre qué haces la inducción y qué dice el caso base? ¿Por qué un árbol de un solo vértice no puede tener una arista?
      - >-
        Para pasar de $n+1$ a $n$ vértices, ¿qué vértice puedes quitar sin desconectar el árbol? ¿Cómo sabes que siempre hay uno? ¿Qué pasa en el extremo de una trayectoria lo más larga posible?
      - >-
        ¿Tu paso parte de un árbol cualquiera de $n+1$ vértices, o arma uno a partir de uno de $n$? ¿Revisaste que lo que queda al quitar el vértice sigue siendo conexo y sin ciclos?
    explicacion: >-
      **Inducción en $n$.** La base, $n=1$: no hay aristas, porque una sería un lazo, y un lazo es un ciclo. El paso parte de un árbol cualquiera $T$ con $n+1\ge2$ vértices: el extremo $v$ de una trayectoria con el mayor número de aristas tiene grado 1, porque otro vecino cerraría un ciclo o alargaría la trayectoria, y un lazo o una arista repetida también serían ciclos. Al quitar $v$ y su arista queda un árbol de $n$ vértices: sin ciclos, y conexo, porque una trayectoria entre otros dos vértices no pasa por un vértice de grado 1. Por hipótesis tiene $n-1$ aristas, y con la de $v$, $T$ tiene $n$. Revisa: el paso baja de un árbol cualquiera de $n+1$ vértices a uno de $n$; armar uno de $n+1$ agregándole un vértice de grado 1 a uno de $n$ no cubre todos los árboles, salvo que pruebes que todos se arman así.
    tarjeta: false
    tiempo_estimado_s: 360

  # razonamiento: algorítmico (descomposición recursiva y dibujo) · R2
