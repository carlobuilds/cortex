  # posorden, los nodos del subárbol izquierdo de i, los nodos con un solo hijo y la altura. El hueco del subárbol de i
  # (P, arreglos del 2026-11-15) revisa de qué lado va el hijo único de i: con d a la derecha da 0, y el posorden, los
  # nodos con un solo hijo y la altura no cambian. El lado de a (hijo único de h) sigue sin hueco que lo revise. La
  # explicación trae el dibujo (altura 4). Errores que rechaza el verificar (neg.py y autor): 1 nodo con un solo hijo,
  # altura 5, el posorden con d antes que e, y 0 o 4 nodos en el subárbol izquierdo de i. tiempo_estimado_s: 240 + 10 s
