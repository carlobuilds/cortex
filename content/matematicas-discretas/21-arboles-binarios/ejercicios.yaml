  - id: disc-21-016
    tipo: seleccion_multiple
    dificultad: 3
    conceptos: [arbol]
    enunciado: >-
      Sea $T$ un árbol con raíz y al menos 2 vértices. ¿Cuáles de estas afirmaciones valen para todo $T$ así? Puede haber varias. Recuerda: un camino puede repetir vértices y aristas; una trayectoria no repite vértices (unidad 19).
    opciones:
      - >-
        La regla «a cada vértice distinto de la raíz, su padre» es una función del conjunto de los vértices distintos de la raíz en el conjunto de los vértices.
      - >-
        La regla «a cada vértice, su hijo» es una función del conjunto de los vértices en sí mismo.
      - >-
        Toda arista de $T$ es un puente: al quitarla, el grafo que queda no es conexo.
      - >-
        Entre dos vértices distintos de $T$ hay exactamente una trayectoria.
      - >-
        Entre dos vértices distintos de $T$ hay exactamente un camino.
      - >-
