      Son ciertas «el inorden de $T'$ es el inorden de $T$ al revés», «la misma altura» y «el orden de ancestros es el mismo, con la raíz como máximo y las hojas como minimales»; las otras tres no. $T$, como lista de hijos: $c$: izq. $f$, der. $a$ · $f$: izq. $e$, der. ninguno · $a$: izq. $d$, der. $b$ · $d$: izq. ninguno, der. $g$; hojas: $b$, $e$, $g$. $T'$: $c$: izq. $a$, der. $f$ · $a$: izq. $b$, der. $d$ · $f$: izq. ninguno, der. $e$ · $d$: izq. $g$, der. ninguno; hojas: $b$, $e$, $g$. **Preorden, inorden y posorden:** en $T$, preorden $c,f,e,a,d,g,b$, inorden $e,f,c,d,g,a,b$ y posorden $e,f,g,d,b,a,c$; en $T'$, preorden $c,a,b,d,g,f,e$, inorden $b,a,g,d,c,f,e$ y posorden $b,g,d,a,e,f,c$. El inorden se invierte, porque el espejo cambia «izquierdo, raíz, derecho» por «derecho, raíz, izquierdo» en cada nodo; el preorden y el posorden no, porque los dos dejan la raíz en su lugar, primera o última. **Hojas:** de izquierda a derecha, $e,g,b$ en $T$ y $b,g,e$ en $T'$. **Lo que no cambia:** el espejo no cambia quién es padre de quién, así que los niveles, la altura (3) y los ancestros son los mismos; la raíz es ancestro de todos los demás nodos, y es el máximo, y las hojas, que no son ancestro de nadie, son los minimales. Revisa: $d$ tiene un solo hijo, $g$, en los dos árboles; en $T$ es derecho y en $T'$, izquierdo.
