    pistas:
      - >-
        ¿Qué basta para tumbar un «para todo $T$»? En las que hablan de preorden, inorden o posorden, ¿qué tendrías que exhibir: un árbol o dos?
      - >-
        Si pruebas con todos los árboles de 1, 2 y 3 nodos, ¿cuáles tienen el mismo preorden, inorden o posorden y difieren en otra de las tres listas? En las de conteo, ¿qué dan esos árboles chicos?
      - >-
        En las que aceptas: ¿dónde queda la raíz en el preorden, en el inorden y en el posorden, y qué nodo va justo después de ella en el preorden? Si una afirmación vale para los dos subárboles de la raíz, ¿vale para el árbol entero?
    explicacion: >-
      Valen «con 0 o 2 hijos en cada nodo, ningún otro árbol binario tiene el mismo preorden y posorden», «las hojas quedan en el mismo orden en el preorden, el inorden y el posorden» y «el último del preorden es una hoja»; las otras tres no. **Contraejemplos.** Mismo inorden: $a$ con hijo derecho $b$, y $b$ con hijo izquierdo $a$; los dos dan $a,b$. Lo de $2^h$: una raíz con dos hijos tiene 3 nodos y altura 1, y $2^1=2$; el máximo es $2^{h+1}-1$. Dos hojas: $a$ con un solo hijo, $b$, tiene 2 nodos y una hoja. **Las que valen.** Con 0 o 2 hijos: sea $S$ cualquier árbol binario con el preorden y el posorden de $T$. Los dos tienen la misma raíz, la primera del preorden. Si $T$ tiene más de un nodo, su raíz tiene dos hijos, y el segundo del preorden, $x$, es el izquierdo. En $S$, $x$ es la raíz del primer subárbol no vacío de la raíz, y en el posorden de los dos, lo que va hasta $x$ es el subárbol de $x$. Ese tramo no tiene a todos los demás nodos, porque el subárbol derecho de $T$ no es vacío: en $S$, la raíz también tiene dos hijos, con $x$ a la izquierda, y cada subárbol de $S$ tiene el preorden y el posorden del de $T$ del mismo lado. Cada subárbol de $T$ cumple otra vez la hipótesis, y se repite. Las hojas: en las tres listas, todos los nodos del subárbol izquierdo van antes que todos los del derecho, y la raíz, si tiene hijos, no es hoja; aplicando eso dentro de cada subárbol, las hojas quedan en el mismo orden. El último del preorden: está en el subárbol derecho si lo hay; si no, en el izquierdo; si no hay ninguno, es la raíz, que entonces es hoja; bajando así se llega a una hoja. Revisa: en la primera, la hipótesis importa; con un hijo único, el ejemplo de dos nodos de la lección da dos árboles con el mismo preorden y posorden.
    tiempo_estimado_s: 210

  # razonamiento: analógico (torneo → árbol binario lleno; rondas = altura) · R2
  # Transferencia, hipotética («Supón»). Vuelve al jefe en lugar del 015 (P y M): con el R4 v1 ya no cruza. Errores que
  # rechaza el verificar (neg.py): 12 y 24 (contar equipos como partidos), 3 rondas y 12.
  # En el jefe: la explicación cuenta partidos por eliminados, no con grados (021) ni con «hojas = internos + 1» como
  # regla; para las rondas mínimas usa el máximo 2^(h+1) − 1 de la lección, que es lo correcto y no la (3) del R4.
  # verificar: programación dinámica sobre todas las formas con 1 a 12 hojas en que cada nodo interno tiene dos hijos,
  # como (partidos, altura). Arreglos del 2026-11-15 (L): «la altura del árbol, en aristas».
  - id: disc-21-024
    tipo: completar
    dificultad: 5
    conceptos: [arbol, arbol-binario]
    enunciado: >-
      Supón un torneo de eliminación directa con 12 equipos: en cada partido juegan dos, el que pierde queda fuera, y gana el torneo el último que queda. Se dibuja como un árbol binario: cada equipo es una hoja, cada partido es un nodo con dos hijos, que son de donde viene cada uno de los dos que juegan, y la final es la raíz. Toma el número de rondas como la altura del árbol, en aristas. Cada hueco es un número.
    texto: >-
      Número de partidos: ___ · número de nodos del árbol: ___ · entre todos los árboles posibles de un torneo así, menor número de rondas: ___ · entre todos esos árboles, mayor número de rondas: ___
    respuestas: ["11", "23", "4", "11"]
    verificar: { python: "(lambda F: [(lambda L: L[0] if len(L) == 1 else None)(sorted({i for (i, h) in F[12]})), (lambda L: L[0] if len(L) == 1 else None)(sorted({12 + i for (i, h) in F[12]})), min(h for (i, h) in F[12]), max(h for (i, h) in F[12])])(list(itertools.accumulate(range(2, 13), lambda F, n: F + [{(i1 + i2 + 1, 1 + max(h1, h2)) for k in range(1, n) for (i1, h1) in F[k] for (i2, h2) in F[n - k]}], initial=[set(), {(0, 0)}]))[-1])" }
    pistas:
      - >-
        ¿Cuántos equipos quedan fuera en cada partido, y cuántos tienen que quedar fuera en total?
      - >-
        Con altura $h$, ¿cuántos nodos caben como mucho en un árbol binario?
      - >-
        ¿Qué forma tiene el árbol si cada partido enfrenta al ganador del anterior con un equipo nuevo?
    explicacion: >-
      **Partidos:** cada partido deja fuera a exactamente un equipo, y para que quede uno tienen que salir 11: 11 partidos. **Nodos:** 12 hojas y 11 partidos, 23. **Menos rondas:** con altura $h$ caben a lo más $2^{h+1}-1$ nodos; con $h=3$ son 15, menos que 23, así que hacen falta al menos 4. Con 4 alcanza: en la primera ronda juegan 8 equipos en 4 partidos y 4 descansan; quedan 8, luego 4, 2 y 1. **Más rondas:** si cada partido enfrenta al ganador del anterior con un equipo nuevo, los 11 partidos quedan uno debajo de otro, y la altura es 11. No puede ser más: una trayectoria de la raíz a una hoja con $h$ aristas pasa por $h$ partidos distintos antes de llegar a la hoja, y solo hay 11. Revisa: en el torneo de 4 rondas, los 8 equipos de la primera ronda quedan en el nivel 4 y los 4 que descansan, en el 3: $8+4=12$.
    tiempo_estimado_s: 180

