  # Solo los recorridos y «Dibújalo en papel y luego contesta» (P). La raíz tiene un hijo izquierdo con un solo hijo,
  # derecho, y el lado izquierdo baja como cadena hasta b. La explicación trae el dibujo (altura 4). Arreglos del
  # 2026-11-15 (P): «número de hojas» pasa a «número de nodos del subárbol derecho de d», que revisa de qué lado va el
  # hijo único de d: con f a la izquierda da 0, y los otros cinco huecos no cambian. El lado de b (hijo único de f)
  # sigue sin hueco que lo revise. Mismo número de huecos y la misma cuenta sobre el dibujo: tiempo_estimado_s sin
  # cambio. Errores que rechaza el verificar (neg.py y autor): h como último del preorden, f como hijo izquierdo de la
  # raíz, altura 5, y 0 o 3 nodos en el subárbol derecho de d.
  # En el jefe: con el R4 v1 no hay cruce (M); su último del preorden, g, es hoja, pero es un dato de este árbol, y la
  # explicación no lo generaliza. No da datos del 020.
