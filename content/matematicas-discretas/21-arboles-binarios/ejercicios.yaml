    pistas:
      - >-
        En el posorden, ¿dónde queda la raíz?
      - >-
        Después de partir el inorden, ¿qué tramo del posorden le toca a cada subárbol, y dónde está la raíz de cada tramo?
      - >-
        Al terminar, ¿tu dibujo vuelve a dar el posorden y el inorden del enunciado?
    explicacion: |-
      1. La raíz es $c$, la última del posorden. En el inorden, a su izquierda quedan $d,f,e,b,i$, y a su derecha, $h,a,g$.
      2. En el posorden, los 5 primeros, $e,i,b,f,d$, son el lado izquierdo, y su raíz es el último de ellos, $d$; los 3 que siguen, $h,g,a$, son el derecho, con raíz $a$.
      3. En el inorden $d,f,e,b,i$, $d$ va primero: no tiene hijo izquierdo. Con el posorden $e,i,b,f$, su hijo derecho es $f$, que tampoco tiene izquierdo, porque va primero en el inorden $f,e,b,i$; con $e,i,b$, el hijo derecho de $f$ es $b$, con $e$ a la izquierda e $i$ a la derecha.
      4. En el inorden $h,a,g$, $a$ tiene a $h$ a la izquierda y a $g$ a la derecha.

      Tu dibujo:

      $$\begin{array}{ccccccccccccccccc}&&&&&&&&&&c&&&&&&\\&&&&&\diagup&&&&&&&\diagdown&&&&\\d&&&&&&&&&&&&&&a&&\\&\diagdown&&&&&&&&&&&&\diagup&&\diagdown&\\&&f&&&&&&&&&&h&&&&g\\&&&&\diagdown&&&&&&&&&&&&\\&&&&&&b&&&&&&&&&&\\&&&&&\diagup&&\diagdown&&&&&&&&&\\&&&&e&&&&i&&&&&&&&\end{array}$$

      Como lista de hijos: $c$: izq. $d$, der. $a$ · $d$: izq. ninguno, der. $f$ · $a$: izq. $h$, der. $g$ · $f$: izq. ninguno, der. $b$ · $b$: izq. $e$, der. $i$; hojas: $e$, $g$, $h$, $i$. **Raíz:** $c$, con hijo izquierdo $d$ e hijo derecho $a$. **Altura:** 4, por la trayectoria $c,d,f,b,e$. **Subárbol derecho de $d$:** su raíz es $f$, y tiene a $f$, $b$, $e$ e $i$, 4 nodos; si dibujaste a $f$ como hijo izquierdo, te dio 0. **Preorden:** $c,d,f,b,e,i,a,h,g$, que termina en $g$. Revisa: tu dibujo vuelve a dar el posorden y el inorden del enunciado.
