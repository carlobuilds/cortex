materia: matematicas-discretas
notacion: "Lógica: ¬, ∧, ∨, ⊕, → y ↔ (la app también acepta ~, &, |, -> y <->); ≡ es equivalencia lógica y ∴ marca la conclusión. Jerarquía, de más fuerte a más débil: ¬, ∧, ∨ y ⊕, →, ↔ (→ asocia a la derecha); ante la duda, paréntesis. Las tablas de verdad usan V y F con el orden de filas de la app. Reglas de inferencia con nombre en español y abreviatura: modus ponens (MP), modus tollens (MT), silogismo hipotético (SH), silogismo disyuntivo (SD, el modus tollendo ponens de otros libros), adición (Ad), simplificación (Simp), conjunción (Conj), resolución (Res) y dilema constructivo (DC); con cuantificadores, IU, GU, IE y GE. ℕ = {0, 1, 2, …} y ℤ⁺ = {1, 2, 3, …}; los enunciados dicen n ≥ 0 o n ≥ 1. Conjuntos: ⊆ es subconjunto y ⊊ subconjunto propio (no usamos ⊂); A − B, Aᶜ, A △ B, |A| y 𝒫(A). Enteros: a | b, mcd(a, b), mcm(a, b), a mod n ∈ {0, …, n − 1}, a ≡ b (mod n) y [a]ₙ; el residuo de la división cumple 0 ≤ r < |b|, cosa que el % de Python y el de C no siempre dan. Bases con subíndice: 1011₂ y 2F₁₆ (dígitos hexadecimales en mayúscula). Álgebra booleana: x + y, x·y (o xy) y x̄, con precedencia barra, producto y suma; sus tablas usan 0 y 1 y van de 00…0 a 11…1 con la primera variable como bit más significativo (en (x, y, z), la fila 101 es la 5); mᵢ lleva barra donde el bit de i es 0 y Mᵢ donde es 1; las formas canónicas se escriben Σm(…) y ΠM(…), y las condiciones de «no importa», + d(…). Compuertas: AND, OR, NOT, NAND, NOR y XOR (x ⊕ y); un circuito se describe como lista, g₁ = NAND(x, y). Mapas de Karnaugh en orden de Gray: 00, 01, 11, 10. Relaciones: S∘R es «primero R, luego S», como g∘f, y su matriz es M_R ⊙ M_S. Grafos: camino (puede repetir), recorrido (sin aristas repetidas), trayectoria (sin vértices repetidos), circuito (recorrido cerrado) y ciclo (circuito sin vértices repetidos salvo los extremos); Euler va con recorridos y circuitos, Hamilton con trayectorias y ciclos. BFS y DFS visitan a los vecinos en orden alfabético y DFS es recursivo. Logaritmos siempre con base."
# Temario aprobado por Carlo el 2026-11-13 contra curriculum/programas/matematicas-discretas.pdf (IIA, plan 2020).
# Cada bloque es una unidad de Cortex; entre paréntesis, la sección del programa oficial.
# Los números de unidad son permanentes (van en los ids de ejercicio disc-NN-NNN).
# 22 y 23 son extra: el programa no trae conteo ni recurrencias.
