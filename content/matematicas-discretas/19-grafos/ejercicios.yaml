      Las aristas son $12$, $13$, $14$, $15$, $23$, $35$, $36$, $45$ y $56$: nueve. **Lo de Rocío:** 7 términos en la sucesión, así que usa 6 aristas, $12$, $23$, $36$, $65$, $54$ y $41$. Pasa una vez por cada vértice y vuelve: es un ciclo hamiltoniano, no un circuito euleriano. **Lo que falta:** un circuito euleriano usa las 9 aristas, y su sucesión, escrita como la de Rocío, con el primer vértice repetido al final, tiene $9+1=10$ términos. Le faltaron $13$, $15$ y $35$, cuyos extremos son el 1, el 3 y el 5: 3 vértices distintos. **¿Hay?** Los grados son 4, 2, 4, 2, 4 y 2, todos pares, y el grafo es conexo: sí. Uno es su sucesión más el triángulo que le faltó: $1,2,3,6,5,4,1,3,5,1$. ¿Qué contarás antes de entregar un circuito euleriano? Revisa: esa sucesión tiene 10 términos y 9 aristas distintas.
