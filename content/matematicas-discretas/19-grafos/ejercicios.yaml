  # razonamiento: espacial (ver el puente c–d y qué lado se cubre antes de cruzarlo) · R2
  # Cambio contra el esquema (del autor, por la regla del perímetro): se intercambiaron las etiquetas b y e.
  # Con las del v1 (a-b, a-g, b-c, b-g, c-d, c-g, d-e, d-f, e-f), el perímetro empezado en g, g, a, b, c, d, e, f, ya
  # era una trayectoria hamiltoniana, y el dibujo regalaba dos de las respuestas. Es el mismo grafo con otros nombres:
  # el puente sigue siendo c–d y la respuesta sigue siendo {a, b, e, f, g}. Ahora el perímetro solo tiene c–d y g–a.
  # Lo usa el repaso de la 20 (esquema-20: una trayectoria hamiltoniana contra un orden DFS).
  # verificar: los inicios de todas las permutaciones que son trayectorias (con las aristas nuevas, desde el visual).
  - id: disc-19-013
    tipo: conjunto
    dificultad: 3
    conceptos: [hamiltoniano]
    enunciado: >-
      Una **trayectoria hamiltoniana** pasa por cada vértice exactamente una vez, sin volver al de salida. ¿En qué vértices puede empezar una trayectoria hamiltoniana de este grafo? Escribe todos, separados por comas, como `x, y`.
    visual: { id: grafo, vertices: "a, b, c, d, e, f, g", aristas: "a-e, a-g, b-d, b-f, c-d, c-e, c-g, d-f, e-g" }
    respuesta: ["a", "b", "e", "f", "g"]
    verificar: { python: "(lambda V, E: {p[0] for p in (lambda V, A: [p for p in itertools.permutations(V) if all(p[i + 1] in A[p[i]] for i in range(len(p) - 1))])(V, (lambda V, E: {v: {w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v} for v in V})(V, E))})('a, b, c, d, e, f, g'.split(', '), [tuple(e.split('-')) for e in 'a-e, a-g, b-d, b-f, c-d, c-e, c-g, d-f, e-g'.split(', ')])" }
    pistas:
