    explicacion: >-
      Los tramos son $13$, $15$, $16$, $24$, $25$, $28$, $35$, $36$, $38$, $47$ y $57$, y el grafo es conexo. **Grados:** el 1 y el 2 tienen 3; el 3 y el 5, 4; los demás, 2. Hay 2 postes impares, así que hay recorrido euleriano, del 1 al 2 o del 2 al 1: por ejemplo, $1,5,2,4,7,5,3,1,6,3,8,2$. **Volver:** volar otra vez un tramo es como agregar una copia de esa arista, y cambia la paridad de sus dos extremos. Con una sola copia habría que unir el 1 con el 2, y no hay tramo $12$; con dos, $25$ y $51$, todos los grados quedan pares, y el dron vuelve del 2 al 1 por el 5. **Postes:** $1,5,7,4,2,8,3,6,1$ visita cada poste una vez y vuelve: es un ciclo hamiltoniano. Revisa: el recorrido tiene 12 postes en su sucesión, uno más que los 11 tramos.
