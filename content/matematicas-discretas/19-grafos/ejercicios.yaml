  # razonamiento: espacial (seguir las flechas desde cada lado y ver qué grupo no tiene regreso) · R1
  # Sin flechas antiparalelas (M). El hueco 3 dice «distintos de e», por el camino sin aristas.
  # verificar: débil por cerradura sin dirección, fuerte por cerradura dirigida desde cada vértice, alcance de e, y
  # cuenta de las flechas nuevas (u, w) que, solas, lo vuelven fuerte.
  - id: disc-19-017
    tipo: completar
    dificultad: 3
    conceptos: [caminos-conexidad]
    enunciado: >-
      Un grafo dirigido es **fuertemente conexo** si hay un camino dirigido, que sigue las flechas, de cada vértice a cada otro, y **débilmente conexo** si es conexo al ignorar la dirección de las flechas. Contesta sobre este grafo dirigido.
    visual: { id: grafo, vertices: "a, b, c, d, e, f", aristas: "a-b, b-c, b-e, c-a, c-d, d-e, e-f, f-d", dirigido: "si" }
    texto: >-
      ¿Es débilmente conexo? (1 sí, 0 no): ___ · ¿es fuertemente conexo? (1 sí, 0 no): ___ · número de vértices distintos de $e$ a los que llega un camino dirigido desde $e$: ___ · número de flechas nuevas $(u,v)$, con $u\neq v$ y que no estén ya en el grafo, tales que agregar solo esa flecha lo vuelve fuertemente conexo: ___
    respuestas: ["1", "0", "2", "9"]
    verificar: { python: "(lambda V, E, R, O, A: (lambda F: [int(R(A(V, E), 'a') == set(V)), int(F(E)), len(R(O(V, E), 'e')) - 1, sum(1 for u in V for w in V if u != w and (u, w) not in E and F(E + [(u, w)]))])(lambda X: all(R(O(V, X), v) == set(V) for v in V)))('a, b, c, d, e, f'.split(', '), [tuple(e.split('-')) for e in 'a-b, b-c, b-e, c-a, c-d, d-e, e-f, f-d'.split(', ')], (lambda A, s: list(itertools.accumulate(range(len(A)), lambda S, _: S | frozenset(w for v in S for w in A[v]), initial=frozenset({s})))[-1]), (lambda V, E: {v: {b for (a, b) in E if a == v} for v in V}), (lambda V, E: {v: {w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v} for v in V}))" }
    pistas:
      - >-
        ¿Hay grupos de vértices que se alcanzan todos entre sí? ¿Hay flechas de un grupo a otro, y al menos una de regreso?
      - >-
        ¿De qué grupo a cuál tendría que ir una flecha nueva para que todos lleguen a todos?
    explicacion: >-
      Las flechas son $(a,b)$, $(b,c)$, $(b,e)$, $(c,a)$, $(c,d)$, $(d,e)$, $(e,f)$ y $(f,d)$. **Débil:** sin la dirección, todo queda unido, así que sí. **Fuerte:** $a\to b\to c\to a$ deja que $a$, $b$ y $c$ se alcancen entre sí, y $d\to e\to f\to d$ hace lo mismo con $d$, $e$ y $f$. Hay flechas de $\{a,b,c\}$ a $\{d,e,f\}$, $(b,e)$ y $(c,d)$, pero ninguna de regreso: desde $e$ solo se llega a $f$ y a $d$, 2 vértices, y nunca a $a$, $b$ o $c$. No es fuerte. **Flechas nuevas:** una que vaya de $\{d,e,f\}$ a $\{a,b,c\}$ da el regreso, y entonces cada vértice llega a cada otro; son $3\cdot3=9$, y ninguna estaba. Una flecha nueva dentro de un grupo, o de $\{a,b,c\}$ a $\{d,e,f\}$, no da salida a $d$, $e$ y $f$. Revisa: con la nueva $(f,a)$, desde $e$ se llega a $f$, luego a $a$ y de ahí a $b$, $c$ y $d$.
