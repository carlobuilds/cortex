    explicacion: >-
      **La suma:** $2+3+3+3+3+1=15$. **¿Puede estar completa?** En la lista completa de un grafo no dirigido, cada arista $uv$ sale dos veces, $v$ en la lista de $u$ y $u$ en la de $v$, así que la suma es $\sum\deg(v)=2\lvert E\rvert$, un número par. Como 15 es impar, falta o sobra al menos una anotación. **¿Dónde?** Se revisa cada anotación contra su espejo: $e$ anota a $f$, pero $f$ no anota a $e$. Es la única que no tiene pareja; las otras 14 salen en parejas, como $ab$ y $ba$. La explicación más simple es que a la lista de $f$ le falta $e$: con ella, la suma da $16=2\cdot8$. Si en cambio $e$ anotó a $f$ por error, la sospechosa sigue siendo la arista $ef$.
