# Unidad 19 · Grafos (Unidad IV, 4.5.1 y 4.5.2). Para el 3.er parcial (semana del 23 al 27 de noviembre de 2026).
# BFS, DFS y Dijkstra son de la 20; los árboles, de la 21; Euler para dirigidos no entra.
# Esquema v1 aprobado por Carlo el 2026-11-14 (esquema-19), revisado por experto-matematicas, pedagogo y
# arquitecto-razonamiento. Datos de experto-matematicas, comprobados por la sesión principal con código propio; el autor
# volvió a comprobar con enumeración los números, recorridos y ciclos de las explicaciones.
# Ids en el orden de la tabla del v1, escalera 6/6/6/4/3: d1 001–006, d2 007–012, d3 013–018, d4 019–022, d5 023–025.
# Anclas (primer ejercicio de cada concepto, workedExampleFor): 001 GT, 002 GV, 003 RG, 004 CC, 005 EU y 006 HA, todas
# de d1, con lo que se pide escrito en el enunciado y con la explicación completa. WorkedExample muestra solo enunciado y
# explicación, así que la explicación de cada ancla con visual lista el grafo. Los ejercicios con dos o tres conceptos
# muestran el ancla d1 de cualquiera de ellos.
# Abreviaturas: GT grafo-tipos · GV grado-vertice · RG representacion-grafos · CC caminos-conexidad · EU euleriano ·
# HA hamiltoniano. El 022 también lleva `aritmetica-modular` (unidad 18), como dice el esquema.
# Terminología con un solo sentido (la de la `notacion`): camino (puede repetir), recorrido (sin aristas repetidas),
# trayectoria (sin vértices repetidos), circuito (recorrido cerrado) y ciclo (circuito sin vértices repetidos salvo los
# extremos). Euler va con recorrido y circuito; Hamilton, con trayectoria y ciclo. «Recorrer» no se usa como verbo, para
# no chocar con «recorrido». «Componente» es siempre la componente conexa; «vecinos», los extremos de una arista. En
# dirigidos, deg⁻ (entrada) y deg⁺ (salida); la sesión principal los agrega a la `notacion`.
# Hipótesis (experto-matematicas): un lazo suma 2 al grado; Euler en multigrafos conexos (circuito ⇔ todos pares;
# recorrido ⇔ 0 o 2 impares; recorrido que no es circuito ⇔ exactamente 2, y va de uno al otro); Dirac en simples con
# n ≥ 3; fuerte = camino dirigido de cada vértice a cada otro, débil = conexo sin flechas. Ningún ejercicio tiene
# vértices aislados; el grafo desconexo del 014 tiene aristas en sus dos componentes.
# Visual `grafo` (plataforma, experto-matematicas): en un ejercicio el dibujo es fijo y su pie lista las aristas, no los
# grados (visuals.ts), así que nunca se pide «cuántas aristas» de un grafo dibujado. Las aristas van ordenadas, para que
# el orden no delate un recorrido. Como máximo 9 vértices y sin flechas antiparalelas. En los de Hamilton (006, 013,
# 024 y 025), el perímetro del círculo, el orden de `vertices`, no es ciclo ni trayectoria, tampoco empezado en otro
# vértice: el autor lo revisó con todas las rotaciones, y por eso el 013 cambió (ver su comentario). El 024 mostraba 5
# aristas de su ciclo en el perímetro; desde los arreglos del 2026-11-15 es el mismo grafo renombrado y no tiene ninguna.
# Las aristas se parten con ', ', así que en `aristas` llevan espacio; cada `verificar` las lee del MISMO texto que su
# visual.
# `verificar`: los de experto-matematicas (herramientas/m19/verificar-19.py), en Python puro y sin cambios, salvo el 008
# (abductivo de arquitecto-razonamiento, escrito por el autor), las aristas del 013 y, desde los arreglos del
# 2026-11-15, las aristas del 024 y las dos condicionales del 014. Vía independiente: Euler por búsqueda exhaustiva de
# recorridos (no por el criterio de grados), Hamilton por permutaciones, conexidad por cerradura y sucesiones de grados
# por fuerza bruta sobre todos los grafos. Probados con el check_exercise real (24/24) y con respuestas alteradas
# (neg.py de M, más las del 008 y el 013; tras los arreglos, también las del 014 y el 024).
# `completar`: huecos fuera de KaTeX; cada hueco dice si pide un número o un vértice; el sí o no va con 1 (sí) o 0 (no).
# `conjunto`: el ejemplo de formato (`x, y`) no usa vértices del grafo.
# Pistas como preguntas, sin valores intermedios: 1 en d1–2, 2 en d3 y 3 en d4–5 (las del 019, 023 y 025 son de
# arquitecto-razonamiento). Desde d3, la explicación cierra con «Revisa:», con una comprobación que no repite el
# cálculo. Las explicaciones de selección y opción múltiple dicen cuáles son las correctas.
# Manuales: solo el 019 (autoevaluación, tarjeta: false).
# Personajes: Marta (014, error plantado; Ana ya salió en la 16 y la 17) y Rocío (015, metacognitivo).
# Textos con LaTeX en bloques `>-`: así no hay que escapar comillas ni barras.
unidad: matematicas-discretas/19-grafos
ejercicios:
  # razonamiento: deductivo (aplicar la definición: ¿hay lazos? ¿hay aristas repetidas?) · R0
  # Ancla de GT. Opciones de experto-matematicas: la de {1, 2} y {3, 4} atrapa a quien confunde simple con conexo, y la
  # sin aristas, a quien cree que hace falta al menos una.
  # verificar: sin lazos (a ≠ b) y sin aristas repetidas (como conjuntos), sobre las seis listas.
  - id: disc-19-001
    tipo: seleccion_multiple
    dificultad: 1
    conceptos: [grafo-tipos]
    enunciado: >-
      Un grafo es **simple** si no tiene lazos (aristas de un vértice a sí mismo) ni aristas múltiples (dos o más aristas con los mismos dos extremos). Cada opción describe un grafo no dirigido con vértices $\{1,2,3,4\}$. ¿Cuáles son simples? Puede haber varias.
    opciones:
      - >-
        Aristas $\{1,2\}$ y $\{2,3\}$.
      - >-
        Dos aristas $\{1,2\}$ y una arista $\{2,3\}$.
      - >-
        Una arista $\{1,2\}$ y un lazo en el 2.
      - >-
        Aristas $\{1,2\}$ y $\{3,4\}$.
      - >-
        Ninguna arista.
      - >-
        Aristas $\{1,2\}$ y $\{2,3\}$, y un lazo en el 3.
    correctas: [0, 3, 4]
    verificar: { python: "[all(a != b for (a, b) in E) and len({frozenset(e) for e in E}) == len(E) for E in [[(1, 2), (2, 3)], [(1, 2), (1, 2), (2, 3)], [(1, 2), (2, 2)], [(1, 2), (3, 4)], [], [(1, 2), (2, 3), (3, 3)]]]" }
    pistas:
      - >-
        En cada opción, ¿hay una arista que empiece y termine en el mismo vértice? ¿Hay dos aristas con los mismos extremos?
    explicacion: >-
      Son simples «aristas $\{1,2\}$ y $\{2,3\}$», «aristas $\{1,2\}$ y $\{3,4\}$» y «ninguna arista»; las otras tres no. **No son simples:** «dos aristas $\{1,2\}$» tiene aristas múltiples, y «un lazo en el 2» y «un lazo en el 3» tienen lazos. **Las que sí:** «$\{1,2\}$ y $\{3,4\}$» no es conexo, pero eso no importa, porque ser simple solo habla de lazos y aristas múltiples. «Ninguna arista» también es simple: no tiene nada que lo impida.
    tiempo_estimado_s: 45

  # razonamiento: espacial (leer en el dibujo las aristas que tocan a cada vértice) · R0
  # Ancla de GV; la explicación lista el grafo.
  # verificar: cuenta las aristas del texto del visual que contienen a p y a r, y los vértices de grado impar.
  - id: disc-19-002
    tipo: completar
    dificultad: 1
    conceptos: [grado-vertice]
    enunciado: >-
      El **grado** de un vértice $v$, $\deg(v)$, es el número de aristas que lo tocan (un lazo contaría 2, pero aquí no hay). Contesta sobre este grafo.
    visual: { id: grafo, vertices: "p, q, r, s, t, u", aristas: "p-q, p-r, p-s, q-r, r-s, r-t, s-u, t-u" }
    texto: >-
      $\deg(p)=$ ___ · $\deg(r)=$ ___ · número de vértices de grado impar: ___
    respuestas: ["3", "4", "2"]
    verificar: { python: "(lambda V, E: [sum(1 for e in E if 'p' in e), sum(1 for e in E if 'r' in e), sum(1 for v in V if sum(1 for e in E if v in e) % 2 == 1)])('p, q, r, s, t, u'.split(', '), [tuple(e.split('-')) for e in 'p-q, p-r, p-s, q-r, r-s, r-t, s-u, t-u'.split(', ')])" }
    pistas:
      - >-
        ¿Cuántas aristas tienen a $p$ como uno de sus extremos? ¿Y a $r$?
    explicacion: >-
      El grafo tiene vértices $p$, $q$, $r$, $s$, $t$ y $u$, y aristas $pq$, $pr$, $ps$, $qr$, $rs$, $rt$, $su$ y $tu$. A $p$ lo tocan $pq$, $pr$ y $ps$: $\deg(p)=3$. A $r$ lo tocan $pr$, $qr$, $rs$ y $rt$: $\deg(r)=4$. Los demás tienen $\deg(q)=2$, $\deg(s)=3$, $\deg(t)=2$ y $\deg(u)=2$, así que los de grado impar son $p$ y $s$: 2. Comprueba: $3+2+4+3+2+2=16=2\cdot8$, el doble del número de aristas.
    tiempo_estimado_s: 45

  # razonamiento: algorítmico (recorrer las columnas 1 a 5 y preguntar si {2, j} es arista) · R0
  # Ancla de RG; la explicación lista el grafo. El error típico, poner 1 en la diagonal, lo rechaza el verificar (neg.py).
  # verificar: 1 si el par {2, j} está entre las aristas del texto del visual.
  - id: disc-19-003
    tipo: completar
    dificultad: 1
    conceptos: [representacion-grafos]
    enunciado: >-
      La **matriz de adyacencia** de un grafo simple con vértices $1,\dots,n$ tiene en la fila $i$ y la columna $j$ un 1 si $\{i,j\}$ es arista, y un 0 si no. Escribe la fila del vértice 2 en la matriz de este grafo; cada entrada es el número 0 o el 1.
    visual: { id: grafo, vertices: "1, 2, 3, 4, 5", aristas: "1-2, 1-4, 2-3, 2-5, 3-4, 4-5" }
    texto: >-
      Fila del 2, columna 1: ___ · columna 2: ___ · columna 3: ___ · columna 4: ___ · columna 5: ___
    respuestas: ["1", "0", "1", "0", "1"]
    verificar: { python: "(lambda V, E: (lambda S: [int(frozenset(('2', w)) in S) for w in V])({frozenset(e) for e in E}))('1, 2, 3, 4, 5'.split(', '), [tuple(e.split('-')) for e in '1-2, 1-4, 2-3, 2-5, 3-4, 4-5'.split(', ')])" }
    pistas:
      - >-
        ¿Quiénes son los vecinos del 2? ¿Puede el 2 ser vecino de sí mismo en un grafo simple?
    explicacion: >-
      El grafo tiene vértices 1 a 5 y aristas $\{1,2\}$, $\{1,4\}$, $\{2,3\}$, $\{2,5\}$, $\{3,4\}$ y $\{4,5\}$. Los vecinos del 2 son el 1, el 3 y el 5, así que la fila del 2 es 1, 0, 1, 0, 1. La columna 2 vale 0: un grafo simple no tiene lazos, y por eso su diagonal va en 0. Comprueba: la fila suma 3, que es $\deg(2)$.
    tiempo_estimado_s: 45

  # razonamiento: espacial (seguir aristas desde un vértice hasta agotar a los que alcanza) · R1
  # Ancla de CC; la explicación lista el grafo. valores 1–4 (M): el número de componentes.
  # verificar: número de cerraduras distintas (los vértices alcanzables desde cada vértice).
  - id: disc-19-004
    tipo: opcion_multiple
    dificultad: 1
    conceptos: [caminos-conexidad]
    enunciado: >-
      Un grafo es **conexo** si hay un camino entre cada par de vértices. Sus **componentes conexas** son los grupos de vértices unidos entre sí por caminos, y un grafo conexo tiene una sola. ¿Cuántas componentes conexas tiene este grafo?
    visual: { id: grafo, vertices: "a, b, c, d, e, f, g", aristas: "a-d, a-f, b-c, b-g, c-e, d-f, e-g" }
    opciones:
      - "Una: es conexo"
      - "Dos"
      - "Tres"
      - "Cuatro"
    valores: ["1", "2", "3", "4"]
    correcta: 1
    verificar: { python: "(lambda V, E: (lambda A: len({(lambda A, s: list(itertools.accumulate(range(len(A)), lambda S, _: S | frozenset(w for v in S for w in A[v]), initial=frozenset({s})))[-1])(A, v) for v in V}))((lambda V, E: {v: {w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v} for v in V})(V, E)))('a, b, c, d, e, f, g'.split(', '), [tuple(e.split('-')) for e in 'a-d, a-f, b-c, b-g, c-e, d-f, e-g'.split(', ')])" }
    pistas:
      - >-
        Si empiezas en $a$ y sigues aristas, ¿a qué vértices llegas? ¿Quedan vértices sin alcanzar?
    explicacion: >-
      Tiene dos. El grafo tiene vértices $a$ a $g$ y aristas $ad$, $af$, $bc$, $bg$, $ce$, $df$ y $eg$. **Desde $a$** se llega a $d$ y a $f$, y de ahí a nadie más: $\{a,d,f\}$. **Desde $b$** se llega a $c$ y a $g$, y por ellos a $e$: $\{b,c,e,g\}$. Ninguna arista une un grupo con el otro, así que son 2 componentes y el grafo no es conexo. Comprueba: las dos juntas tienen los 7 vértices.
    tiempo_estimado_s: 45

  # razonamiento: deductivo (conexo y todos los grados pares ⇒ circuito, por el teorema) · R1
  # Ancla de EU; la explicación lista el grafo. valores 0–2 (M): 0 = circuito, 1 = recorrido que no es circuito,
  # 2 = ninguno. Las tres opciones se excluyen: con todos los grados pares, todo recorrido euleriano es cerrado.
  # verificar: busca todos los recorridos que usan cada arista una vez (sin criterio de grados) y mira si alguno cierra.
  - id: disc-19-005
    tipo: opcion_multiple
    dificultad: 1
    conceptos: [euleriano]
    enunciado: >-
      Un **recorrido euleriano** usa cada arista exactamente una vez; si además termina en el vértice donde empezó, es un **circuito euleriano**. ¿Qué tiene este grafo?
    visual: { id: grafo, vertices: "a, b, c, d, e, f", aristas: "a-b, a-d, b-c, b-d, b-e, c-e, d-e, d-f, e-f" }
    opciones:
      - "Un circuito euleriano."
      - "Un recorrido euleriano, pero ningún circuito euleriano."
      - "Ningún recorrido euleriano."
    valores: ["0", "1", "2"]
    correcta: 0
    verificar: { python: "(lambda V, E: (lambda T: 0 if any(s == t for (s, t) in T) else (1 if T else 2))((lambda V, E: (lambda go: {(s, t) for s in V for t in go(go, s, frozenset())})(lambda go, v, used: {v} if len(used) == len(E) else {t for i in range(len(E)) if i not in used and v in E[i] for t in go(go, E[i][1] if E[i][0] == v else E[i][0], used | {i})}))(V, E)))('a, b, c, d, e, f'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-d, b-c, b-d, b-e, c-e, d-e, d-f, e-f'.split(', ')])" }
    pistas:
      - >-
        ¿Es conexo? ¿Cuántos vértices tienen grado impar?
    explicacion: >-
      Tiene un circuito euleriano. El grafo tiene vértices $a$ a $f$ y aristas $ab$, $ad$, $bc$, $bd$, $be$, $ce$, $de$, $df$ y $ef$, y es conexo. Sus grados son $a$ 2, $b$ 4, $c$ 2, $d$ 4, $e$ 4 y $f$ 2: todos pares. Por el teorema de Euler, un multigrafo conexo con todos sus grados pares tiene circuito euleriano. Uno es $a,b,c,e,b,d,e,f,d,a$. Comprueba: usa 9 aristas distintas, todas las del grafo, y vuelve a $a$.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (revisar cada sucesión: cerrada, cada vértice una vez, aristas que existen) · R1
  # Ancla de HA; la explicación lista el grafo. Ninguna arista del grafo une vecinos del perímetro.
  # verificar: cada sucesión cerrada, con los 6 vértices una vez y cada paso por una arista del texto del visual.
  - id: disc-19-006
    tipo: seleccion_multiple
    dificultad: 1
    conceptos: [hamiltoniano]
    enunciado: >-
      Un **ciclo hamiltoniano** pasa por cada vértice exactamente una vez, siempre por aristas del grafo, y vuelve al vértice de salida. ¿Cuáles de estas sucesiones son ciclos hamiltonianos de este grafo? Puede haber varias.
    visual: { id: grafo, vertices: "a, b, c, d, e, f", aristas: "a-c, a-d, a-e, b-d, b-e, b-f, c-e, c-f, d-f" }
    opciones:
      - >-
        $a,c,f,d,b,e,a$
      - >-
        $b,f,c,e,a,d,b$
      - >-
        $a,c,e,b,d,f,a$
      - >-
        $a,d,f,c,e,a$
      - >-
        $a,e,b,d,f,c,e,a$
      - >-
        $e,c,a,d,f,b,e$
    correctas: [0, 1, 5]
    verificar: { python: "(lambda V, E: (lambda A: [p[0] == p[-1] and len(p) == len(V) + 1 and set(p[:-1]) == set(V) and all(p[i + 1] in A[p[i]] for i in range(len(p) - 1)) for p in [x.split(', ') for x in ['a, c, f, d, b, e, a', 'b, f, c, e, a, d, b', 'a, c, e, b, d, f, a', 'a, d, f, c, e, a', 'a, e, b, d, f, c, e, a', 'e, c, a, d, f, b, e']]])((lambda V, E: {v: {w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v} for v in V})(V, E)))('a, b, c, d, e, f'.split(', '), [tuple(e.split('-')) for e in 'a-c, a-d, a-e, b-d, b-e, b-f, c-e, c-f, d-f'.split(', ')])" }
    pistas:
      - >-
        En cada sucesión, ¿cada paso va por una arista? ¿Aparece cada vértice exactamente una vez antes de volver?
    explicacion: >-
      Son ciclos hamiltonianos $a,c,f,d,b,e,a$, $b,f,c,e,a,d,b$ y $e,c,a,d,f,b,e$; las otras tres no. El grafo tiene vértices $a$ a $f$ y aristas $ac$, $ad$, $ae$, $bd$, $be$, $bf$, $ce$, $cf$ y $df$. En las tres, cada paso va por una arista y los seis vértices salen una vez antes de volver; un ciclo puede empezar en cualquier vértice, como el de $b$ y el de $e$. **Las que no:** $a,c,e,b,d,f,a$ cierra con $fa$, que no es arista; $a,d,f,c,e,a$ no pasa por $b$; y $a,e,b,d,f,c,e,a$ pasa dos veces por $e$.
    tiempo_estimado_s: 60

  # razonamiento: inductivo (de K₃, K₄ y K₅ al patrón: cada vértice tiene n − 1 vecinos y cada arista se cuenta dos veces) · R1
  # El error n(n − 1) sin dividir entre 2 (42 y 132) lo rechaza el verificar (neg.py).
  # verificar: cuenta los pares de vértices con itertools.combinations, sin fórmula.
  - id: disc-19-007
    tipo: completar
    dificultad: 2
    conceptos: [grafo-tipos]
    enunciado: >-
      $K_n$ es el grafo simple con $n$ vértices y una arista entre cada dos vértices distintos.
    texto: >-
      Número de aristas de $K_7$: ___ · número de aristas de $K_{12}$: ___ · número de aristas que hay que agregarle a un grafo simple con 9 vértices y 20 aristas para convertirlo en $K_9$: ___
    respuestas: ["21", "66", "16"]
    verificar: { python: "[len(list(itertools.combinations(range(7), 2))), len(list(itertools.combinations(range(12), 2))), len(list(itertools.combinations(range(9), 2))) - 20]" }
    pistas:
      - >-
        ¿Cuántas aristas tienen $K_3$, $K_4$ y $K_5$? ¿Qué patrón ves al pasar de uno al siguiente?
    explicacion: >-
      $K_3$, $K_4$ y $K_5$ tienen 3, 6 y 10 aristas: al agregar un vértice nuevo, se une con todos los que ya estaban. En general, cada uno de los $n$ vértices tiene $n-1$ vecinos; al sumar, $n(n-1)$ cuenta cada arista dos veces, una por extremo, así que $K_n$ tiene $\frac{n(n-1)}{2}$. **Las cuentas:** $K_7$ tiene $\frac{7\cdot6}{2}=21$ y $K_{12}$, $\frac{12\cdot11}{2}=66$. $K_9$ tiene $\frac{9\cdot8}{2}=36$, así que a un simple con 9 vértices y 20 aristas le faltan $36-20=16$. Un error común es no dividir entre 2: 42 y 132 cuentan cada arista dos veces.
    tiempo_estimado_s: 60

  # razonamiento: abductivo (de una suma impar a la mejor explicación: falta una anotación, y ¿cuál?) · R2
  # De arquitecto-razonamiento (esquema v1, en lugar del 008 de M, que despejaba n con el apretón de manos). El hueco 2
  # no lo contesta la gramática del 3 y el 4: «si hay una arista…; si no hay ninguna, escribe 0 en cada uno» (antes
# «0 y 0»; el cambio es del resolutor a ciegas, arreglos del 2026-11-15).
  # verificar (del autor): suma de las longitudes de las listas; 1 si la lista es simétrica y sin lazos; y la única
  # anotación sin espejo, (quién la anota, en cuya lista falta). Lee la lista del mismo texto del enunciado.
  # Comprobado contra respuestas alteradas: 16, 1, e/f al revés y 0, 0 fallan.
  - id: disc-19-008
    tipo: completar
    dificultad: 2
    conceptos: [grado-vertice, representacion-grafos]
    enunciado: |-
      Alguien copió la lista de adyacencia de un grafo simple no dirigido, con cada vértice y la lista de sus vecinos:

      - $a$: $b$, $c$
      - $b$: $a$, $c$, $d$
      - $c$: $a$, $b$, $e$
      - $d$: $b$, $e$, $f$
      - $e$: $c$, $d$, $f$
      - $f$: $d$
    texto: >-
      Número de vecinos anotados, sumando las seis listas: ___ · ¿puede ser la lista completa y sin errores? (1 sí, 0 no): ___ · si hay una arista anotada en la lista de uno de sus extremos y no en la del otro, vértice que la anota: ___ · vértice en cuya lista falta: ___ (si no hay ninguna, escribe 0 en cada uno)
    respuestas: ["15", "0", "e", "f"]
    verificar: { python: "(lambda L: (lambda A: [sum(len(L[v]) for v in L), int(len(A) == 0 and all(v not in L[v] for v in L)), A[0][0] if len(A) == 1 else (0 if len(A) == 0 else -1), A[0][1] if len(A) == 1 else (0 if len(A) == 0 else -1)])([(u, v) for u in sorted(L) for v in L[u] if v not in L or u not in L[v]]))({x.split(': ')[0]: x.split(': ')[1].split(', ') for x in 'a: b, c · b: a, c, d · c: a, b, e · d: b, e, f · e: c, d, f · f: d'.split(' · ')})" }
    pistas:
