    verificar: { python: "(lambda V, E: [sum(1 for (a, b) in E if b == 's'), sum(1 for (a, b) in E if a == 'q'), (lambda L: L[0] if len(L) == 1 else -1)([v for v in V if not any(b == v for (a, b) in E)]), sum(1 for v in V if sum(1 for (a, b) in E if b == v) == sum(1 for (a, b) in E if a == v))])('p, q, r, s, t'.split(', '), [tuple(e.split('-')) for e in 'p-q, p-s, q-r, r-p, r-s, s-q, t-p, t-r'.split(', ')])" }
