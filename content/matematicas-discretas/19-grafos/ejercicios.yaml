  # razonamiento: deductivo (tumbar un «para todo» con un grafo concreto o demostrarlo) · R4
  # De experto-matematicas, con n ≥ 3 en el enunciado para todas (el verificar enumera n = 3, 4 y 5). Pistas de
  # arquitecto-razonamiento, como preguntas. Sin el moño (dos triángulos con un vértice común) y sin «K_n es
  # hamiltoniano». Contraejemplos de M: dos cuadrados con un vértice común (0), K₄ (1) y C₅ (4). En los arreglos del
  # 2026-11-15 la explicación nombra además los que ya daba la lección, «ya los tenías» (P): el grafo del ejemplo
  # «Aristas obligadas» para la (0) y el barrio B para la (1). La pista 2 dice «el grafo C_n, que es un solo ciclo» (L).
  # La (3) se demuestra girando el circuito para que termine en la arista quitada; no habla de agregar aristas entre
  # componentes (014).
  # verificar: las seis afirmaciones sobre TODOS los grafos simples con 3, 4 y 5 vértices (Euler por búsqueda,
  # Hamilton por permutaciones).
  - id: disc-19-023
    tipo: seleccion_multiple
    dificultad: 5
    conceptos: [euleriano, hamiltoniano]
    enunciado: >-
      Sea $G$ un grafo simple con $n\ge3$ vértices. ¿Cuáles de estas afirmaciones valen para todo $G$ así? Puede haber varias.
    opciones:
      - >-
        Si $G$ es conexo y tiene circuito euleriano, tiene ciclo hamiltoniano.
      - >-
        Si $G$ tiene ciclo hamiltoniano, tiene circuito euleriano.
      - >-
        Si $G$ tiene ciclo hamiltoniano, tiene al menos $n$ aristas.
      - >-
        Si $G$ es conexo y tiene circuito euleriano, al quitarle cualquier arista queda un grafo con recorrido euleriano.
      - >-
        Si $G$ tiene ciclo hamiltoniano, todos sus vértices tienen grado mayor o igual que $n/2$.
      - >-
        Si $G$ tiene ciclo hamiltoniano, al quitarle cualquier arista queda un grafo con trayectoria hamiltoniana.
    correctas: [2, 3, 5]
    verificar: { python: "(lambda GS, T: (lambda A, deg: (lambda con, ham, hamp, eul: [all(ham(n, E) for (n, E) in GS if con(n, E) and eul(n, E)), all(eul(n, E) for (n, E) in GS if ham(n, E)), all(len(E) >= n for (n, E) in GS if ham(n, E)), all(len(T(range(n), [f for f in E if f != e])) > 0 for (n, E) in GS if con(n, E) and eul(n, E) for e in E), all(all(2 * deg(E, v) >= n for v in range(n)) for (n, E) in GS if ham(n, E)), all(hamp(n, [f for f in E if f != e]) for (n, E) in GS if ham(n, E) for e in E)])(lambda n, E: (lambda A, s: list(itertools.accumulate(range(len(A)), lambda S, _: S | frozenset(w for v in S for w in A[v]), initial=frozenset({s})))[-1])(A(n, E), 0) == set(range(n)), lambda n, E: any(all(p[(i + 1) % n] in A(n, E)[p[i]] for i in range(n)) for p in ((0,) + q for q in itertools.permutations(range(1, n)))), lambda n, E: any(all(p[i + 1] in A(n, E)[p[i]] for i in range(n - 1)) for p in itertools.permutations(range(n))), lambda n, E: len(E) > 0 and all(deg(E, v) % 2 == 0 for v in range(n)) and any(s == t for (s, t) in T(range(n), E))))(lambda n, E: {v: {w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v} for v in range(n)}, lambda E, v: sum(1 for e in E if v in e)))([(n, [P[i] for i in range(len(P)) if m >> i & 1]) for n in (3, 4, 5) for P in [list(itertools.combinations(range(n), 2))] for m in range(1 << len(P))], (lambda V, E: (lambda go: {(s, t) for s in V for t in go(go, s, frozenset())})(lambda go, v, used: {v} if len(used) == len(E) else {t for i in range(len(E)) if i not in used and v in E[i] for t in go(go, E[i][1] if E[i][0] == v else E[i][0], used | {i})})))" }
    pistas:
      - >-
        ¿Dicen «para todo $G$»? ¿Qué basta para tumbar una, y qué hace falta para aceptarla?
      - >-
        ¿Qué pasa con casos chicos, como $K_4$, el grafo $C_n$, que es un solo ciclo, o dos ciclos que comparten un vértice?
      - >-
        Euler habla de aristas y Hamilton de vértices: si al quitar un vértice el grafo se parte, ¿puede tener ciclo hamiltoniano?
    explicacion: >-
      Valen «ciclo hamiltoniano implica al menos $n$ aristas», «con circuito euleriano, al quitar una arista queda un recorrido euleriano» y «con ciclo hamiltoniano, al quitar una arista queda una trayectoria hamiltoniana»; las otras tres fallan. **Contraejemplos:** dos cuadrados que comparten un vértice, con 7 vértices, son conexos y con grados 4 y 2, así que tienen circuito euleriano; pero un ciclo hamiltoniano pasaría dos veces por el vértice común, el único paso de un cuadrado al otro. $K_4$ tiene ciclo hamiltoniano, y sus cuatro grados son 3, impares. Y ya los tenías en la lección: el grafo del ejemplo «Aristas obligadas» es conexo, con grados 4, 4, 2, 2 y 2, todos pares, y no tiene ciclo hamiltoniano; el barrio $B$ tiene el ciclo hamiltoniano $a,b,d,f,e,c,a$, y sus esquinas $b$ y $e$ tienen grado 3. $C_5$ es su propio ciclo hamiltoniano, con grados $2<5/2$: Dirac es suficiente, no necesario. **Las que valen:** un ciclo hamiltoniano ya usa $n$ aristas distintas, una por cada paso entre sus $n$ vértices. Si se quita la arista $uv$, el circuito euleriano se puede escribir empezando en $v$ y terminando con $uv$, porque un circuito se puede empezar en cualquier punto; sin esa última arista, queda un recorrido de $v$ a $u$ que usa todas las demás. Y si se quita una arista, el ciclo hamiltoniano sin ella, o sin una de las suyas si la quitada no estaba en él, es una trayectoria hamiltoniana. Revisa con $C_5$: tiene justo $n=5$ aristas, y al quitarle una queda una trayectoria hamiltoniana que también es su recorrido euleriano.
    tiempo_estimado_s: 180

  # razonamiento: analógico (llevar postes y tramos a un grafo: Euler para los tramos, Hamilton para los postes) · R2
  # Transferencia, hipotético (M). Texto de L (arreglos del 2026-11-15): «terminar en un poste distinto del de salida»
  # (antes «sin volver al poste de salida», que al pie de la letra prohibía pasar otra vez por él), «el de número menor
  # primero» (así el 1 y el 2 no se leen como sí y no), las repeticiones se cuentan en total, una por cada vez que vuela
  # un tramo ya volado, y el hueco 5 dice que puede dejar tramos sin volar. El hueco 2 sigue con «si no puede, 0 y 0»,
  # para que su gramática no conteste el hueco 1. Repetir un tramo es agregar una copia de una arista que ya está.
  # Visual renombrado en los mismos arreglos (M): 3→4, 4→5, 5→7, 6→8, 7→3 y 8→6 sobre el de antes (1-4, 1-7, 1-8, 2-3,
  # 2-4, 2-6, 3-5, 4-5, 4-7, 6-7, 7-8), cuyo perímetro mostraba 5 aristas del ciclo hamiltoniano. Es el mismo grafo, con
  # las mismas respuestas, y ya no tiene ninguna arista en el perímetro.
  # verificar: grados, los extremos de todos los recorridos (búsqueda), el menor número de copias de tramos existentes
  # que deja un circuito euleriano, y ciclos hamiltonianos por permutaciones (tarda unos 5.5 s).
  - id: disc-19-024
