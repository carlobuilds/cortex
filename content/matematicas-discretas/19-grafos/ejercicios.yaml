        ¿Hay una arista que, si la quitas, parte el grafo en dos? ¿Cuántas veces puede cruzarla una trayectoria?
      - >-
        ¿Qué pasa si la trayectoria empieza en uno de los extremos de esa arista?
    explicacion: >-
      Las aristas son $ae$, $ag$, $bd$, $bf$, $cd$, $ce$, $cg$, $df$ y $eg$. **Un puente:** al quitar $cd$, el grafo se parte en $\{a,c,e,g\}$ y $\{b,d,f\}$, así que toda trayectoria hamiltoniana cruza $cd$ una sola vez: pasa por todo un lado, cruza y pasa por todo el otro. **Los extremos del puente no sirven:** si empezara en $c$ y cruzara primero a $d$, ya no podría volver a $a$, $e$ y $g$; si pasara primero por ellos, tendría que volver a $c$ para cruzar. Con $d$ pasa lo mismo. **Los demás sí:** $a,g,e,c,d,b,f$; $e,a,g,c,d,b,f$; $g,a,e,c,d,f,b$; y al revés, $f,b,d,c,e,a,g$ y $b,f,d,c,g,a,e$. Son $\{a,b,e,f,g\}$. Revisa: una trayectoria se puede leer al revés, así que los vértices donde puede terminar son los mismos donde puede empezar, y ni $c$ ni $d$ están.
