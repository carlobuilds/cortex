    verificar: { python: "(lambda G, R, A: [len({R(A(range(10), G(4)), v) for v in range(10)}), len(R(A(range(10), G(4)), 0)), int(any(all((p[(i + 1) % 10] - p[i]) % 10 in (3, 7) for i in range(10)) for p in ((0,) + q for q in itertools.permutations(range(1, 10))))), len(A(range(10), G(5))[0])])(lambda s: [(x, (x + s) % 10) for x in range(10)], (lambda A, s: list(itertools.accumulate(range(len(A)), lambda S, _: S | frozenset(w for v in S for w in A[v]), initial=frozenset({s})))[-1]), (lambda V, E: {v: {w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v} for v in V}))" }
    pistas:
      - >-
        Con $s=4$, ¿por qué vértices pasas si sales del 0 y das saltos de 4? ¿Y si sales del 1?
      - >-
        Con $s=3$, ¿vuelves al 0 antes de pasar por todos?
      - >-
        Con $s=5$, ¿qué arista da $x$ y cuál da $(x+5)\bmod10$?
    explicacion: >-
      **Con $s=4$:** cada $x$ es vecino de $(x+4)\bmod10$ y de $(x-4)\bmod10$. Desde el 0 se pasa por 0, 4, 8, 2 y 6, y de ahí se vuelve al 0; sumar o restar 4 y reducir módulo 10 no cambia la paridad, así que nunca se llega a un impar. Los impares, 1, 5, 9, 3 y 7, forman la otra componente: son 2, y la del 0 tiene 5 vértices. **Con $s=3$:** 0, 3, 6, 9, 2, 5, 8, 1, 4, 7, y de 7 se vuelve al 0, porque $7+3=10$; pasa una vez por cada vértice y regresa, así que es un ciclo hamiltoniano. **Con $s=5$:** $x$ da la arista hacia $y=(x+5)\bmod10$, y $y$ da la arista hacia $(y+5)\bmod10=x$, que es la misma; cada vértice tiene un solo vecino, y $G_5$ son 5 aristas sueltas. Revisa: con $s=4$ cada vértice tiene grado 2 y hay 10 aristas, 5 en cada componente.
