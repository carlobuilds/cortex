  # razonamiento: deductivo (contar los extremos de las aristas de dos maneras; paridad de una suma) · R3
  # Rúbrica de arquitecto-razonamiento (esquema v1), con «…» en lugar de comillas rectas. Revisión manual. La respuesta
  # modelo cumple cada criterio: parte de un G finito cualquiera y cuenta extremos, con el lazo (1); cuenta X por aristas
  # y por vértices y nombra las dos sumas (2); separa V_p y V_i y justifica que la resta es par (3); y concluye con la
  # paridad de una suma de k impares (4). El «Revisa:» con un ejemplo va al final, no como prueba.
  - id: disc-19-019
    tipo: autoevaluacion
    dificultad: 4
    conceptos: [grado-vertice]
    enunciado: >-
      En papel. Sea $G=(V,E)$ un grafo finito cualquiera, con lazos y aristas múltiples permitidos. **(1)** Demuestra el lema del apretón de manos: $\sum_{v\in V}\deg(v)=2\lvert E\rvert$. **(2)** Demuestra el corolario: el número de vértices de grado impar es par.
    rubrica:
      - >-
        Parte de un grafo finito cualquiera y cuenta los extremos de todas las aristas: cada arista tiene dos, y los dos de un lazo caen en el mismo vértice. No vale un ejemplo: «en $K_4$, $12=2\cdot6$» no demuestra nada.
      - >-
        Cuenta los extremos de dos maneras, por vértices ($\sum\deg(v)$) y por aristas (2 cada una), y concluye que $\sum\deg(v)=2\lvert E\rvert$. No basta «cada arista se cuenta dos veces» sin decir en qué suma.
      - >-
        Separa los vértices de grado par ($V_p$) de los de grado impar ($V_i$) y muestra que $\sum_{v\in V_i}\deg(v)=2\lvert E\rvert-\sum_{v\in V_p}\deg(v)$ es par.
      - >-
        Concluye que $\lvert V_i\rvert$ es par, porque una suma de $k$ números impares tiene la paridad de $k$. No cuenta «la suma de impares es impar»: $3+3=6$.
    respuesta_modelo: >-
      Sea $G=(V,E)$ un grafo finito cualquiera. Cada arista tiene dos extremos; en un lazo, los dos caen en el mismo vértice. Sea $X$ el número total de extremos, contados con repetición. **Por aristas:** cada arista aporta 2, así que $X=2\lvert E\rvert$. **Por vértices:** $\deg(v)$ es exactamente el número de extremos que caen en $v$ (un lazo aporta 2), así que $X=\sum_{v\in V}\deg(v)$. Las dos cuentas son del mismo $X$: $\sum_{v\in V}\deg(v)=2\lvert E\rvert$. **Corolario:** sean $V_p$ los vértices de grado par y $V_i$ los de grado impar. Entonces $\sum_{v\in V_i}\deg(v)=2\lvert E\rvert-\sum_{v\in V_p}\deg(v)$; $2\lvert E\rvert$ es par y la segunda suma también, porque es una suma de pares, así que su resta es par. Ahora, cada impar es de la forma $2m+1$, así que una suma de $k$ impares es un par más $k$: tiene la paridad de $k$. Como $\sum_{v\in V_i}\deg(v)$ es par, $k=\lvert V_i\rvert$ es par. Revisa con un triángulo con un lazo en un vértice: los grados son 4, 2 y 2, suman 8, y hay 4 aristas; ningún vértice tiene grado impar, y 0 es par.
    verificar: { revision: "manual" }
    pistas:
      - >-
        En un grafo chico que dibujes, ¿cuánto suman los grados y cuántas aristas hay? ¿Por qué salen así?
      - >-
        Si haces una tabla con una fila por vértice y una columna por arista, y anotas cuántos extremos de cada arista caen en cada vértice, ¿qué da sumar por filas? ¿Y por columnas?
      - >-
        Si separas los vértices de grado par de los de grado impar, ¿qué paridad tiene cada parte de la suma?
    explicacion: >-
      **La idea es contar dos veces lo mismo:** los extremos de las aristas. En la tabla vértice por arista, cada columna suma 2, porque cada arista tiene dos extremos (un lazo pone un 2 en su fila), y la fila de $v$ suma $\deg(v)$. Las dos sumas de toda la tabla son iguales: $\sum\deg(v)=2\lvert E\rvert$. **El corolario:** quita de la suma los grados pares; lo que queda, la suma de los impares, sigue siendo par. Y una suma de $k$ impares es par solo si $k$ es par. Probarlo con ejemplos no basta, porque un ejemplo no cubre todos los grafos, y «la suma de impares es impar» es falso: $3+3=6$. Revisa: en el grafo con aristas $ab$ y $bc$ los grados son 1, 2 y 1; hay dos impares, y $1+2+1=4=2\cdot2$.
    tarjeta: false
    tiempo_estimado_s: 300

  # razonamiento: deductivo (cada arista nueva cambia la paridad de sus dos extremos; ¿se pueden emparejar los impares?) · R2
  # «Sin aristas múltiples» lo dice el enunciado (M). Se cruza con el 014, pero no va en el jefe.
  # verificar: el menor k tal que algún conjunto de k aristas nuevas (sin repetir ni lazos) deja grados pares y un
  # circuito euleriano encontrado por búsqueda. El error 2 (= impares / 2) lo rechaza (neg.py).
  - id: disc-19-020
    tipo: numerico
    dificultad: 4
    conceptos: [euleriano]
    enunciado: >-
      ¿Cuál es el menor número de aristas que hay que agregarle a este grafo para que tenga circuito euleriano? Las aristas nuevas no pueden ser lazos ni repetir una arista que ya esté.
    visual: { id: grafo, vertices: "a, b, c, d, e, f, g", aristas: "a-b, a-c, a-d, b-e, b-f, c-f, c-g, d-e, d-g" }
    respuesta: 3
    tolerancia: 0
    verificar: { python: "(lambda V, E, T: (lambda N: min(k for k in range(6) if any(all(sum(1 for e in E + list(F) if v in e) % 2 == 0 for v in V) and any(s == t for (s, t) in T(V, E + list(F))) for F in itertools.combinations(N, k))))([p for p in itertools.combinations(V, 2) if p not in E and p[::-1] not in E]))('a, b, c, d, e, f, g'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-c, a-d, b-e, b-f, c-f, c-g, d-e, d-g'.split(', ')], (lambda V, E: (lambda go: {(s, t) for s in V for t in go(go, s, frozenset())})(lambda go, v, used: {v} if len(used) == len(E) else {t for i in range(len(E)) if i not in used and v in E[i] for t in go(go, E[i][1] if E[i][0] == v else E[i][0], used | {i})})))" }
    pistas:
      - >-
        ¿Qué vértices tienen grado impar? ¿Qué le hace una arista nueva a la paridad de sus dos extremos?
      - >-
        Con el menor número imaginable de aristas, ¿qué vértices tendrían que unir? ¿Ya están unidos?
      - >-
        Si dos impares no se pueden unir directamente, ¿por qué vértice se les puede dar una arista nueva a cada uno sin dejar otro impar?
    explicacion: >-
      Las aristas son $ab$, $ac$, $ad$, $be$, $bf$, $cf$, $cg$, $de$ y $dg$; el grafo es conexo, y agregar aristas no lo desconecta. **Grados:** $a$, $b$, $c$ y $d$ tienen 3; $e$, $f$ y $g$, 2. Hace falta que todos queden pares, y cada arista nueva cambia la paridad de sus dos extremos. **Con 1** cambian dos vértices y hay cuatro impares: no alcanza. **Con 2**, los cuatro extremos tendrían que ser exactamente $a$, $b$, $c$ y $d$, uno cada uno, así que una de las aristas uniría a $a$ con $b$, $c$ o $d$; pero $a$ ya es vecino de los tres, y no se vale repetir. **Con 3** sí: $bc$, $af$ y $df$ dejan a $a$, $b$, $c$, $d$ y $f$ con grado 4, y a $e$ y $g$ con 2. Revisa: el grafo nuevo tiene 12 aristas y sus grados suman $5\cdot4+2\cdot2=24=2\cdot12$.
    tiempo_estimado_s: 150

  # razonamiento: algorítmico (aristas obligadas por los vértices de grado 2, una prohibida, y los casos que quedan) · R2
