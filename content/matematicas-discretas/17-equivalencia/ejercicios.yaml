  - id: disc-17-012
    tipo: completar
    dificultad: 3
    conceptos: [particiones, relacion-equivalencia]
    enunciado: >-
      Sobre $A=\{1,2,3,4,5\}$, sea $R=I_A\cup\{(2,4),(4,2),(4,5),(5,4),(1,3),(3,1)\}$, donde $I_A=\{(a,a):a\in A\}$. Beto calcula $[a]=\{x\in A: xRa\}$ para tres elementos y obtiene $[2]=\{2,4\}$, $[4]=\{2,4,5\}$ y $[5]=\{4,5\}$; las tres cuentas están bien. Con eso da por hecho que $R$ es de equivalencia.
    texto: >-
      Elemento que comparten $[2]$ y $[5]$ (si no comparten ninguno, 0): ___ · ¿$R$ es de equivalencia? (1 sí, 0 no): ___ · par $(a,c)$, con $a<c$, que hay que agregarle, junto con su inverso, para que sea transitiva (si ya lo es, escribe 0 y 0): (___, ___)
    respuestas: ["4", "0", "2", "5"]
    verificar: { python: "(lambda A, R, EQ: (lambda C, T: (lambda K, P: [sorted(K)[0] if K else 0, int(EQ(A, lambda x, y: (x, y) in R))] + list(sorted(P)[0] if P else (0, 0)) if len(K) <= 1 and len(P) <= 1 else [])(C(2) & C(5), {(a, c) for (a, c) in T - R if a < c}))(lambda x: {y for y in A if (y, x) in R}, (lambda f: f(f, R))(lambda f, S: S if all((a, d) in S for (a, b) in S for (c, d) in S if b == c) else f(f, S | {(a, d) for (a, b) in S for (c, d) in S if b == c}))))([1, 2, 3, 4, 5], {(a, a) for a in range(1, 6)} | {(2,4),(4,2),(4,5),(5,4),(1,3),(3,1)}, (lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c))))" }
    pistas:
