# Unidad 17 · Equivalencia (Unidad IV, 4.3.3 y 4.3.4). Para el 3.er parcial (semana del 23 al 27 de noviembre de
# 2026). La congruencia y el símbolo ≡ son de la 18 (4.4.1): aquí se dice «mismo residuo al dividir entre n».
# Esquema v1 aprobado por Carlo el 2026-11-14 (esquema-17), revisado por experto-matematicas, pedagogo y
# arquitecto-razonamiento. Datos de experto-matematicas, comprobados por la sesión principal con código propio.
# Ids en el orden de la tabla del v1, escalera 4/5/5/3/3: d1 001–004, d2 005–009, d3 010–014, d4 015–017, d5 018–020.
# Anclas (primer ejercicio de cada concepto, workedExampleFor): 001 RE, 002 CE, 003 CC y 004 PA, con explicación
# completa y con lo que se pide escrito en el enunciado (WorkedExample muestra solo enunciado y explicación). Los
# ejercicios con dos conceptos (012, 015 a 020) muestran el ancla d1 de cualquiera de los dos, y las cuatro son de d1.
# Abreviaturas: RE relacion-equivalencia · CE clases-equivalencia · CC conjunto-cociente · PA particiones.
# Ninguna respuesta es un conjunto de conjuntos (sets.ts:61, «las llaves solo van afuera»): una clase va como
# `conjunto` plano; un cociente, como número de clases, tamaños o pares; una partición, como opción.
# `verificar`: los de experto-matematicas (herramientas/m17/verificar-17.py), en Python puro, desde la definición y
# por enumeración, sin cambios; la plantilla EQ(A, r), «r es reflexiva, simétrica y transitiva en A», va incrustada en
# cada expresión que la usa. Probados con check_exercise (19/19) y con respuestas alteradas (neg.py); sobre este
# archivo, el autor volvió a probar los 19 con una respuesta alterada por ejercicio, y los 19 la rechazan.
# Revisión del 2026-11-14 (arreglos-17, «errores + mejoras» de Carlo) aplicada: el 012 cambió de enunciado, huecos y
# `verificar`, que se volvió a probar con respuestas alteradas.
# `conjunto`: pares escritos "(1, 2)"; el ejemplo de formato de cada enunciado no contiene elementos de la respuesta.
# `completar`: huecos fuera de KaTeX y solo enteros; cada hueco dice si pide un número o un elemento.
# Pistas como preguntas, sin valores intermedios: 1 en d1–2, 2 en d3 (el 012 lleva 3)
# y 3 en d4–5. Desde d3, la explicación cierra con «Revisa:», con una comprobación que no repite el cálculo. Las
# explicaciones de selección y opción múltiple dicen cuáles son las correctas, porque WorkedExample no muestra las
# opciones.
# Términos con un solo sentido: «clase» (de equivalencia), «bloque» (de una partición), «etiqueta» (la f de
# «f(x) = f(y)»), «testigo» (un caso concreto que refuta una propiedad, como en la 16) e «intermedio» (el b de aRb y
# bRc, como en la 15). En el 015, los enteros del «existe» no se llaman testigos. No se usa «cadena».
# Manuales: solo el 015 (autoevaluación, tarjeta: false).
# Textos con LaTeX en bloques `>-`: así no hay que escapar comillas ni barras.
unidad: matematicas-discretas/17-equivalencia
ejercicios:
  # razonamiento: deductivo (buscar la etiqueta f o el testigo contra una de las tres propiedades) · R1
  # Ancla de RE. Opciones en el orden de experto-matematicas.
  # verificar: EQ en ventanas finitas (ℤ de −8 a 8, ℤ⁺ de 1 a 40; cifras de 1 a 119, para tener 1, 2 y 3 cifras).
  - id: disc-17-001
    tipo: seleccion_multiple
    dificultad: 1
    conceptos: [relacion-equivalencia]
    enunciado: >-
      Una relación de equivalencia es una relación reflexiva, simétrica y transitiva. ¿Cuáles de estas relaciones son de equivalencia? Puede haber varias.
    opciones:
      - >-
        $xRy$ si $x+y$ es par, en $\mathbb Z$
      - >-
        $xRy$ si $x\le y$, en $\mathbb Z$
      - >-
        $xRy$ si $x$ y $y$ tienen el mismo número de cifras (en base 10), en $\mathbb Z^+$
      - >-
        $xRy$ si $x-y$ es impar, en $\mathbb Z$
      - >-
        $xRy$ si $x$ y $y$ tienen los mismos divisores primos, en $\mathbb Z^+$
      - >-
        $xRy$ si $x\mid y$, en $\mathbb Z^+$
    correctas: [0, 2, 4]
    verificar: { python: "(lambda eq, Z, P, pr: [eq(Z, lambda x, y: (x + y) % 2 == 0), eq(Z, lambda x, y: x <= y), eq(range(1, 120), lambda x, y: len(str(x)) == len(str(y))), eq(Z, lambda x, y: (x - y) % 2 == 1), eq(P, lambda x, y: pr(x) == pr(y)), eq(P, lambda x, y: y % x == 0)])((lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c))), range(-8, 9), range(1, 41), lambda n: frozenset(p for p in range(2, n + 1) if n % p == 0 and all(p % q for q in range(2, p))))" }
    pistas:
      - >-
        En cada una, ¿hay una etiqueta $f$ con $xRy$ si y solo si $f(x)=f(y)$? Si no la hay, ¿cuál de las tres propiedades falla?
    explicacion: >-
      Son de equivalencia «$x+y$ es par», «mismo número de cifras» y «mismos divisores primos»; las otras tres no. Las tres buenas son de la forma «misma etiqueta», $f(x)=f(y)$, y toda regla así es reflexiva, simétrica y transitiva. **$x+y$ par:** pasa si y solo si $x$ y $y$ tienen la misma paridad, así que la etiqueta es la paridad. **Cifras:** la etiqueta es el número de cifras. **Divisores primos:** la etiqueta es el conjunto de primos que dividen a $x$; la del 1 es $\varnothing$. **Las que no**, con un testigo: $x\le y$ no es simétrica, porque $1\le2$ y no $2\le1$; «$x-y$ impar» no es reflexiva, porque $1-1=0$ es par; y $x\mid y$ no es simétrica, porque $1\mid2$ y $2\nmid1$.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (calcular la etiqueta de a y juntar a los que la comparten) · R0
  # Ancla de CE.
  # verificar: EQ de «misma suma de cifras» en {10, …, 40} y los y con la suma de 13.
  - id: disc-17-002
    tipo: conjunto
    dificultad: 1
    conceptos: [clases-equivalencia]
    enunciado: >-
      En $A=\{10,11,\dots,40\}$, sea $xRy$ si $x$ y $y$ tienen la misma suma de cifras. Es de equivalencia. Escribe la clase del 13, $[13]=\{x\in A: xR13\}$, como `5, 9`.
    respuesta: ["13", "22", "31", "40"]
    verificar: { python: "(lambda A, s: {y for y in A if s(y) == s(13)} if (lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c)))(A, lambda x, y: s(x) == s(y)) else set())(range(10, 41), lambda n: sum(int(c) for c in str(n)))" }
    pistas:
      - >-
        ¿Cuánto suman las cifras del 13? ¿Qué números de $A$ suman lo mismo?
    explicacion: >-
      Es de la forma $f(x)=f(y)$, con $f(x)$ la suma de las cifras de $x$, así que $[13]$ reúne a los $x\in A$ con $f(x)=f(13)=1+3=4$. Entre 10 y 40 suman 4 el 13, el 22, el 31 y el 40; el 4 también sumaría 4, pero no está en $A$. Así, $[13]=\{13,22,31,40\}$. Por el lema de la lección, $[22]$, $[31]$ y $[40]$ son esa misma clase.
    tiempo_estimado_s: 45

  # razonamiento: algorítmico (una clase por valor distinto de la etiqueta) · R1
  # Ancla de CC.
  # verificar: EQ de «mismo número de divisores» en {1, …, 12} y el número de clases distintas.
  - id: disc-17-003
    tipo: numerico
    dificultad: 1
    conceptos: [conjunto-cociente]
    enunciado: >-
      En $A=\{1,2,\dots,12\}$, sea $xRy$ si $x$ y $y$ tienen el mismo número de divisores positivos. Es de equivalencia. ¿Cuántas clases tiene? Es decir, ¿cuántos elementos tiene el conjunto cociente $A/R$?
    respuesta: 5
    tolerancia: 0
    verificar: { python: "(lambda A, d: len({frozenset(y for y in A if d(y) == d(x)) for x in A}) if (lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c)))(A, lambda x, y: d(x) == d(y)) else -1)(range(1, 13), lambda n: sum(1 for k in range(1, n + 1) if n % k == 0))" }
    pistas:
      - >-
        ¿Cuántos divisores positivos tiene cada número del 1 al 12? ¿Cuántos valores distintos salen?
    explicacion: >-
      Es de la forma $f(x)=f(y)$, con $f(x)$ el número de divisores positivos de $x$: hay una clase por cada valor distinto de $f$. **Divisores:** el 1 tiene 1; los primos 2, 3, 5, 7 y 11 tienen 2; el 4 y el 9 tienen 3 (1, 2 y 4; 1, 3 y 9); el 6, el 8 y el 10 tienen 4; y el 12 tiene 6. **Clases:** $\{1\}$, $\{2,3,5,7,11\}$, $\{4,9\}$, $\{6,8,10\}$ y $\{12\}$. Son 5, así que $A/R$ tiene 5 elementos, y sus tamaños suman $1+5+2+3+1=12$.
    tiempo_estimado_s: 45

  # razonamiento: deductivo (revisar las tres condiciones de partición en cada colección) · R1
  # Ancla de PA. Opciones de experto-matematicas, una por condición que falla.
  # verificar: las tres condiciones (no vacíos, disjuntos dos a dos, unión A) y el índice de la única que las cumple.
  - id: disc-17-004
    tipo: opcion_multiple
    dificultad: 1
    conceptos: [particiones]
    enunciado: >-
      Una partición de $A$ es una colección de bloques no vacíos, disjuntos dos a dos, cuya unión es $A$. ¿Cuál de estas colecciones es una partición de $A=\{1,2,\dots,8\}$?
    opciones:
      - >-
        $\{1,2,3\},\{3,4,5\},\{6,7,8\}$
      - >-
        $\{1,8\},\{2,7\},\{3,6\},\{4,5\}$
      - >-
        $\{1,3,5,7\},\{2,4,6\}$
      - >-
        $\{1,2,3,4\},\{5,6,7,8\},\varnothing$
    valores: ["0", "1", "2", "3"]
    correcta: 1
    verificar: { python: "(lambda A, ops: (lambda L: L[0] if len(L) == 1 else -1)([i for i, P in enumerate(ops) if all(len(B) > 0 for B in P) and all(not (P[i2] & P[j2]) for i2 in range(len(P)) for j2 in range(len(P)) if i2 < j2) and set().union(*P) == A]))(set(range(1, 9)), [[{1,2,3}, {3,4,5}, {6,7,8}], [{1,8}, {2,7}, {3,6}, {4,5}], [{1,3,5,7}, {2,4,6}], [{1,2,3,4}, {5,6,7,8}, set()]])" }
    pistas:
      - >-
        En cada colección, ¿hay un bloque vacío, un elemento en dos bloques o un elemento de $A$ que falte?
    explicacion: >-
      La partición es $\{1,8\},\{2,7\},\{3,6\},\{4,5\}$: cuatro bloques no vacíos, sin elementos en común, que juntos tienen los 8 elementos de $A$. Cada una de las otras falla en una condición. $\{1,2,3\},\{3,4,5\},\{6,7,8\}$ pone el 3 en dos bloques, así que no son disjuntos. $\{1,3,5,7\},\{2,4,6\}$ no tiene el 8, así que su unión no es $A$. Y $\{1,2,3,4\},\{5,6,7,8\},\varnothing$ tiene un bloque vacío, aunque los otros dos sí repartan $A$.
    tiempo_estimado_s: 45

  # razonamiento: deductivo (agregar lo que pide cada propiedad, y nada más) · R1
  # No va en el jefe (su par natural, 16-009, va con el 012).
  # verificar: la intersección de TODAS las equivalencias sobre {1, 2, 3, 4} que contienen a R (por etiquetados), menos R.
  - id: disc-17-005
    tipo: conjunto
    dificultad: 2
    conceptos: [relacion-equivalencia]
    enunciado: >-
      Sobre $\{1,2,3,4\}$, sea $R=\{(1,1),(2,2),(3,3),(4,4),(1,3),(3,4)\}$. Escribe los pares que hay que agregarle para obtener la relación de equivalencia más chica que contiene a $R$, como `(2, 1), (2, 3)`.
    respuesta: ["(3, 1)", "(4, 3)", "(1, 4)", "(4, 1)"]
    verificar: { python: "(lambda A, R: set.intersection(*[K for K in ({(a, b) for a in A for b in A if f[a - 1] == f[b - 1]} for f in itertools.product(range(4), repeat=4)) if R <= K]) - R)([1, 2, 3, 4], {(1,1),(2,2),(3,3),(4,4),(1,3),(3,4)})" }
    pistas:
      - >-
        ¿Qué pares obliga la simétrica? Con ellos, ¿qué pares obliga la transitiva?
    explicacion: >-
      Faltan $(3,1)$, $(4,3)$, $(1,4)$ y $(4,1)$. **Simétrica:** $(1,3)$ y $(3,4)$ piden sus inversos, $(3,1)$ y $(4,3)$. **Transitiva:** $(1,3)$ y $(3,4)$ piden $(1,4)$, y $(4,3)$ y $(3,1)$ piden $(4,1)$. Con eso, el 1, el 3 y el 4 se relacionan todos entre sí y el 2 se relaciona nada más consigo mismo: es la equivalencia de la partición $\{1,3,4\},\{2\}$. **Es la más chica:** toda equivalencia que contenga a $R$ junta al 1 con el 3 y al 3 con el 4, así que tiene los 9 pares de $\{1,3,4\}^2$; $R$ ya tenía 5 y faltan estos 4.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (calcular la etiqueta mcd(x, 12) y juntar a los que la comparten) · R1
  # verificar: EQ de mcd(x, 12) = mcd(y, 12) en {1, …, 30} y los y con el mcd del 8.
  - id: disc-17-006
    tipo: conjunto
    dificultad: 2
    conceptos: [clases-equivalencia]
    enunciado: >-
      En $A=\{1,2,\dots,30\}$, sea $xRy$ si $\mathrm{mcd}(x,12)=\mathrm{mcd}(y,12)$. Escribe la clase $[8]$, como `5, 7`.
    respuesta: ["4", "8", "16", "20", "28"]
    verificar: { python: "(lambda A, g: {y for y in A if g(y) == g(8)} if (lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c)))(A, lambda x, y: g(x) == g(y)) else set())(range(1, 31), lambda n: math.gcd(n, 12))" }
    pistas:
      - >-
        ¿Cuánto vale $\mathrm{mcd}(8,12)$? ¿Qué números $x$ de $A$ dan ese mismo mcd con 12?
    explicacion: >-
      Es de equivalencia porque es de la forma $f(x)=f(y)$, con $f(x)=\mathrm{mcd}(x,12)$. Como $\mathrm{mcd}(8,12)=4$, $[8]$ tiene los $x\in A$ con $\mathrm{mcd}(x,12)=4$: los múltiplos de 4 que no son múltiplos de 3, porque si además $3\mid x$, el mcd sería 12. Del 1 al 30, los múltiplos de 4 son 4, 8, 12, 16, 20, 24 y 28; sin el 12 y el 24 queda $[8]=\{4,8,16,20,28\}$.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (de la partición a los pares: k² por bloque) · R1
  # verificar: arma R desde los bloques y cuenta.
  - id: disc-17-007
    tipo: completar
    dificultad: 2
    conceptos: [particiones]
    enunciado: >-
      Sobre $A=\{1,2,\dots,7\}$, la partición $\{1,6\},\{2,4,7\},\{3,5\}$ define la relación de equivalencia «$xRy$ si $x$ y $y$ están en el mismo bloque». En el hueco de sí o no, escribe 1 (sí) o 0 (no).
    texto: >-
      Número de pares de $R$: ___ · número de pares $(a,b)$ de $R$ con $a\neq b$: ___ · ¿$(6,1)\in R$? ___
    respuestas: ["17", "10", "1"]
    verificar: { python: "(lambda P: (lambda R: [len(R), sum(1 for (a, b) in R if a != b), int((6, 1) in R)])({(a, b) for B in P for a in B for b in B}))([{1, 6}, {2, 4, 7}, {3, 5}])" }
    pistas:
      - >-
        ¿Qué pares aporta un bloque de 2 elementos? ¿Y uno de 3? ¿Cuántos de ellos son de la forma $(a,a)$?
    explicacion: >-
      Un bloque de $k$ elementos aporta $k^2$ pares: todas las parejas ordenadas $(x,y)$ con $x$ y $y$ en él, incluidas las $(a,a)$. Así, $R$ tiene $2^2+3^2+2^2=4+9+4=17$ pares. De ellos, 7 son de la forma $(a,a)$, uno por elemento de $A$, así que $17-7=10$ tienen $a\neq b$. El 6 y el 1 comparten el bloque $\{1,6\}$, así que $(6,1)\in R$: 1.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (contar las longitudes en binario entre potencias de 2) · R1
  # verificar: escribe cada número en binario (sin bin(), con una recursión) y cuenta las clases distintas.
  - id: disc-17-008
    tipo: numerico
    dificultad: 2
    conceptos: [conjunto-cociente]
    enunciado: >-
      En $A=\{1,2,\dots,40\}$, sea $xRy$ si $x$ y $y$ tienen el mismo número de cifras al escribirse en binario. ¿Cuántos elementos tiene el conjunto cociente $A/R$?
    respuesta: 6
    tolerancia: 0
    verificar: { python: "(lambda A, b: len({frozenset(y for y in A if len(b(y)) == len(b(x))) for x in A}))(range(1, 41), lambda n: (lambda f: f(f, n))(lambda f, m: '' if m == 0 else f(f, m // 2) + str(m % 2)))" }
    pistas:
      - >-
        ¿Entre qué potencias de 2 está un número que tiene $k$ cifras en binario?
    explicacion: >-
      Es de la forma $f(x)=f(y)$, con $f(x)$ el número de cifras de $x$ en binario, así que hay una clase por valor de $f$. Un número tiene $k$ cifras en binario cuando $2^{k-1}\le n<2^k$. Del 1 al 40: el 1 tiene 1 cifra; el 2 y el 3, 2; del 4 al 7, 3; del 8 al 15, 4; del 16 al 31, 5; y del 32 al 40, 6, porque $40<64$. Son 6 valores, así que $A/R$ tiene 6 elementos.
    tiempo_estimado_s: 45

  # razonamiento: deductivo (revisar las tres condiciones de partición con reglas en palabras) · R1
  # Opciones de experto-matematicas: el 1 (ni primo ni compuesto), el 10 y el 20 en dos bloques, y el 4 y el 16.
  # verificar: arma cada colección y revisa las tres condiciones.
  - id: disc-17-009
    tipo: seleccion_multiple
    dificultad: 2
    conceptos: [particiones]
    enunciado: >-
      ¿Cuáles de estas colecciones son particiones de $A=\{1,2,\dots,20\}$? Puede haber varias.
    opciones:
      - >-
        Los primos y los compuestos
      - >-
        $\{1\}$, los primos y los compuestos
      - >-
        Los múltiplos de 2, los múltiplos de 5 y los que no son múltiplos de ninguno de los dos
      - >-
        Los de una cifra y los de dos cifras
      - >-
        Los cuadrados perfectos, los impares que no son cuadrados perfectos y los pares
      - >-
        Los que dejan residuo 0, los que dejan residuo 1 y los que dejan residuo 2 al dividir entre 3
    correctas: [1, 3, 5]
    verificar: { python: "(lambda A, pr: (lambda part: [part([{n for n in A if pr(n)}, {n for n in A if n > 1 and not pr(n)}]), part([{1}, {n for n in A if pr(n)}, {n for n in A if n > 1 and not pr(n)}]), part([{n for n in A if n % 2 == 0}, {n for n in A if n % 5 == 0}, {n for n in A if n % 2 and n % 5}]), part([{n for n in A if n < 10}, {n for n in A if n >= 10}]), part([{n for n in A if any(k * k == n for k in A)}, {n for n in A if n % 2 and not any(k * k == n for k in A)}, {n for n in A if n % 2 == 0}]), part([{n for n in A if n % 3 == r} for r in range(3)])])(lambda P: all(P[i] for i in range(len(P))) and all(not (P[i] & P[j]) for i in range(len(P)) for j in range(i + 1, len(P))) and set().union(*P) == A))(set(range(1, 21)), lambda n: n > 1 and all(n % q for q in range(2, n)))" }
    pistas:
      - >-
        En cada colección, ¿algún número de $A$ queda fuera o cae en dos bloques?
    explicacion: >-
      Son particiones «$\{1\}$, los primos y los compuestos», «los de una cifra y los de dos cifras» y «los de residuo 0, 1 y 2 al dividir entre 3»; las otras tres no. **Primos y compuestos, sin el $\{1\}$:** el 1 no es primo ni compuesto, así que la unión no es $A$. **Múltiplos de 2 y de 5:** el 10 y el 20 caen en los dos bloques. **Cuadrados, impares y pares:** el 4 y el 16 son cuadrados perfectos y pares. Las tres buenas sí cumplen todo: cada número del 1 al 20 cae en exactamente un bloque y ningún bloque es vacío.
    tiempo_estimado_s: 60

  # razonamiento: abductivo (de una demostración con un error plantado a la causa: xy ≥ 0 no es «mismo signo») · R2
  # Hace par con disc-16-022 (Luis) en el jefe: un error plantado en una demostración de propiedades. La explicación no
  # habla de relaciones simétricas y transitivas que no sean reflexivas.
  # verificar: reflexiva y simétrica en ℤ (de −8 a 8), el testigo 1, 0, −1, el no testigo 1, 2, 3 y EQ en ℤ − {0}.
  - id: disc-17-010
    tipo: seleccion_multiple
    dificultad: 3
    conceptos: [relacion-equivalencia]
    enunciado: >-
      Sobre $\mathbb Z$, sea $xRy$ si $xy\ge0$. Ana dice que es de equivalencia: «Es reflexiva, porque $x\cdot x=x^2\ge0$; simétrica, porque $xy=yx$; y transitiva, porque si $xy\ge0$ y $yz\ge0$, entonces $x$ y $y$ tienen el mismo signo, y $y$ y $z$ también, así que $x$ y $z$ tienen el mismo signo y $xz\ge0$». ¿Cuáles de estas afirmaciones son ciertas? Puede haber varias.
    opciones:
      - >-
        Sus argumentos de la reflexividad y de la simetría están bien.
      - >-
        La transitividad falla con $x=1$, $y=0$ y $z=-1$.
      - >-
        La transitividad falla con $x=1$, $y=2$ y $z=3$.
      - >-
        Sobre $\mathbb Z-\{0\}$, la misma regla sí es de equivalencia.
      - >-
        $R$ no es reflexiva.
    correctas: [0, 1, 3]
    verificar: { python: "(lambda eq, Z, r: [all(r(a, a) for a in Z) and all(r(b, a) for a in Z for b in Z if r(a, b)), r(1, 0) and r(0, -1) and not r(1, -1), r(1, 2) and r(2, 3) and not r(1, 3), eq([z for z in Z if z != 0], r), not all(r(a, a) for a in Z)])((lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c))), range(-8, 9), lambda x, y: x * y >= 0)" }
    pistas:
      - >-
        ¿Qué paso de Ana usa algo que $xy\ge0$ no dice? ¿Qué número cumple $xy\ge0$ con todos?
      - >-
        Si quitas ese número, ¿a qué etiqueta equivale $xy\ge0$?
    explicacion: >-
      Son ciertas «sus argumentos de la reflexividad y de la simetría están bien», «la transitividad falla con 1, 0 y −1» y «sobre $\mathbb Z-\{0\}$ sí es de equivalencia»; las otras dos no. **Lo que está bien:** $x^2\ge0$ para todo entero, así que es reflexiva, y $xy=yx$ la hace simétrica. **El error:** $xy\ge0$ no dice «mismo signo», porque el 0 cumple $0\cdot y\ge0$ con todos. Con $x=1$, $y=0$ y $z=-1$: $1\cdot0\ge0$ y $0\cdot(-1)\ge0$, pero $1\cdot(-1)=-1<0$. Es un testigo contra la transitividad, con el 0 de intermedio. Con 1, 2 y 3 no hay testigo, porque $1\cdot3\ge0$. **Sin el 0**, $xy\ge0$ sí equivale a «mismo signo», que es de la forma $f(x)=f(y)$ con $f$ el signo, y sus clases son los positivos y los negativos. Revisa: en $\mathbb Z$, el 0 se relaciona con el 1 y con el −1, que no se relacionan entre sí, como «luz» con «sol» y «paz».
    tiempo_estimado_s: 90

  # razonamiento: algorítmico (la etiqueta max(a, b) y los pares que la comparten) · R1
