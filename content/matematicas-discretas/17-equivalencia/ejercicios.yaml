  # razonamiento: deductivo (|R| es la suma de los cuadrados de los tamaños; repartir 6 en 3 partes) · R2
  # verificar: enumera las 6⁶ funciones de etiqueta con exactamente 3 valores y cuenta los pares de cada relación.
  - id: disc-17-013
    tipo: completar
    dificultad: 3
    conceptos: [conjunto-cociente]
    enunciado: >-
      Sobre un conjunto $A$ de 6 elementos, $R$ es una relación de equivalencia con exactamente 3 clases. ¿Cuántos pares puede tener $R$?
    texto: >-
      Menor número posible de pares de $R$: ___ · mayor número posible de pares de $R$: ___
    respuestas: ["12", "18"]
    verificar: { python: "(lambda S: [min(S), max(S)])({sum(1 for i in range(6) for j in range(6) if f[i] == f[j]) for f in itertools.product(range(6), repeat=6) if len(set(f)) == 3})" }
    pistas:
      - >-
        ¿Cuántos pares de $R$ salen de una clase de $k$ elementos?
      - >-
        ¿De qué maneras se reparten 6 elementos en 3 clases no vacías? ¿Cuál da más pares y cuál menos?
    explicacion: >-
      Una clase de $k$ elementos aporta $k^2$ pares, todos los $(x,y)$ con $x$ y $y$ en ella, y ningún par de $R$ junta dos clases distintas. Así, $\lvert R\rvert$ es la suma de los cuadrados de los tamaños de las clases. Con 6 elementos en 3 clases no vacías, los tamaños pueden ser 4, 1 y 1; 3, 2 y 1; o 2, 2 y 2, que dan $16+1+1=18$, $9+4+1=14$ y $4+4+4=12$. El menor es 12, con las clases parejas, y el mayor es 18, con una clase grande. Revisa: con tamaños 2, 2 y 2, $R$ tiene los 6 pares $(a,a)$ y, por cada clase, un par con coordenadas distintas y su inverso: $6+6=12$.
    tiempo_estimado_s: 90

  # razonamiento: deductivo (encontrar la etiqueta, la parte impar, y probar cada afirmación con ella) · R2
  # Hace par con disc-16-017 en el jefe (la opción «y = 2ᵏx, k ≥ 0», que es un orden parcial): antisimétrica contra
  # simétrica. La explicación no menciona k ≥ 0, ni el signo de k, ni la antisimetría, ni órdenes.
  # verificar: EQ en {1, …, 64}, con k de −8 a 8 (con Fraction), y cada afirmación.
  - id: disc-17-014
    tipo: seleccion_multiple
    dificultad: 3
    conceptos: [clases-equivalencia]
    enunciado: >-
      Sobre $\mathbb Z^+$, sea $x\sim y$ si $x/y=2^k$ para algún $k\in\mathbb Z$. Es de equivalencia. ¿Cuáles de estas afirmaciones son ciertas? Puede haber varias.
    opciones:
      - >-
        $24\sim96$
      - >-
        $12\sim18$
      - >-
        $[40]$ tiene exactamente 5 elementos menores que 100.
      - >-
        Cada clase tiene exactamente un número impar.
      - >-
        $3\sim6$ y $6\sim12$, pero $3\nsim12$.
    correctas: [0, 2, 3]
    verificar: { python: "(lambda r, W: [r(24, 96), r(12, 18), sum(1 for y in range(1, 100) if r(y, 40)) == 5, all(sum(1 for y in W if y % 2 and r(y, x)) == 1 for x in W), r(3, 6) and r(6, 12) and not r(3, 12)] if (lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c)))(W, r) else [])(lambda x, y: any(Fraction(x, y) == Fraction(2) ** k for k in range(-8, 9)), range(1, 65))" }
    pistas:
      - >-
        Si escribes cada número como una potencia de 2 por un impar, ¿qué tienen que compartir $x$ y $y$ para que $x/y$ sea una potencia de 2?
      - >-
        Con esa etiqueta, ¿cómo se ve la clase de un impar $m$?
    explicacion: >-
      Son ciertas «$24\sim96$», «$[40]$ tiene exactamente 5 elementos menores que 100» y «cada clase tiene exactamente un impar»; las otras dos no. **La etiqueta:** todo entero positivo se escribe como $2^jm$, con $m$ impar, su parte impar. Al dividir dos de ellos, las potencias de 2 dan otra potencia de 2, y el cociente de las partes impares, $m/m'$, es una potencia de 2 si y solo si $m=m'$, porque los dos son impares. Así, $x\sim y$ si y solo si tienen la misma parte impar: es de la forma $f(x)=f(y)$. **Las afirmaciones:** $96/24=4=2^2$, así que $96\sim24$, y por la simétrica, $24\sim96$. $12=2^2\cdot3$ y $18=2\cdot9$ tienen partes impares distintas, 3 y 9. $40=2^3\cdot5$, así que $[40]=\{5,10,20,40,80,160,\dots\}$, con 5 elementos menores que 100. Cada clase es $\{m,2m,4m,\dots\}$, y su único impar es $m$. Y con $3\sim6$ y $6\sim12$, la transitividad obliga a $3\sim12$; de hecho, $12/3=4=2^2$, así que $12\sim3$, y por la simétrica, $3\sim12$. Revisa: en $[40]$, el que sigue del 80 es el 160, que ya pasa de 100.
    tiempo_estimado_s: 90

  # razonamiento: deductivo (demostrar con la definición de 3 ∣ n, una letra por «existe», y las dos direcciones) · R3
  # Datos y respuesta modelo de experto-matematicas; rúbrica con la estructura de arquitecto-razonamiento. Revisión
  # manual. La respuesta modelo cumple cada criterio: escribe la definición y prueba con enteros cualesquiera (1),
  # nombra cada propiedad con letras distintas, k y m (2), parte del c común y nombra la simétrica y la transitiva (3),
  # y prueba los dos sentidos de la descripción de las clases con 3 ∣ (a − b)(a + b) y que 3 es primo (4). Desde la
  # revisión, el criterio 4 acepta también la vía de los residuos de los cuadrados (arreglos-17, M).
  - id: disc-17-015
    tipo: autoevaluacion
    dificultad: 4
    conceptos: [relacion-equivalencia, clases-equivalencia]
    enunciado: >-
      En papel. Sobre $\mathbb Z$, sea $a\sim b$ si $3\mid a^2+2b^2$. Escribe la definición de $3\mid n$ antes de usarla. **(1)** Demuestra que $\sim$ es de equivalencia. **(2)** Demuestra que, en cualquier relación de equivalencia, dos clases son iguales o disjuntas. **(3)** Describe las clases de $\sim$ y demuestra tu descripción.
    rubrica:
      - >-
        Escribe «$3\mid n$ si existe $k\in\mathbb Z$ con $n=3k$» y prueba cada propiedad con enteros cualesquiera, no con ejemplos. Reflexiva: $a^2+2a^2=3a^2$, con $a^2\in\mathbb Z$.
      - >-
        Nombra cada propiedad y usa una letra distinta para cada «existe». Simétrica: de $a^2+2b^2=3k$ llega a $b^2+2a^2=3(a^2+b^2-k)$. Transitiva: de $a^2+2b^2=3k$ y $b^2+2c^2=3m$ llega a $a^2+2c^2=3(k+m-b^2)$.
      - >-
        Para «iguales o disjuntas», parte de un $c$ que esté en $[a]$ y en $[b]$, y dice dónde usa la simétrica y dónde la transitiva para llegar a $[a]=[b]$.
      - >-
        Describe dos clases, los múltiplos de 3 y los que no lo son, y prueba los dos sentidos: de $a\sim b$ a «los dos son múltiplos de 3 o ninguno lo es», y de vuelta. Justifica el paso clave: que 3 es primo (de $3\mid(a-b)(a+b)$ sale $3\mid a-b$ o $3\mid a+b$) o que $a^2$ deja residuo 0 entre 3 si $3\mid a$, y 1 si no.
    respuesta_modelo: >-
      Uso la definición: $3\mid n$ si existe $k\in\mathbb Z$ con $n=3k$. Sean $a,b,c\in\mathbb Z$ cualesquiera. **(1) Reflexiva:** $a^2+2a^2=3a^2$, con $a^2\in\mathbb Z$, así que $a\sim a$. **Simétrica:** si $a\sim b$, hay $k\in\mathbb Z$ con $a^2+2b^2=3k$; entonces $b^2+2a^2=3(a^2+b^2)-(a^2+2b^2)=3(a^2+b^2-k)$, con $a^2+b^2-k\in\mathbb Z$, así que $b\sim a$. **Transitiva:** si $a\sim b$ y $b\sim c$, hay $k,m\in\mathbb Z$ con $a^2+2b^2=3k$ y $b^2+2c^2=3m$; entonces $a^2+2c^2=(a^2+2b^2)+(b^2+2c^2)-3b^2=3(k+m-b^2)$, así que $a\sim c$. **(2)** Sea $R$ de equivalencia y supón que $[a]$ y $[b]$ comparten un $c$: $cRa$ y $cRb$. Por la simétrica, $aRc$; con $cRb$, la transitiva da $aRb$. Entonces $[a]=[b]$: si $xRa$, la transitiva con $aRb$ da $xRb$; si $xRb$, la simétrica da $bRa$ a partir de $aRb$, y la transitiva, $xRa$. Así, dos clases que comparten un elemento son iguales, y si no comparten ninguno son disjuntas. **(3)** Como $a^2+2b^2=(a^2-b^2)+3b^2$, se cumple $3\mid a^2+2b^2$ si y solo si $3\mid a^2-b^2=(a-b)(a+b)$; y como 3 es primo, si y solo si $3\mid a-b$ o $3\mid a+b$. *Ida:* si $3\mid a-b$ o $3\mid a+b$, entonces $b=\pm a+3t$ para algún $t\in\mathbb Z$, así que $3\mid b$ si y solo si $3\mid a$: los dos son múltiplos de 3 o ninguno lo es. *Vuelta:* si los dos son múltiplos de 3, $3\mid a-b$. Si ninguno lo es, sus residuos al dividir entre 3 son 1 o 2; si son iguales, $3\mid a-b$, y si son distintos, suman 3 y $3\mid a+b$. Hay dos clases: los múltiplos de 3, que es $[0]$, y los que no lo son, que es $[1]$. Revisa: $1\sim2$, porque $1+8=9$, y $1\nsim3$, porque $1+18=19$.
    verificar: { revision: "manual" }
    pistas:
      - >-
        ¿Qué dice $3\mid n$ con un «existe»? ¿Lo escribiste antes que nada?
      - >-
        Para la simétrica, ¿cómo escribes $b^2+2a^2$ usando $a^2+2b^2$ y múltiplos de 3? ¿Usaste una letra distinta para cada «existe» en la transitiva?
      - >-
        ¿Qué tiene que ver $a^2+2b^2$ con $a^2-b^2$? ¿Probaste los dos sentidos de tu descripción?
    explicacion: >-
      **La definición primero:** $3\mid n$ si existe $k\in\mathbb Z$ con $n=3k$; cada propiedad termina en «es 3 por un entero». **Simétrica:** se escribe $b^2+2a^2=3(a^2+b^2)-(a^2+2b^2)$, que es 3 por un entero. **Transitiva:** se suman las dos hipótesis y se quita $3b^2$. Con la misma $k$ en las dos, solo probaste el caso en que los dos cocientes coinciden. **Iguales o disjuntas:** el $c$ común es el intermedio; la simétrica voltea $cRa$, la transitiva da $aRb$, y con eso las dos clases tienen los mismos elementos. **Las clases:** $a^2+2b^2$ y $a^2-b^2$ difieren en $3b^2$, así que la condición es $3\mid(a-b)(a+b)$. Un error común es probar un solo sentido, o creer que un no múltiplo de 3 se relaciona nada más con los de su mismo residuo: $1\sim2$, porque $1+2\cdot2^2=9$. Revisa: $2\sim4$, porque $4+32=36$, y $3\sim6$, porque $9+72=81$.
    tarjeta: false
    tiempo_estimado_s: 360

  # razonamiento: algorítmico (contar particiones por la forma de sus bloques) · R2
  # verificar: enumera las 2¹⁶ relaciones sobre {1, 2, 3, 4}, se queda con las equivalencias y cuenta por definición.
  - id: disc-17-016
    tipo: completar
    dificultad: 4
    conceptos: [particiones, conjunto-cociente]
    enunciado: >-
      Cuenta las relaciones de equivalencia sobre $\{1,2,3,4\}$, y entre ellas, las de cada tipo que se pide.
    texto: >-
      Número de relaciones de equivalencia: ___ · número de ellas con al menos una clase de exactamente 2 elementos: ___ · número de ellas que contienen el par $(1,2)$ pero no el $(1,3)$: ___
    respuestas: ["15", "9", "3"]
    verificar: { python: "(lambda A: (lambda E: [len(E), sum(1 for R in E if any(sum(1 for y in A if (y, x) in R) == 2 for x in A)), sum(1 for R in E if (1, 2) in R and (1, 3) not in R)])([R for R in ({p for i, p in enumerate([(a, b) for a in A for b in A]) if m >> i & 1} for m in range(2 ** 16)) if all((a, a) in R for a in A) and all((b, a) in R for (a, b) in R) and all((a, d) in R for (a, b) in R for (c, d) in R if b == c)]))([1, 2, 3, 4])" }
    pistas:
      - >-
        ¿Qué cuentas en realidad: relaciones o maneras de repartir $\{1,2,3,4\}$ en bloques?
      - >-
        ¿De qué formas, por los tamaños de sus bloques, se reparten 4 elementos? ¿Cuántas particiones hay de cada forma?
      - >-
        Tener $(1,2)$ y no $(1,3)$, ¿qué dice de los bloques del 1, del 2 y del 3? ¿A dónde puede ir el 4?
    explicacion: >-
      Cada equivalencia sobre $\{1,2,3,4\}$ da una partición y cada partición da una equivalencia, así que se cuentan particiones, por la forma de sus bloques. **Un bloque de 4:** 1. **3 y 1:** se elige el que va aparte, 4. **2 y 2:** el 1 va con uno de los otros tres, y los dos que quedan van juntos: 3. **2, 1 y 1:** se elige la pareja, de 6 maneras ($\{1,2\}$, $\{1,3\}$, …, $\{3,4\}$). **Cuatro de 1:** la igualdad, 1. Total, $1+4+3+6+1=15$. **Con al menos una clase de 2:** las formas 2 y 2, y 2, 1 y 1: $3+6=9$. **Con $(1,2)$ y sin $(1,3)$:** el 1 y el 2 van en el mismo bloque y el 3 en otro; el 4 puede ir con el 3, con el 1 y el 2, o en un bloque aparte: $\{1,2\},\{3,4\}$; $\{1,2,4\},\{3\}$; y $\{1,2\},\{3\},\{4\}$, que son 3. Revisa: de las 15, juntan al 1 con el 2 cinco (estas tres, la de un bloque y $\{1,2,3\},\{4\}$), y de esas cinco, dos también tienen $(1,3)$: $5-2=3$.
    tiempo_estimado_s: 150

  # razonamiento: algorítmico (una clase por producto; contar factorizaciones con orden) · R2
  # verificar: las clases de «mismo producto» en {1, …, 6}², su tamaño máximo y cuántas lo alcanzan.
  - id: disc-17-017
    tipo: completar
    dificultad: 4
    conceptos: [conjunto-cociente, clases-equivalencia]
    enunciado: >-
      En $A=\{1,2,\dots,6\}^2$, sea $(a,b)R(c,d)$ si $ab=cd$. Es de equivalencia.
    texto: >-
      Número de clases: ___ · mayor número de elementos que tiene una clase: ___ · número de clases con ese número de elementos, contándolas todas: ___
    respuestas: ["18", "4", "2"]
    verificar: { python: "(lambda A: (lambda C: [len(C), max(map(len, C)), sum(1 for K in C if len(K) == max(map(len, C)))])({frozenset(q for q in A if q[0] * q[1] == p[0] * p[1]) for p in A}))([(a, b) for a in range(1, 7) for b in range(1, 7)])" }
    pistas:
      - >-
        ¿Qué etiqueta comparten los pares de una misma clase?
      - >-
        ¿Cuántos productos distintos salen de dos números del 1 al 6? ¿Cómo los cuentas sin repetir?
      - >-
        ¿Qué productos se pueden escribir de más maneras? ¿Contaste $(a,b)$ y $(b,a)$ por separado?
    explicacion: >-
      Es de la forma $f(p)=f(q)$, con $f(a,b)=ab$: hay una clase por cada producto distinto. **Productos:** de la tabla del 1 al 6 salen 1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25, 30 y 36, así que hay 18 clases. **Las más grandes:** cada producto $a\cdot b$ con $a\neq b$ da dos pares, $(a,b)$ y $(b,a)$, y uno con $a=b$ da uno. Para llegar a 4 pares, un producto necesita dos factorizaciones con factores distintos, y nada más el 6 ($1\cdot6$ y $2\cdot3$) y el 12 ($2\cdot6$ y $3\cdot4$) las tienen. Ningún producto tiene tres, así que el máximo es 4 y lo alcanzan 2 clases. El 4 ($1\cdot4$ y $2\cdot2$) da 3, porque $(2,2)$ cuenta una vez. Revisa: hay 5 clases de 1 par (1, 9, 16, 25 y 36), 1 de 3, 2 de 4 y las 10 restantes de 2, y $5+3+8+20=36=6^2$.
    tiempo_estimado_s: 120

  # razonamiento: deductivo (tumbar un «siempre» con un caso chico o demostrarlo con las tres propiedades) · R4
  # De experto-matematicas, con un solo contraejemplo para las dos falsas; pistas de arquitecto-razonamiento (la 2.ª,
  # pasada a pregunta en la revisión).
  # verificar: las 15 equivalencias sobre {1, 2, 3, 4} y sus 225 parejas (R, S), con S∘R «primero R».
  - id: disc-17-018
    tipo: seleccion_multiple
    dificultad: 5
    conceptos: [relacion-equivalencia, particiones]
    enunciado: >-
      Sean $R$ y $S$ relaciones de equivalencia sobre el mismo conjunto $A$, con $S\circ R$ como en la unidad 15: «primero $R$, luego $S$». ¿Cuáles de estas afirmaciones valen siempre? Puede haber varias.
    opciones:
      - >-
        $R\cap S$ es de equivalencia.
      - >-
        $R\cup S$ es de equivalencia.
      - >-
        $R\circ R=R$.
      - >-
        $S\circ R$ es de equivalencia.
      - >-
        Si $R\subseteq S$, cada clase de $S$ es una unión de clases de $R$.
    correctas: [0, 2, 4]
    verificar: { python: "(lambda A: (lambda E, iseq, comp, cl: [all(iseq(R & S) for R in E for S in E), all(iseq(R | S) for R in E for S in E), all(comp(R, R) == R for R in E), all(iseq(comp(R, S)) for R in E for S in E), all(cl(S, a) == set().union(*[cl(R, x) for x in cl(S, a)]) for R in E for S in E if R <= S for a in A)])([R for R in ({p for i, p in enumerate([(a, b) for a in A for b in A]) if m >> i & 1} for m in range(2 ** 16)) if all((a, a) in R for a in A) and all((b, a) in R for (a, b) in R) and all((a, d) in R for (a, b) in R for (c, d) in R if b == c)], lambda R: all((a, a) in R for a in A) and all((b, a) in R for (a, b) in R) and all((a, d) in R for (a, b) in R for (c, d) in R if b == c), lambda R, S: {(a, c) for (a, b) in R for (b2, c) in S if b == b2}, lambda R, x: {y for y in A if (y, x) in R}))([1, 2, 3, 4])" }
    pistas:
      - >-
        ¿Qué basta para tumbar un «siempre» y qué hace falta para aceptarlo? ¿Cuál de las tres propiedades podría romperse?
      - >-
        ¿Qué pasa en un caso chico, con dos particiones distintas de $\{1,2,3\}$? Si listas los pares de cada relación, ¿su unión y su intersección cumplen las tres propiedades?
      - >-
        Si $(a,c)\in R\circ R$, ¿qué intermedio existe? Si $(a,b)\in R$, ¿puedes escribirlo como composición de dos pares de $R$? ¿Qué propiedad no usaste?
    explicacion: >-
      Valen siempre «$R\cap S$ es de equivalencia», «$R\circ R=R$» y «si $R\subseteq S$, cada clase de $S$ es unión de clases de $R$»; fallan «$R\cup S$» y «$S\circ R$». **Un contraejemplo para las dos:** sobre $\{1,2,3\}$, $R$ la de la partición $\{1,2\},\{3\}$ y $S$ la de $\{1\},\{2,3\}$. $R\cup S$ tiene $(1,2)$ y $(2,3)$, pero no $(1,3)$: no es transitiva. $S\circ R$ tiene $(1,3)$, por $1R2$ y $2S3$, pero no $(3,1)$, porque $R$ lleva el 3 nada más al 3, y $S$ lleva el 3 al 2 y al 3: no es simétrica. **$R\cap S$:** cada propiedad pasa a la intersección; $(a,a)$ está en las dos, si $(a,b)$ está en las dos también $(b,a)$, y si $(a,b)$ y $(b,c)$ están en las dos, también $(a,c)$. **$R\circ R=R$:** si $(a,c)\in R\circ R$, hay un intermedio $b$ con $aRb$ y $bRc$, y la transitiva da $aRc$; al revés, si $aRb$, con $aRa$ (reflexiva) queda $(a,b)\in R\circ R$, con intermedio $a$. La simétrica no se usa. **Las clases:** si $R\subseteq S$ y $x$ está en una clase $K$ de $S$, todo lo que $R$ relaciona con $x$ también lo relaciona $S$, y la clase de $x$ según $S$ es $K$, por el lema, así que la clase de $x$ según $R$ cabe en $K$; al juntar esas clases, una por cada $x\in K$, sale $K$ completa. Revisa: en el contraejemplo, $R\cap S=I_A$, que sí es de equivalencia, con clases $\{1\}$, $\{2\}$ y $\{3\}$.
    tiempo_estimado_s: 180

  # razonamiento: analógico (factorizar la etiqueta y ligar «misma imagen» con la inyectividad de la 15) · R2
  # Hace par con disc-15-024 en el jefe: inyectiva si y solo si todas las clases de «misma imagen» tienen un elemento.
  # verificar: EQ de f(x) = f(y) en {1, …, 20}, el número de clases, los que no están solos y el otro de [3].
  - id: disc-17-019
    tipo: completar
    dificultad: 5
    conceptos: [clases-equivalencia, conjunto-cociente]
    enunciado: >-
      En $A=\{1,2,\dots,20\}$, sea $xRy$ si $x^2-10x=y^2-10y$. Es de equivalencia.
    texto: >-
      Número de clases: ___ · número de elementos de $A$ cuya clase tiene más de un elemento: ___ · elemento de $[3]$ distinto del 3: ___
    respuestas: ["16", "8", "7"]
    verificar: { python: "(lambda A, f: (lambda C: [len(C), sum(len(K) for K in C if len(K) > 1), [y for y in A if f(y) == f(3) and y != 3][0]])({frozenset(y for y in A if f(y) == f(x)) for x in A}) if (lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c)))(A, lambda x, y: f(x) == f(y)) else [])(range(1, 21), lambda x: x * x - 10 * x)" }
    pistas:
      - >-
        ¿Qué etiqueta comparten los elementos de una misma clase?
      - >-
        Si pasas todo a un lado, ¿cómo se factoriza $x^2-y^2-10(x-y)$?
      - >-
        Si $y\neq x$, ¿cuánto tiene que valer $x+y$? ¿Para qué $x$ de $A$ ese $y$ también está en $A$?
    explicacion: >-
      Es de la forma $f(x)=f(y)$, con $f(x)=x^2-10x$. **La clave:** $f(x)-f(y)=(x-y)(x+y)-10(x-y)=(x-y)(x+y-10)$, así que $xRy$ si y solo si $y=x$ o $y=10-x$. **En $A$:** $10-x$ está en $A$ si $x\le9$. Así se juntan el 1 con el 9, el 2 con el 8, el 3 con el 7 y el 4 con el 6; el 5 es su propio $10-x$, y del 10 al 20 cada uno queda en una clase de un elemento, porque $10-x\le0$. **Cuentas:** 4 clases de dos elementos, más $\{5\}$, más 11 clases del 10 al 20: 16 clases. Están en una clase de más de un elemento 8 números, y $[3]=\{3,7\}$. **La liga con la unidad 15:** $f$ es inyectiva en $A$ si y solo si todas las clases de «misma imagen» tienen un elemento; aquí no lo es, porque junta, por ejemplo, al 3 con el 7. Revisa: $f(3)=9-30=-21$ y $f(7)=49-70=-21$.
    tiempo_estimado_s: 150

  # razonamiento: analógico (llevar «buscar duplicados» a «misma etiqueta» y reconocer un parecido no transitivo) · R2
  # Transferencia, hipotético (registros de experto-matematicas). El ejemplo de la regla, «Lima», no está en la lista.
  # verificar: normaliza cada registro (minúsculas, sin vocales), cuenta las clases y el tamaño de [peso], y revisa la
  # transitividad de «misma longitud y a lo más una posición distinta» en las 11³ ternas.
  - id: disc-17-020
    tipo: completar
    dificultad: 5
    conceptos: [clases-equivalencia, conjunto-cociente]
    enunciado: >-
      Supón que una base de datos tiene estos 11 registros: Casa, cosa, CASO, queso, cesa, piso, paso, peso, pesa, masa y pisa. Para buscar duplicados, dos registros se consideran equivalentes si quedan iguales al pasarlos a minúsculas y quitarles las vocales (a, e, i, o, u); por ejemplo, «Lima» queda «lm». En el hueco de sí o no, escribe 1 (sí) o 0 (no).
    texto: >-
      Número de clases: ___ · número de registros en la clase de «peso»: ___ · otra regla, «tienen la misma longitud y, sin distinguir mayúsculas, difieren a lo más en una posición», ¿es transitiva sobre estos 11 registros? ___
    respuestas: ["4", "5", "0"]
    verificar: { python: "(lambda W, f, h: [len({frozenset(v for v in W if f(v) == f(w)) for w in W}), sum(1 for v in W if f(v) == f('peso')), int(all(h(a, c) for a in W for b in W for c in W if h(a, b) and h(b, c)))])(['Casa', 'cosa', 'CASO', 'queso', 'cesa', 'piso', 'paso', 'peso', 'pesa', 'masa', 'pisa'], lambda w: ''.join(ch for ch in w.lower() if ch not in 'aeiou'), lambda u, v: len(u) == len(v) and sum(1 for i in range(len(u)) if u.lower()[i] != v.lower()[i]) <= 1)" }
    pistas:
      - >-
        ¿Qué etiqueta le toca a cada uno de los 11 registros?
      - >-
        Dos registros quedan en la misma clase si y solo si tienen la misma etiqueta: ¿cuántas etiquetas distintas hay?
      - >-
        Para la otra regla, ¿puedes ir de un registro a otro cambiando una letra a la vez y terminar en uno que difiere en dos posiciones del primero?
    explicacion: >-
      La regla es de la forma $f(x)=f(y)$, con $f$ «a minúsculas y sin vocales», así que es de equivalencia y hay una clase por etiqueta. **Etiquetas:** «cs» para Casa, cosa, CASO y cesa; «qs» para queso; «ps» para piso, paso, peso, pesa y pisa; y «ms» para masa. Son 4 clases, y la de peso tiene 5 registros. **La otra regla** es de parecido, y el parecido no siempre es transitivo: peso y pesa difieren en una posición, y pesa y pisa en otra, pero peso y pisa difieren en dos. Por eso no reparte en clases: 0. Revisa: los tamaños suman $4+1+5+1=11$.
    tiempo_estimado_s: 150
