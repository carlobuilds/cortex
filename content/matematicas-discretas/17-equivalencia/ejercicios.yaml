  # verificar: [2] ∩ [5] (0 si es vacía), int(EQ) con la plantilla de arriba, y el único (a, c) con a < c que agrega la
  # cerradura transitiva, calculada hasta el punto fijo ((0, 0) si no agrega ninguno); devuelve [] si [2] ∩ [5] o esos
