      - >-
        ¿Dos clases pueden compartir un elemento sin ser iguales?
      - >-
        Si tomas como intermedio el elemento que comparten, ¿qué par pide la transitiva?
    explicacion: >-
      **La revisión que faltó:** $[2]$ y $[5]$ son distintas, pero comparten el 4, y en una equivalencia dos clases son iguales o disjuntas. Eso basta para saber que $R$ no es de equivalencia, sin revisar par por par: 0. **Qué falla:** $R$ es reflexiva, porque contiene a $I_A$, y simétrica, porque cada par con coordenadas distintas viene con su inverso. Pero no es transitiva: $(2,4)$ y $(4,5)$ están en $R$, con el 4 de intermedio, y $(2,5)$ no. **El par que falta** es ese, $(2,5)$; su inverso, $(5,2)$, tampoco está, y lo piden $(5,4)$ y $(4,2)$. Con los dos agregados, la relación que queda ya es transitiva. Beto tampoco miró el 1 ni el 3: con los dos pares nuevos, las clases quedan $\{1,3\}$ y $\{2,4,5\}$, y entre las dos cubren $A$. ¿Qué revisión harás siempre al terminar de listar clases? Revisa: con los dos pares agregados, $[2]=[4]=[5]=\{2,4,5\}$.
