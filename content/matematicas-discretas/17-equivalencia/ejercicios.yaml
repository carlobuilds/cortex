    respuesta: ["(0, 2)", "(1, 2)", "(2, 2)", "(2, 0)", "(2, 1)"]
    verificar: { python: "(lambda A, r: {q for q in A if r(q, (1, 2))} if (lambda A, r: all(r(a,a) for a in A) and all(r(b,a) for a in A for b in A if r(a,b)) and all(r(a,c) for a in A for b in A if r(a,b) for c in A if r(b,c)))(A, r) else set())([(a, b) for a in range(4) for b in range(4)], lambda p, q: max(p) == max(q))" }
