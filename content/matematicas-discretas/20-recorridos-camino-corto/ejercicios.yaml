        En las que aceptas, ¿tu argumento vale para todo grafo o solo para los que probaste? Si una ruta tiene $k$ tramos, ¿cuánto cambia su peso al sumarle $r$ a cada arista, y al multiplicar cada una por $r$?
    explicacion: >-
      Valen «multiplicar todos los pesos por una constante positiva deja los mismos caminos más cortos», «la parte de $u$ a $v$ de un camino más corto es un camino más corto» y «quitar una arista que no está en el árbol BFS no cambia las distancias en aristas»; las otras tres no. **Contraejemplos.** El árbol DFS: en el triángulo $a,b,c$, DFS va $a\to b\to c$; la trayectoria del árbol de $a$ a $c$ tiene 2 aristas, y $\mathrm{dist}(a,c)=1$. Sumar una constante: con $s$–$t$ 3, $s$–$x$ 1 y $x$–$t$ 1, el más corto es $s,x,t$, de 2; al sumar 2 a cada peso, $s,t$ pesa 5 y $s,x,t$, 6, y gana la directa. Pesos distintos: con $s$–$a$ 1, $a$–$t$ 4, $s$–$b$ 2 y $b$–$t$ 3, los caminos $s,a,t$ y $s,b,t$ pesan 5. **Las que valen.** Al multiplicar por $r>0$, cada camino pesa $r$ veces lo que pesaba: los pesos cambian, pero el orden entre ellos no; sumar $r$, en cambio, le suma $kr$ a un camino de $k$ aristas y castiga más a los de muchas aristas. Si la parte de $u$ a $v$ no fuera un camino más corto, se cambia por uno más ligero y queda un camino de $s$ a $t$ más ligero que uno más corto, lo que no puede ser. Y al quitar una arista que no está en el árbol BFS, el árbol sigue en el grafo: cada vértice conserva su camino de padres, con tantas aristas como su nivel, que es su distancia en aristas, y quitar aristas no acorta ningún camino. Revisa: en el ejemplo de sumar, multiplicar por 2 da 6 contra 4, y sigue ganando $s,x,t$.
