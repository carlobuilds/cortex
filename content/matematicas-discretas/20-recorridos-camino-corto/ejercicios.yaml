        Cuando llegas a un vértice sin vecinos por visitar, ¿a cuál regresas? ¿Desde qué vértice entras al siguiente vértice nuevo?
    explicacion: |-
      El grafo tiene vértices $a$ a $g$ y aristas $ab$, $ae$, $af$, $ag$, $bd$, $bf$, $cd$, $df$, $dg$ y $eg$.

      1. De $d$ (vecinos $b$, $c$, $f$ y $g$) entra a $b$; de $b$ (vecinos $a$, $d$ y $f$), a $a$; de $a$ (vecinos $b$, $e$, $f$ y $g$), a $e$; de $e$ (vecinos $a$ y $g$), a $g$.
      2. Los vecinos de $g$, que son $a$, $d$ y $e$, ya están visitados: regresa a $e$, que tampoco tiene, y luego a $a$.
