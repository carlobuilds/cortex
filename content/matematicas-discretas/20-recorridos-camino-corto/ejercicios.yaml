        ¿Cuál se fija primero, $b$ o $c$? Cuando se fija $c$, ¿qué pasa entonces con su flecha hacia $b$?
      - >-
        Sin Dijkstra, ¿cuál es el camino dirigido más barato de $a$ a $b$? ¿Qué otros vértices se alcanzan pasando por $b$?
      - >-
        ¿Puedes salir de un vértice y volver a él siguiendo las flechas?
    explicacion: |-
      Las flechas son $(a,b)$ 3, $(a,c)$ 5, $(b,e)$ 7, $(b,f)$ 4, $(c,b)$ $-4$ y $(f,e)$ 2.

      1. Se fija $a$: $d(b)=3$ y $d(c)=5$.
      2. Se fija $b$, con 3: $d(e)=10$ y $d(f)=7$.
      3. Se fija $c$, con 5. Su flecha va a $b$, que ya está fijado, así que no se relaja.
      4. Se fija $f$, con 7: $d(e)$ baja a $7+2=9$. Se fija $e$, con 9.

      **Las distancias reales:** $a,c,b$ pesa $5-4=1$; de ahí, $a,c,b,f$ pesa 5, y $a,c,b,f,e$, 7 (por $(b,e)$ serían 8). Dijkstra dejó $b$ en 3, $f$ en 7 y $e$ en 9: fallan 3 vértices. Fijó $b$ con 3 antes de ver la flecha de $-4$, y lo que «ya no cambia» sí podía bajar. **Ciclos:** no hay. En el orden $a,c,b,f,e$, cada flecha va de un vértice a uno posterior, así que ningún camino dirigido regresa, y el menor peso existe. Revisa: $5+(-4)+4+2=7$.
    tiempo_estimado_s: 150

