# Unidad 20 · Búsqueda en grafos y camino más corto (Unidad IV, 4.5.3 y 4.5.4, y práctica 8, «Recorridos»). Para el
# 3.er parcial (semana del 23 al 27 de noviembre de 2026). Título visible «Búsqueda en grafos y camino más corto»; el
# slug 20-recorridos-camino-corto no cambia (es permanente).
# Esquema v1 aprobado por Carlo el 2026-11-14 (esquema-20), revisado por experto-matematicas (M), pedagogo (P),
# arquitecto-razonamiento (A) y linguista (L). Datos y `verificar` de M (herramientas/m20/verificar-20.py), comprobados
# por la sesión principal con código propio; el autor volvió a calcular con código propio (otra implementación de BFS,
# DFS, Dijkstra y enumeración de trayectorias) cada orden, tabla, número y camino de las explicaciones y de la lección.
# Ids en el orden de la tabla del v1, escalera 6/6/6/4/3: d1 001–006, d2 007–012, d3 013–018, d4 019–022, d5 023–025.
# Anclas (primer ejercicio de cada concepto, workedExampleFor): 001 BA, 002 BP, 003 DB, 004 GP y 005 DJ, todas de d1,
# con lo que se pide escrito en el enunciado y con la tabla o los pasos completos en la explicación, que hace de
# ejemplo resuelto. WorkedExample muestra solo enunciado y explicación, así que la explicación de cada ancla con visual
# lista el grafo.
# Abreviaturas: BA busqueda-amplitud · BP busqueda-profundidad · DB distancia-bfs · GP grafo-ponderado · DJ dijkstra.
# Terminología (L, con la `notacion` que agrega la sesión principal): «búsqueda en amplitud/profundidad», nunca
# «recorrido», para BFS y DFS; lo que dan es el «orden BFS» o el «orden DFS». La distancia siempre con apellido:
# distancia en aristas dist(s, v), distancia tentativa d(v) y distancia ponderada. «Camino más corto» es de peso mínimo;
# el de menos aristas se dice «con menos aristas». «Marcar» es de BFS, al encolar; «fijar», de Dijkstra y solo de
# vértices; «relajar» la arista uv. El nivel del origen es 0. En los árboles BFS y DFS, «padre»; en Dijkstra,
# «predecesor». En un dirigido, los vecinos de u son los de salida. «Recorrer» no se usa como verbo (19).
# Hipótesis (M): vecinos en orden alfabético; BFS con cola y marca al encolar; DFS entra al primer vecino sin visitar y
# regresa (orden = descubrimiento). Dijkstra con pesos ≥ 0 (el 0 se vale), fija el no fijado de menor d con empate
# alfabético, relaja solo hacia no fijados y solo si mejora estrictamente (en un empate se queda el predecesor); los
# inalcanzables no se fijan y nunca se pide el orden de fijado en un grafo con inalcanzables (011). El peso negativo va
# solo en un digrafo sin ciclos (021).
# Plataforma (M y A): en el visual `grafo` no hay pesos, así que con pesos el enunciado da la lista por vértice
# («a: c 4, e 2 · …»), y el dibujo va solo en el 011 (dirigido, con un inalcanzable). Ningún grafo con pesos tiene
# vértices d ni w. Los órdenes van como `completar`, una letra por hueco y sin el origen como hueco (se escribe antes
# del primero); nunca `ordenar`. Ningún orden pedido es alfabético, BFS y DFS no dan el mismo orden en el 001 y el
# 002, y el perímetro de cada visual (el orden de `vertices`) coincide con el orden pedido a lo más en el origen, en las
# dos direcciones (el autor lo revisó con código). Ningún hueco pide operadores, palabras de varias letras, números con
# separador de miles ni «−»: todos piden un número o una sola letra, y lo dicen.
# Las aristas se parten con ', ', así que en `aristas` llevan espacio. Cada `verificar` lee las aristas del MISMO texto
# que su visual; los vértices los lee en orden alfabético (el 012 lo necesita: «el primero sin marcar»), aunque el
# visual los dé en otro orden para el perímetro: 001, 002, 016 y 022, de M; 003, 006, 007, 008, 009, 012 y 017, del
# autor, que bajó los cruces del dibujo (de 10, 18, 5, 8, 8, 7 y 5 a 1, 1, 2, 1, 2, 0 y 1) sin romper la regla del
# perímetro, revisada con código para el orden BFS y el DFS desde el origen. El 011 y el 018 quedan en orden
# alfabético: con 2 cruces, el 011 tendría en el perímetro su orden de fijado, y el 018 no pide ningún orden.
# `verificar`: los de M, en Python puro, sin cambios (vía independiente: las distancias por enumeración de trayectorias
# o por capas de vecinos, no con la cola ni con Dijkstra; los órdenes, ejecutando el algoritmo). Probados con el
# check_exercise real (24/24) y, sobre este archivo, con 81 respuestas alteradas (las 73 de neg.py de M y 8 del autor),
# que fallan todas.
# Pistas como preguntas, sin valores intermedios: 1 en d1–2, 2 en d3 y 3 en d4–5 (las del 015, el 019 y el 023 son de
# A, tal cual). Desde d3, la explicación cierra con «Revisa:», con una comprobación que no repite el cálculo. Las
# explicaciones de selección y opción múltiple dicen cuáles son las correctas.
# Manuales: solo el 019 (autoevaluación de A, tal cual, tarjeta: false).
# Personajes: Leo (014, error plantado) e Iván (015, metacognitivo de A).
# Textos con LaTeX en bloques `>-` (o `|-` cuando llevan listas): así no hay que escapar comillas ni barras.
# Arreglos del 2026-11-15 (/revisar-contenido, «errores + mejoras», aprobados por Carlo): textos del 005, 011, 012,
# 014, 019, 021, 023 y 025; ninguna respuesta ni ningún `verificar` cambió (24/24 con el check_exercise real).
unidad: matematicas-discretas/20-recorridos-camino-corto
ejercicios:
  # razonamiento: algorítmico (cola; encolar los vecinos sin marcar en orden alfabético) · R1
  # Ancla de BA: la explicación trae la tabla completa, fila por fila («sale · se marcan y encolan · cola»), y lista el
  # grafo. Perímetro a, e, d, c, g, b, f (0 cruces, M). Errores que rechaza el verificar (neg.py): el nivel 3 en orden
  # alfabético (…, c, d) y el orden DFS.
  # verificar: ejecuta BFS (cola, marca al encolar, vecinos en orden alfabético) sobre las aristas del visual.
  - id: disc-20-001
    tipo: completar
    dificultad: 1
    conceptos: [busqueda-amplitud]
    enunciado: >-
      En una **búsqueda en amplitud** (BFS) desde $a$ se usa una cola: se marca y se encola $a$; luego, mientras la cola no esté vacía, se saca al vértice del frente y se marcan y encolan, en orden alfabético, sus vecinos sin marcar. El **orden BFS** es el orden en que los vértices entran a la cola. Escribe el orden BFS de este grafo desde $a$; cada hueco es un vértice.
    visual: { id: grafo, vertices: "a, e, d, c, g, b, f", aristas: "a-b, a-f, b-e, b-g, c-d, c-g, d-e, d-g, e-g" }
    texto: >-
      Orden BFS: $a$, ___, ___, ___, ___, ___, ___
    respuestas: ["b", "f", "e", "g", "d", "c"]
    verificar: { python: "(lambda V, E: (lambda A, s: (lambda go: go(go, [s], [s], {s: None}, {s: 0}))(lambda go, Q, M, P, L: (M, P, L) if not Q else (lambda N: go(go, Q[1:] + N, M + N, {**P, **{v: Q[0] for v in N}}, {**L, **{v: L[Q[0]] + 1 for v in N}}))([v for v in A[Q[0]] if v not in M])))((lambda V, E: {v: sorted({w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v}) for v in V})(V, E), 'a')[0][1:])('a, b, c, d, e, f, g'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-f, b-e, b-g, c-d, c-g, d-e, d-g, e-g'.split(', ')])" }
    pistas:
      - >-
        Cuando sacas a un vértice, ¿a qué vecinos encolas y en qué orden? ¿Quién queda al frente de la cola después?
    explicacion: |-
      El grafo tiene vértices $a$ a $g$ y aristas $ab$, $af$, $be$, $bg$, $cd$, $cg$, $de$, $dg$ y $eg$. En cada paso sale el vértice del frente y se marcan y encolan sus vecinos sin marcar:

      1. Inicio: se marca y encola $a$. Cola: $a$.
      2. Sale $a$; se marcan y encolan $b$ y $f$. Cola: $b,f$.
      3. Sale $b$; sus vecinos sin marcar son $e$ y $g$. Cola: $f,e,g$.
      4. Sale $f$; su único vecino, $a$, ya está marcado. Cola: $e,g$.
      5. Sale $e$; se marca y encola $d$, porque $b$ y $g$ ya están marcados. Cola: $g,d$.
      6. Sale $g$; se marca y encola $c$. Cola: $d,c$.
      7. Salen $d$ y $c$ sin encolar a nadie. Cola: vacía.

      El orden BFS es $a,b,f,e,g,d,c$. Un error común es poner $c$ antes que $d$, por orden alfabético: el orden lo da la cola, y $d$ entró primero porque lo encoló $e$, que salió antes que $g$. Comprueba: los niveles son $a$ 0; $b$ y $f$ 1; $e$ y $g$ 2; $d$ y $c$ 3, y en el orden BFS no bajan.
    tiempo_estimado_s: 60

  # razonamiento: algorítmico (entrar al primer vecino sin visitar y regresar) · R1
  # Ancla de BP: la explicación da cada entrada y cada regreso, y lista el grafo. Mismo grafo que el 001 (P): el orden
  # DFS es distinto del BFS. La explicación no da el orden BFS, para no contestar el 001. Errores que rechaza el
  # verificar (neg.py): el orden BFS y el de una pila que marca al meter.
  # verificar: ejecuta DFS recursivo (orden = descubrimiento) sobre las aristas del visual.
  - id: disc-20-002
    tipo: completar
    dificultad: 1
    conceptos: [busqueda-profundidad]
    enunciado: >-
      En una **búsqueda en profundidad** (DFS) desde $a$, en cada vértice se entra al primer vecino sin visitar, en orden alfabético; si no queda ninguno, se regresa al vértice del que se llegó y se sigue desde ahí. El **orden DFS** es el orden en que se descubren los vértices. Escribe el orden DFS de este grafo desde $a$; cada hueco es un vértice.
    visual: { id: grafo, vertices: "a, e, d, c, g, b, f", aristas: "a-b, a-f, b-e, b-g, c-d, c-g, d-e, d-g, e-g" }
    texto: >-
      Orden DFS: $a$, ___, ___, ___, ___, ___, ___
    respuestas: ["b", "e", "d", "c", "g", "f"]
    verificar: { python: "(lambda V, E: (lambda A, s: (lambda go: go(go, s, ([s], {s: None}, [])))(lambda go, u, S: (lambda R: (R[0], R[1], R[2] + [u]))(list(itertools.accumulate(A[u], lambda st, v: st if v in st[0] else go(go, v, (st[0] + [v], {**st[1], v: u}, st[2])), initial=S))[-1])))((lambda V, E: {v: sorted({w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v}) for v in V})(V, E), 'a')[0][1:])('a, b, c, d, e, f, g'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-f, b-e, b-g, c-d, c-g, d-e, d-g, e-g'.split(', ')])" }
    pistas:
      - >-
        Cuando llegas a un vértice sin vecinos por visitar, ¿a cuál regresas? ¿Hasta dónde tienes que regresar para encontrar uno nuevo?
    explicacion: |-
      El grafo tiene vértices $a$ a $g$ y aristas $ab$, $af$, $be$, $bg$, $cd$, $cg$, $de$, $dg$ y $eg$.

      1. De $a$ (vecinos $b$ y $f$) entra a $b$.
      2. De $b$ (vecinos $a$, $e$ y $g$) entra a $e$.
      3. De $e$ (vecinos $b$, $d$ y $g$) entra a $d$.
      4. De $d$ (vecinos $c$, $e$ y $g$) entra a $c$.
      5. De $c$ (vecinos $d$ y $g$) entra a $g$.
      6. Los vecinos de $g$, que son $b$, $c$, $d$ y $e$, ya están visitados: regresa a $c$, luego a $d$, a $e$, a $b$ y a $a$, sin encontrar vecinos sin visitar.
      7. De $a$ entra a $f$, y de $f$ regresa a $a$. Termina.

      El orden DFS es $a,b,e,d,c,g,f$. $f$ sale al final, aunque es vecino de $a$: DFS no lo descubre hasta regresar a $a$. Comprueba: el árbol DFS tiene 6 aristas, una por vértice salvo $a$: $ab$, $be$, $ed$, $dc$, $cg$ y $af$.
    tiempo_estimado_s: 60

  # razonamiento: espacial (contar saltos en el dibujo, por capas alrededor de a) · R0
  # Ancla de DB: la explicación da todas las capas y lista el grafo. Errores que rechaza el verificar (neg.py): con e
  # (que está a 3), sin g, y los de distancia 1. Perímetro del autor (1 cruce).
  # verificar: distancias por enumeración de todas las trayectorias desde a (no BFS).
  - id: disc-20-003
    tipo: conjunto
    dificultad: 1
    conceptos: [distancia-bfs]
    enunciado: >-
      La **distancia en aristas** $\mathrm{dist}(a,v)$ es el menor número de aristas de un camino de $a$ a $v$; en una búsqueda en amplitud desde $a$, es el nivel de $v$, con $a$ en el nivel 0. ¿Qué vértices de este grafo están a distancia exactamente 2 de $a$? Escribe todos, separados por comas, como `x, y`.
    visual: { id: grafo, vertices: "a, e, h, b, c, d, g, f", aristas: "a-b, a-f, b-c, b-h, c-f, c-g, d-g, e-h, f-g, f-h" }
    respuesta: ["c", "g", "h"]
    verificar: { python: "(lambda V, E: (lambda N: {t for t in V if min([len(p) - 1 for (c, p) in (lambda N, s, t: (lambda go: go(go, (s,), 0))(lambda go, p, c: [(c, p)] if p[-1] == t else [x for v in sorted(N[p[-1]]) if v not in p for x in go(go, p + (v,), c + N[p[-1]][v])]))(N, 'a', t)], default=-1) == 2})({v: {w: 1 for w in (lambda V, E: {v: sorted({w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v}) for v in V})(V, E)[v]} for v in V}))('a, b, c, d, e, f, g, h'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-f, b-c, b-h, c-f, c-g, d-g, e-h, f-g, f-h'.split(', ')])" }
    pistas:
      - >-
        ¿Qué vértices están a distancia 1? ¿A cuáles llegas desde ellos que no estén ya a distancia 0 o 1?
    explicacion: >-
      Son $c$, $g$ y $h$. El grafo tiene vértices $a$ a $h$ y aristas $ab$, $af$, $bc$, $bh$, $cf$, $cg$, $dg$, $eh$, $fg$ y $fh$. **Por capas:** a distancia 0 está $a$, y a distancia 1, sus vecinos $b$ y $f$. Los vecinos de $b$ y de $f$ que no están en esas capas son $c$, $h$ y $g$: distancia 2. Los vecinos nuevos de esos son $d$, por $g$, y $e$, por $h$: distancia 3. Comprueba: $c$ es vecino de $b$ y de $f$, pero no de $a$, así que su distancia no es 1; y $e$ no es vecino de $b$ ni de $f$, así que no es 2.
    tiempo_estimado_s: 45

  # razonamiento: algorítmico (sumar pesos de la lista) · R1
  # Ancla de GP: la explicación da el único camino con menos aristas, su suma y el más ligero. Pesos por vértice, sin
  # visual. El error 9 (el peso del más ligero, a, g, e, b, f) lo rechaza el verificar (neg.py).
  # verificar: enumera todas las trayectorias de a a f, exige que la de menos aristas sea única y da su peso.
  - id: disc-20-004
    tipo: numerico
    dificultad: 1
    conceptos: [grafo-ponderado]
    enunciado: >-
      En un **grafo ponderado** cada arista tiene un peso, y el **peso de un camino** es la suma de los pesos de sus aristas. Este grafo tiene vértices $a$, $b$, $c$, $e$, $f$ y $g$; junto a cada vértice van sus vecinos con el peso de la arista: $a$: $c$ 9, $g$ 4 · $b$: $c$ 6, $e$ 2, $f$ 2 · $c$: $a$ 9, $b$ 6, $e$ 6, $f$ 4 · $e$: $b$ 2, $c$ 6, $f$ 6, $g$ 1 · $f$: $b$ 2, $c$ 4, $e$ 6 · $g$: $a$ 4, $e$ 1. Hay un solo camino de $a$ a $f$ con el menor número posible de aristas. ¿Cuánto pesa?
    respuesta: 13
    tolerancia: 0
    verificar: { python: "(lambda V, N: (lambda P: (lambda m: (lambda L: L[0] if len(L) == 1 else None)([c for (c, p) in P if len(p) - 1 == m]))(min(len(p) - 1 for (c, p) in P)))((lambda N, s, t: (lambda go: go(go, (s,), 0))(lambda go, p, c: [(c, p)] if p[-1] == t else [x for v in sorted(N[p[-1]]) if v not in p for x in go(go, p + (v,), c + N[p[-1]][v])]))(N, 'a', 'f')))('a, b, c, e, f, g'.split(', '), (lambda V, W, D: {v: {**{b: w for ((a, b), w) in W.items() if a == v}, **({} if D else {a: w for ((a, b), w) in W.items() if b == v})} for v in V})('a, b, c, e, f, g'.split(', '), {tuple(x.split(': ')[0].split('-')): int(x.split(': ')[1]) for x in 'a-c: 9, a-g: 4, b-c: 6, b-e: 2, b-f: 2, c-e: 6, c-f: 4, e-f: 6, e-g: 1'.split(', ')}, 0))" }
    pistas:
      - >-
        ¿Hay una arista directa de $a$ a $f$? Si no, ¿qué vecino de $a$ es también vecino de $f$?
    explicacion: >-
      Pesa 13. **Menos aristas:** no hay arista $af$, así que hacen falta al menos 2. Los vecinos de $a$ son $c$ y $g$, y los de $f$, $b$, $c$ y $e$; el único que comparten es $c$. El camino con menos aristas es $a,c,f$, y pesa $9+4=13$. **No es el más ligero:** $a,g,e,b,f$ usa 4 aristas y pesa $4+1+2+2=9$. Con pesos, «menos aristas» y «menos peso» son dos preguntas distintas. Comprueba: en la lista, $a$: $c$ 9 y $c$: $f$ 4.
    tiempo_estimado_s: 45

  # razonamiento: algorítmico (fijar el de menor d entre todos, no el vecino del último) · R1
  # Ancla de DJ: la explicación trae todas las rondas y lista los pesos. Sin empates en ninguna elección, y ningún
  # fijado es vecino del anterior (lo exige el verificar), así que la caminata codiciosa (f, g, …) falla. Errores que
  # rechaza el verificar (neg.py): la caminata codiciosa y el orden BFS.
  # Arreglos (M): el enunciado dice «empatan dos no fijados en la menor d», no «hay empates», porque la explicación sí
  # tiene un empate al relajar (por gb, 7 + 2 = 9 empata con 9).
  # verificar: ejecuta Dijkstra, exige que no haya empates y que cada fijado no sea vecino del anterior, y da el orden.
  - id: disc-20-005
    tipo: completar
    dificultad: 1
    conceptos: [dijkstra]
    enunciado: >-
      **Dijkstra** desde $a$ empieza con $d(a)=0$ y las demás $d$ en $\infty$. En cada ronda se **fija** el vértice no fijado de menor $d$ y se **relajan** sus aristas hacia los vecinos $v$ no fijados: si $d(u)+w(u,v)<d(v)$, $d(v)$ baja a ese valor. Los pesos, por vértice: $a$: $c$ 8, $e$ 6, $f$ 2 · $b$: $e$ 4, $f$ 7, $g$ 2 · $c$: $a$ 8, $e$ 4 · $e$: $a$ 6, $b$ 4, $c$ 4 · $f$: $a$ 2, $b$ 7, $g$ 5 · $g$: $b$ 2, $f$ 5. En ninguna ronda empatan dos no fijados en la menor $d$. Escribe el orden en que se fijan los vértices; cada hueco es un vértice.
    texto: >-
      Orden en que se fijan: $a$, ___, ___, ___, ___, ___
    respuestas: ["f", "e", "g", "c", "b"]
    verificar: { python: "(lambda V, N: (lambda R: (lambda F: F[1:] if all(len([v for v in V if v not in S[2] and S[0][v] == min([S[0][x] for x in V if x not in S[2]])]) == 1 for S in R[:-1]) and all(F[i + 1] not in N[F[i]] for i in range(1, len(F) - 1)) else None)(R[-1][2]))((lambda V, N, s: list(itertools.accumulate(range(len(V)), lambda S, _: (lambda d, p, F: (lambda C: S if not C else (lambda u: ({v: d[u] + N[u][v] if v in N[u] and v not in F and v != u and d[u] + N[u][v] < d[v] else d[v] for v in V}, {v: u if v in N[u] and v not in F and v != u and d[u] + N[u][v] < d[v] else p[v] for v in V}, F + [u]))(min(C, key=lambda v: (d[v], v))))([v for v in V if v not in F and d[v] < math.inf]))(*S), initial=({v: 0 if v == s else math.inf for v in V}, {v: None for v in V}, []))))(V, N, 'a')))('a, b, c, e, f, g'.split(', '), (lambda V, W, D: {v: {**{b: w for ((a, b), w) in W.items() if a == v}, **({} if D else {a: w for ((a, b), w) in W.items() if b == v})} for v in V})('a, b, c, e, f, g'.split(', '), {tuple(x.split(': ')[0].split('-')): int(x.split(': ')[1]) for x in 'a-c: 8, a-e: 6, a-f: 2, b-e: 4, b-f: 7, b-g: 2, c-e: 4, f-g: 5'.split(', ')}, 0))" }
    pistas:
      - >-
        En cada ronda, ¿comparas las $d$ de todos los no fijados, o solo las de los vecinos del último que fijaste?
    explicacion: |-
      Los pesos son $ac$ 8, $ae$ 6, $af$ 2, $be$ 4, $bf$ 7, $bg$ 2, $ce$ 4 y $fg$ 5. En cada ronda:

      1. Se fija $a$, con 0: $d(c)=8$, $d(e)=6$ y $d(f)=2$.
      2. Se fija $f$, con 2, el menor: $d(b)=2+7=9$ y $d(g)=2+5=7$.
      3. Se fija $e$, con 6: por $eb$, $6+4=10$ no mejora 9, y por $ec$, $6+4=10$ no mejora 8.
      4. Se fija $g$, con 7: por $gb$, $7+2=9$ empata con 9, y no cambia nada.
      5. Se fija $c$, con 8, y al final $b$, con 9.

      El orden es $a,f,e,g,c,b$. En la tercera ronda no se fija $g$, el vecino más barato de $f$, sino $e$, que tiene la menor $d$ entre todos los no fijados. Comprueba: las $d$ finales, $f$ 2, $e$ 6, $g$ 7, $c$ 8 y $b$ 9, crecen en el orden en que se fijaron.
    tiempo_estimado_s: 60

  # razonamiento: espacial (capas alrededor de a) · R1
