  # razonamiento: algorítmico (DFS desde otro vértice, con regresos) · R1
  # Origen d: el grafo no tiene pesos (la regla de d y w es de Dijkstra). El padre de f es a, no g, el que se
  # descubrió justo antes (neg.py). Perímetro del autor (1 cruce), revisado desde d.
