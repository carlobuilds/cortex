    verificar: { python: "(lambda V, E: (lambda N: {t for t in V if min([len(p) - 1 for (c, p) in (lambda N, s, t: (lambda go: go(go, (s,), 0))(lambda go, p, c: [(c, p)] if p[-1] == t else [x for v in sorted(N[p[-1]]) if v not in p for x in go(go, p + (v,), c + N[p[-1]][v])]))(N, 'a', t)], default=-1) == 2})({v: {w: 1 for w in (lambda V, E: {v: sorted(b for (a, b) in E if a == v) for v in V})(V, E)[v]} for v in V}))('a, b, c, d, e, f, g'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-c, b-c, b-e, c-f, d-a, e-g, f-e, g-a'.split(', ')])" }
