    enunciado: >-
      El grafo tiene vértices $a$, $b$, $c$, $e$ y $f$ y estos pesos enteros, por vértice: $a$: $b$ 3, $f$ 1 · $b$: $a$ 3, $e$ 3, $f$ 3 · $c$: $e$ 2, $f$ 1 · $e$: $b$ 3, $c$ 2 · $f$: $a$ 1, $b$ 3, $c$ 1. Arma un grafo nuevo, sin pesos: cada arista de peso $k$ se cambia por una trayectoria de $k$ aristas, con $k-1$ vértices nuevos en medio, y las de peso 1 se quedan igual. Luego haz la búsqueda en amplitud desde $a$ en el grafo nuevo.
    texto: >-
      Número de vértices agregados (los que no estaban en el grafo original): ___ · nivel de $e$ en el grafo nuevo: ___ · mayor nivel del grafo nuevo: ___ · ese nivel lo tiene un solo vértice, que es nuevo; la arista original donde está une a ___ con ___ (cada hueco, un vértice; primero el que va antes en el alfabeto)
