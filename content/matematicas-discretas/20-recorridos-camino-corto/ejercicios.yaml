  # razonamiento: inductivo (de los casos dibujables a ⌊n/2⌋) · R2 (A)
  # Sustituye al GP «menos tramos ≠ menor peso» del v0 (M): ya lo cubren el Predice, §6, §8, el 004 y el 024.
  # verificar: niveles por capas de vecinos en C_n.
  - id: disc-20-010
    tipo: completar
    dificultad: 2
    conceptos: [distancia-bfs]
    enunciado: >-
      $C_n$ es el ciclo con vértices $0,1,\dots,n-1$, una arista entre $i$ e $i+1$ para cada $i<n-1$ y otra entre $n-1$ y $0$. Piensa en la búsqueda en amplitud desde 0: dibuja $C_7$ y $C_8$ y busca el patrón. Cada hueco es un número.
    texto: >-
      Mayor distancia en aristas desde 0 en $C_7$: ___ · en $C_8$: ___ · en $C_{101}$: ___ · número de vértices de $C_{101}$ que están a esa mayor distancia del 0: ___
    respuestas: ["3", "4", "50", "2"]
    verificar: { python: "(lambda f: [f(7)[0], f(8)[0], f(101)[0], f(101)[1]])(lambda n: (lambda D: (max(D.values()), sum(1 for v in D if D[v] == max(D.values()))))((lambda A, s: (lambda Ls: {v: min(k for (k, S) in enumerate(Ls) if v in S) for v in Ls[-1]})((lambda A, s: list(itertools.accumulate(range(len(A)), lambda S, _: S | frozenset(w for v in S for w in A[v]), initial=frozenset({s}))))(A, s)))({i: [(i - 1) % n, (i + 1) % n] for i in range(n)}, 0)))" }
    pistas:
      - >-
        En $C_7$, ¿cuántos vértices nuevos alcanza la búsqueda en cada nivel? ¿Qué pasa en el último nivel cuando $n$ es par y cuando es impar?
    explicacion: >-
      **Los casos chicos.** Desde 0, cada nivel agrega un vértice por cada lado del ciclo. En $C_7$, el nivel 1 es $\{1,6\}$, el 2 es $\{2,5\}$ y el 3 es $\{3,4\}$: la mayor distancia es 3. En $C_8$, los niveles 1 a 3 tienen dos vértices cada uno, y el 4 es $\{4\}$, al que se llega por los dos lados: la mayor distancia es 4. **El patrón:** el vértice $i$ está a distancia $\min(i,n-i)$, así que la mayor es $\lfloor n/2\rfloor$; con $n$ impar la tienen dos vértices, y con $n$ par, uno. **En $C_{101}$:** $\lfloor101/2\rfloor=50$, y la tienen el 50 y el 51, porque $\min(50,51)=\min(51,50)=50$: 2 vértices. Comprueba: en $C_{101}$, el 50 está a 50 aristas del 0 por un lado y a 51 por el otro.
    tiempo_estimado_s: 60

