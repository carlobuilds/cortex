      4. Se fija $e$, con 11, que empata con $i$ y va antes en el alfabeto, sin cambios. Luego se fija $i$, con 11: $d(c)=15$ y $d(h)=21$.
      5. Se fijan $g$, con 12, sin cambios, y $c$, con 15: por $ch$, $d(h)$ baja a 20. Se fija $h$, con 20.

      Por los predecesores, la ruta es $a,b,f,i,c,h$: $7+2+2+4+5=20$ minutos y 5 tramos. **Menos tramos:** los vecinos de $h$ son $i$ y $c$; ninguno es vecino de $a$, y de los vecinos de $a$, $b$ y $g$, solo $g$ es vecino de $i$. La única ruta de 3 tramos es $a,g,i,h$, de $12+11+10=33$ minutos, y no hay ninguna de 2. **Sin $b$–$f$**, Dijkstra da $b$ 7, $g$ 12, $e$ 18 por $b$, $f$ 20 por $e$, $i$ 22 por $f$ (por $g$ serían 23), $c$ 26 y $h$ 31 por $c$ (por $i$ serían 32): la ruta es $a,b,e,f,i,c,h$, de $7+11+2+2+4+5=31$ minutos. Revisa: la segunda ruta más rápida, $a,b,f,i,h$, tarda $7+2+2+10=21$, un minuto más, así que la de 20 es única.
