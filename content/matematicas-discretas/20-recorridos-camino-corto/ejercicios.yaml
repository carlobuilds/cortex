  - id: disc-20-015
    tipo: completar
    dificultad: 3
    conceptos: [dijkstra]
    enunciado: >-
      Iván corrió Dijkstra desde $s$ en un grafo no dirigido con estos pesos: $s$–$a$: 2, $s$–$b$: 5, $a$–$b$: 1, $a$–$c$: 6, $b$–$c$: 2, $b$–$e$: 7, $c$–$e$: 1, $c$–$t$: 5 y $e$–$t$: 2. Su tabla final dice: $d(s)=0$; $d(a)=2$, con predecesor $s$; $d(b)=3$, con predecesor $a$; $d(c)=8$, con predecesor $a$; $d(e)=9$, con predecesor $c$; y $d(t)=11$, con predecesor $e$. Revisó que cada $d$ fuera el peso del camino que dan los predecesores, todo cuadró y la dio por buena. La tabla está mal, y una sola arista lo demuestra sin rehacer el algoritmo: con los números de Iván, llegar por ella a uno de sus extremos cuesta menos que la $d$ de ese extremo.
    texto: >-
      Esa arista une al vértice ___ con el vértice ___ (primero el que va antes en el alfabeto) · número de vértices cuya $d$ de Iván está mal: ___ · la $d$ correcta de $t$ es ___
