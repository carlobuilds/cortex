  # razonamiento: algorítmico (quién encola a quién) · R1
  # Pares (padre, hijo); el ejemplo de formato usa x, y, z y w, que no son vértices del grafo. Errores que rechaza el
  # verificar (neg.py): (e, f) en lugar de (g, f) y (h, d) en lugar de (g, d). Perímetro del autor (2 cruces).
  # verificar: ejecuta BFS y da {(padre, hijo)}.
  - id: disc-20-007
    tipo: conjunto
    dificultad: 2
    conceptos: [busqueda-amplitud]
    enunciado: >-
      Haz la búsqueda en amplitud desde $a$, con los vecinos en orden alfabético. El **padre** de un vértice es el que estaba saliendo de la cola cuando se marcó. Escribe las aristas del árbol BFS como pares (padre, hijo), separados por comas, como `(x, y), (z, w)`.
    visual: { id: grafo, vertices: "a, c, d, g, f, e, b, h", aristas: "a-b, a-g, a-h, b-e, b-g, b-h, c-d, d-g, d-h, e-f, f-g" }
    respuesta: ["(a, b)", "(a, g)", "(a, h)", "(b, e)", "(g, d)", "(g, f)", "(d, c)"]
    verificar: { python: "(lambda V, E: (lambda R: {(R[1][v], v) for v in R[0] if R[1][v]})((lambda A, s: (lambda go: go(go, [s], [s], {s: None}, {s: 0}))(lambda go, Q, M, P, L: (M, P, L) if not Q else (lambda N: go(go, Q[1:] + N, M + N, {**P, **{v: Q[0] for v in N}}, {**L, **{v: L[Q[0]] + 1 for v in N}}))([v for v in A[Q[0]] if v not in M])))((lambda V, E: {v: sorted({w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v}) for v in V})(V, E), 'a')))('a, b, c, d, e, f, g, h'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-g, a-h, b-e, b-g, b-h, c-d, d-g, d-h, e-f, f-g'.split(', ')])" }
    pistas:
      - >-
        Cuando un vértice sale de la cola, ¿a qué vecinos marca él, y a cuáles ya había marcado otro antes?
    explicacion: |-
      El grafo tiene vértices $a$ a $h$ y aristas $ab$, $ag$, $ah$, $be$, $bg$, $bh$, $cd$, $dg$, $dh$, $ef$ y $fg$.

      1. Sale $a$ y marca a $b$, $g$ y $h$: $(a,b)$, $(a,g)$ y $(a,h)$.
      2. Sale $b$; $g$ y $h$ ya están marcados, y marca a $e$: $(b,e)$.
      3. Sale $g$ y marca a $d$ y a $f$: $(g,d)$ y $(g,f)$.
      4. Salen $h$ y $e$ sin marcar a nadie: $d$ y $f$ ya tenían padre.
      5. Sale $d$ y marca a $c$: $(d,c)$. Salen $f$ y $c$ sin marcar a nadie.

      Son 7 pares, uno por vértice salvo $a$. Un error común es dar $(h,d)$ o $(e,f)$: $h$ y $e$ también son vecinos de $d$ y de $f$, pero salen de la cola después de $g$. Comprueba: el único vecino de $c$ es $d$, y $d$ no es vecino de $a$, así que el camino $a,g,d,c$ que dan los padres no se puede acortar.
