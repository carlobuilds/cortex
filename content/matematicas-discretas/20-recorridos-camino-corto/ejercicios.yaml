    pistas:
      - >-
        ¿Cuántos vértices nuevos aporta cada arista, según su peso?
      - >-
        En el grafo nuevo cada arista cuenta 1: ¿qué mide entonces el nivel de un vértice original?
      - >-
        Dentro de una arista partida, ¿desde cuál de sus dos extremos llega antes la búsqueda a cada vértice nuevo?
    explicacion: >-
      **Vértices nuevos:** $ab$, $be$ y $bf$ pesan 3 y aportan 2 cada una; $ce$ pesa 2 y aporta 1; $af$ y $cf$ pesan 1 y no aportan: $2+2+2+1=7$. **Niveles y distancias:** en el grafo nuevo, cada arista original de peso $k$ es una trayectoria de $k$ aristas, así que el nivel de un vértice original es su distancia ponderada en el grafo de antes. Dijkstra desde $a$ da $f$ 1, $c$ 2 por $f$, $b$ 3 directo (por $f$ serían 4) y $e$ 4 por $f$ y $c$ (por $b$ serían 6): el nivel de $e$ es 4. **El mayor nivel:** en una arista partida, cada vértice nuevo toma el menor nivel que le llega por sus dos extremos. En la de $b$, con nivel 3, a $e$, con 4, los dos nuevos quedan en 4 y en 5: el que está junto a $e$ tiene $\min(3+2,4+1)=5$. En las demás no se pasa de 3 (en $ab$, 1 y 2; en $bf$, 3 y 2; en $ce$, 3). El mayor nivel es 5, en la arista que une a $b$ con $e$. Revisa: el vértice de nivel 5 está a 5 aristas de $a$ tanto por $b$ ($3+2$) como por $e$ ($4+1$).
