  # razonamiento: algorítmico (simular la variante con repetidos en la cola) · R2
  # El `<Ojo>` de la lección (M): marcar al sacar no cambia el orden, pero mete repetidos a la cola y daña el árbol si
  # se anota el padre en cada entrada. «Entradas» cuenta también la de a. El hueco 3 es recuerdo del `<Ojo>` si se lo
  # sabe; la simulación lo confirma.
  # verificar: simula la variante (entradas de la cola y padres, gana el último) y el BFS normal, y compara el orden.
  - id: disc-20-018
    tipo: completar
    dificultad: 3
    conceptos: [busqueda-amplitud]
    enunciado: >-
      Una variante de la búsqueda en amplitud desde $a$ **marca al sacar**: se encola $a$; al sacar un vértice, si ya está marcado se descarta, y si no, se marca y se encolan, en orden alfabético, todos sus vecinos que no estén marcados, aunque ya estén en la cola. Cada vez que $u$ encola a $v$, se anota a $u$ como padre de $v$, en lugar del que tuviera. En el hueco de sí o no, escribe 1 (sí) o 0 (no).
    visual: { id: grafo, vertices: "a, b, c, d, e, f", aristas: "a-b, a-c, a-e, a-f, b-c, c-d, c-e, d-e, d-f" }
    texto: >-
      Número de veces que $d$ entra a la cola: ___ · número total de entradas a la cola, contando la de $a$: ___ · ¿el orden en que se marcan los vértices es distinto del orden BFS que marca al encolar? ___ · padre de $e$ al terminar: ___ (vértice)
    respuestas: ["3", "10", "0", "c"]
    verificar: { python: "(lambda V, E: (lambda A: (lambda L, Z, B: [L.count('d'), len(L), int(Z[0] != B[0]), Z[1]['e']])((lambda A, s: (lambda go: go(go, [s], [], [s]))(lambda go, Q, M, L: L if not Q else (go(go, Q[1:], M, L) if Q[0] in M else (lambda N: go(go, Q[1:] + N, M + [Q[0]], L + N))([v for v in A[Q[0]] if v not in M + [Q[0]]]))))(A, 'a'), (lambda A, s: (lambda go: go(go, [(s, None)], [], {}))(lambda go, Q, M, P: (M, P) if not Q else (go(go, Q[1:], M, P) if Q[0][0] in M else (lambda u: go(go, Q[1:] + [(v, u) for v in A[u] if v not in M + [u]], M + [u], {**P, **{v: u for v in A[u] if v not in M + [u]}}))(Q[0][0]))))(A, 'a'), (lambda A, s: (lambda go: go(go, [s], [s], {s: None}, {s: 0}))(lambda go, Q, M, P, L: (M, P, L) if not Q else (lambda N: go(go, Q[1:] + N, M + N, {**P, **{v: Q[0] for v in N}}, {**L, **{v: L[Q[0]] + 1 for v in N}}))([v for v in A[Q[0]] if v not in M])))(A, 'a')))((lambda V, E: {v: sorted({w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v}) for v in V})(V, E)))('a, b, c, d, e, f'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-c, a-e, a-f, b-c, c-d, c-e, d-e, d-f'.split(', ')])" }
    pistas:
      - >-
        Al sacar al segundo vértice, ¿vuelves a encolar a un vecino que ya estaba en la cola?
      - >-
        ¿Quién es el último en encolar a $e$ antes de que $e$ se marque?
    explicacion: |-
      Las aristas son $ab$, $ac$, $ae$, $af$, $bc$, $cd$, $ce$, $de$ y $df$. La cola, entrada por entrada:

      1. Entra $a$. Sale $a$, se marca y encola a $b$, $c$, $e$ y $f$. Cola: $b,c,e,f$.
      2. Sale $b$, se marca y encola a $c$ otra vez ($a$ ya está marcado). Cola: $c,e,f,c$.
      3. Sale $c$, se marca y encola a $d$ y a $e$; $e$ entra por segunda vez, y su padre pasa a ser $c$. Cola: $e,f,c,d,e$.
      4. Sale $e$, se marca y encola a $d$. Cola: $f,c,d,e,d$.
      5. Sale $f$, se marca y encola a $d$. Cola: $c,d,e,d,d$.
      6. Sale $c$, ya marcado, y se descarta. Sale $d$ y se marca; sus vecinos ya están marcados. Salen $e$, $d$ y $d$, ya marcados.

      $d$ entra 3 veces, y en total hay $1+4+1+2+1+1=10$ entradas. Se marcan en el orden $a,b,c,e,f,d$, el mismo que da el BFS que marca al encolar: la respuesta es 0. El padre de $e$ queda en $c$, pero en el árbol BFS es $a$: $e$ se marca cuando sale su primera entrada, la que puso $a$. Revisa: marcando al encolar, cada vértice entra una vez, y la cola tendría 6 entradas.
    tiempo_estimado_s: 120

  # razonamiento: deductivo (invariante de la cola e inducción en la distancia) · R3
  # De A, tal cual (enunciado, rúbrica, respuesta modelo y pistas). Revisión manual. La lección enuncia, sin probarlo,
  # el invariante de la cola (§2). La inducción, que la rúbrica usa, se recuerda al final del enunciado: en los
  # arreglos del 2026-11-15 pasó de §6 de la lección aquí (P). La explicación es del autor: resume la respuesta modelo
  # sin agregar nada; desde los arreglos dice que el invariante «hay que probar y no citar» (M). tarjeta: false, como
  # las autoevaluaciones de la 15 a la 19.
  - id: disc-20-019
    tipo: autoevaluacion
    dificultad: 4
    conceptos: [distancia-bfs]
    enunciado: >-
      En papel, demuestra que, en un BFS desde $s$, el nivel $L(v)$ de cada vértice alcanzable es su distancia en aristas $\mathrm{dist}(s,v)$, y di qué pasa con los vértices que no se alcanzan. Recuerda la **inducción**: si $P(0)$ vale y $P(k-1)$ implica $P(k)$ para cada $k\ge1$, $P(k)$ vale para todo $k\ge0$.
    rubrica:
      - >-
        Define $L(v)$ y la distancia, y prueba la cota fácil: siguiendo a los padres desde $v$ hay un camino de $L(v)$ aristas, así que $\mathrm{dist}(s,v)\le L(v)$. Error típico: dar esto como toda la demostración; un camino de $L(v)$ aristas no descarta uno más corto.
      - >-
        Prueba, sin suponerlo, que en la cola los niveles no bajan y difieren a lo más en 1, revisando qué pasa cada vez que alguien sale y entra; concluye que los vértices salen en orden de nivel. Error típico: usar «el BFS va por niveles» como premisa, que es casi lo que se quiere probar.
      - >-
        Prueba $L(v)\le\mathrm{dist}(s,v)$ por inducción en la distancia (o con el vértice más cercano que falle), con el penúltimo vértice $u$ de un camino más corto, y cubre los dos casos al sacar a $u$: $v$ sin marcar y $v$ ya marcado. Error típico: olvidar el caso «ya marcado», que es justo donde se usa el invariante de la cola.
      - >-
        Junta las dos cotas, $L(v)=\mathrm{dist}(s,v)$ para todo $v$ alcanzable; dice que los no alcanzables nunca se marcan y dónde usó que cada arista cuenta 1. Error típico: decir que vale también con pesos, o callar qué pasa con los vértices que el BFS no alcanza.
    respuesta_modelo: >-
      Notación: $L(v)$ es el nivel que el BFS le da a $v$: $L(s)=0$ y, si $v$ se marca cuando $u$ sale de la cola, $L(v)=L(u)+1$ y $u$ es su padre; $\mathrm{dist}(s,v)$ es el menor número de aristas de un camino de $s$ a $v$. Pruebo dos desigualdades para todo $v$ alcanzable desde $s$. **Cota fácil, $\mathrm{dist}(s,v)\le L(v)$:** de $v$ a su padre, de este al suyo, y así hasta $s$, el nivel baja de 1 en 1, y solo $s$ tiene nivel 0; es un camino de exactamente $L(v)$ aristas, y la distancia es la menor longitud posible. Esto solo no basta: podría haber un camino más corto. **Invariante de la cola:** en todo momento, los niveles de la cola, del frente al final, no bajan y son $k$ o $k+1$ para algún $k$. Al inicio la cola es $[s]$. Sacar al del frente no lo rompe. Cuando sale $u$, con nivel $k$, en la cola quedan niveles $k$ o $k+1$, y al final entran vecinos con nivel $k+1$: sigue valiendo. Por eso los vértices salen de la cola en orden de nivel no decreciente. **Cota difícil, $L(v)\le\mathrm{dist}(s,v)$,** por inducción en $d=\mathrm{dist}(s,v)$: todo $v$ a distancia $d$ se marca y tiene $L(v)\le d$. Si $d=0$, $v=s$ y $L(s)=0$. Si $d\ge1$, sea $u$ el penúltimo vértice de un camino de $d$ aristas de $s$ a $v$; entonces $\mathrm{dist}(s,u)=d-1$ y, por hipótesis, $u$ se marca y $L(u)\le d-1$. Cuando $u$ sale de la cola, si $v$ no está marcado, se marca ahora con $L(v)=L(u)+1\le d$. Si ya estaba marcado, lo marcó un $w$ que salió de la cola antes que $u$, y por el invariante $L(w)\le L(u)$; así, $L(v)=L(w)+1\le d$. **Conclusión:** $L(v)=\mathrm{dist}(s,v)$ para todo $v$ alcanzable. Los no alcanzables nunca se marcan, porque cada vértice marcado tiene un camino de padres hasta $s$. Revisa: el argumento usa que cada arista suma 1, en $L(v)=L(u)+1$; con pesos, la ruta de menos tramos puede pesar más, y por eso hace falta Dijkstra.
    verificar: { revision: "manual" }
    pistas:
      - >-
        ¿Qué tienes que probar: que el BFS encuentra un camino de $L(v)$ aristas, o que no hay uno más corto? ¿Qué te da seguir a los padres desde $v$ hasta $s$?
      - >-
        ¿En qué orden de nivel salen los vértices de la cola? ¿Puedes probarlo, sin suponerlo, viendo qué niveles hay en la cola cada vez que entra alguien?
      - >-
        Para la otra desigualdad, toma un camino más corto de $s$ a $v$ y su penúltimo vértice $u$. Cuando $u$ sale de la cola, ¿qué puede pasar con $v$? ¿Revisaste el caso en que $v$ ya estaba marcado?
    explicacion: >-
      **Son dos desigualdades.** Seguir a los padres desde $v$ da un camino de $L(v)$ aristas, así que $\mathrm{dist}(s,v)\le L(v)$; eso solo no descarta uno más corto. Para la otra, el invariante de la cola (del frente al final, los niveles no bajan y difieren a lo más en 1), que hay que probar y no citar, da que los vértices salen en orden de nivel, y la inducción en la distancia, con el penúltimo vértice $u$ de un camino más corto, cubre los dos casos al sacar a $u$: $v$ sin marcar, que se marca con $L(u)+1$, y $v$ ya marcado por un vértice que salió antes que $u$, con nivel a lo más $L(u)$. Los no alcanzables nunca se marcan, porque cada vértice marcado tiene un camino de padres hasta $s$. Revisa: el argumento usa que cada arista suma 1; con pesos, en el barrio $G$ de la lección, $a,c,f$ tiene menos aristas y pesa 11, más que los 8 de $a,e,g,f$.
    tarjeta: false
    tiempo_estimado_s: 360

