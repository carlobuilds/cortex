    conceptos: [busqueda-profundidad]
    enunciado: >-
      Haz la búsqueda en profundidad desde $d$ en este grafo, con los vecinos en orden alfabético. El **padre** de un vértice es el vértice desde el que se entró a él.
    visual: { id: grafo, vertices: "a, b, f, c, d, g, e", aristas: "a-b, a-e, a-f, a-g, b-d, b-f, c-d, d-f, d-g, e-g" }
    texto: >-
      Orden DFS desde $d$ (cada hueco, un vértice): $d$, ___, ___, ___, ___, ___, ___ · padre de $f$ en el árbol DFS: ___ (vértice)
    respuestas: ["b", "a", "e", "g", "f", "c", "a"]
    verificar: { python: "(lambda V, E: (lambda R: R[0][1:] + [R[1]['f']])((lambda A, s: (lambda go: go(go, s, ([s], {s: None}, [])))(lambda go, u, S: (lambda R: (R[0], R[1], R[2] + [u]))(list(itertools.accumulate(A[u], lambda st, v: st if v in st[0] else go(go, v, (st[0] + [v], {**st[1], v: u}, st[2])), initial=S))[-1])))((lambda V, E: {v: sorted({w for (a, b) in E for (x, w) in ((a, b), (b, a)) if x == v}) for v in V})(V, E), 'd')))('a, b, c, d, e, f, g'.split(', '), [tuple(e.split('-')) for e in 'a-b, a-e, a-f, a-g, b-d, b-f, c-d, d-f, d-g, e-g'.split(', ')])" }
    pistas:
