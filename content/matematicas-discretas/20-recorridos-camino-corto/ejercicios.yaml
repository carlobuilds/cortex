  # razonamiento: metacognitivo (una revisión que no puede fallar no revisa: falta «ninguna arista mejora una d») · R2
  # De A, tal cual (enunciado, texto, respuestas, pistas, explicación y `verificar`). El vértice se llama e, no d.
