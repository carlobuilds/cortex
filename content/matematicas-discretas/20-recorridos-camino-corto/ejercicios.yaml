      **Lo que revisó Iván no basta.** Que cada $d$ sea el peso del camino que dan los predecesores solo prueba que ese camino existe: la distancia verdadera no es mayor que $d$. No prueba que no haya uno más barato. **La revisión completa** agrega: en cada arista $u$–$v$, en los dos sentidos, $d(v)\le d(u)+w(u,v)$. Con los números de Iván, todas cumplen salvo $b$–$c$: $d(b)+w(b,c)=3+2=5<8=d(c)$. Lo más probable es que, al fijar $b$, no relajara la arista $b$–$c$. **La tabla correcta:** $d(c)=5$, por $s,a,b,c$; $d(e)=6$, por $c$; y $d(t)=8$, por $s,a,b,c,e,t$, con $2+1+2+1+2=8$. Están mal 3 valores, los de $c$, $e$ y $t$: el error de $c$ se arrastra por los predecesores; $s$, $a$ y $b$ estaban bien. ¿Qué revisión harás tú siempre al terminar una tabla de Dijkstra? Revisa: con la tabla correcta, las 9 aristas cumplen $d(v)\le d(u)+w(u,v)$ en los dos sentidos; por ejemplo, $c$–$t$ da $8\le5+5$.
