    verificar: { python: "(lambda V, W, iv: (lambda w: (lambda D: (lambda bad: sorted(bad[0]) + [sum(1 for v in V if D[v] != iv[v]), D['t']] if len(bad) == 1 else [])([e for e in W if iv[e[1]] > iv[e[0]] + W[e] or iv[e[0]] > iv[e[1]] + W[e]]))({v: 0 if v == 's' else min(sum(w(p[i], p[i + 1]) for i in range(len(p) - 1)) for k in range(len(V) - 1) for m in itertools.permutations([y for y in V if y not in ('s', v)], k) for p in [('s',) + m + (v,)] if all(w(p[i], p[i + 1]) is not None for i in range(len(p) - 1))) for v in V}))(lambda x, y: W.get((x, y), W.get((y, x)))))(['s', 'a', 'b', 'c', 'e', 't'], {('s', 'a'): 2, ('s', 'b'): 5, ('a', 'b'): 1, ('a', 'c'): 6, ('b', 'c'): 2, ('b', 'e'): 7, ('c', 'e'): 1, ('c', 't'): 5, ('e', 't'): 2}, {'s': 0, 'a': 2, 'b': 3, 'c': 8, 'e': 9, 't': 11})" }
    pistas:
      - >-
        ¿Qué asegura la revisión de Iván: que cada $d$ se puede alcanzar, o que no hay nada más barato?
      - >-
        Si la tabla fuera correcta, ¿qué tendría que cumplir cada arista $u$–$v$, en los dos sentidos, con $d(u)$, $d(v)$ y $w(u,v)$?
