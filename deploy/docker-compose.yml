# Cortex PWA en cortex.carlogarza.dev (ADR-029), detrás del Traefik compartido del VPS
# (Traefik 3.6, network_mode: host, entrypoint websecure, certresolver letsencrypt).
# Vive en el VPS en /docker/cortex/ junto a ./Caddyfile y ./sitio/ (lo llena deploy/publicar.sh).
# Nombres "cortex-pwa*" para no chocar con otros proyectos del VPS.
# Apagar = `docker compose down` (NUNCA con -v). Ojo: eso NO arregla un iPad con el service
# worker instalado; para eso está `publicar.sh --kill-sw` (deploy/README.md).

name: cortex

services:
  cortex-pwa:
    # Versión fijada por digest (índice multi-arquitectura). Para subirla: elegir una versión estable
    # de al menos 2 semanas, `docker pull`, copiar el digest de `docker inspect` y revisar con el guardián.
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    container_name: cortex-pwa
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /data:size=8m,mode=1777
      - /config:size=1m,mode=1777
    volumes:
      - ./sitio:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.5
    # OJO: Traefik ignora el contenedor mientras no esté "healthy": sin router ni certificado hasta entonces.
    # /healthz no depende del contenido de ./sitio. Sin start_interval (no sabemos la versión de Docker del VPS).
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [traefik-public]
    # Sin `ports:`: solo Traefik llega a este contenedor, por la red traefik-public.
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.cortex-pwa.rule=Host(`cortex.carlogarza.dev`)
      - traefik.http.routers.cortex-pwa.entrypoints=websecure
      - traefik.http.routers.cortex-pwa.tls.certresolver=letsencrypt
      - traefik.http.routers.cortex-pwa.middlewares=cortex-pwa-compress
      - traefik.http.routers.cortex-pwa.service=cortex-pwa
      - traefik.http.services.cortex-pwa.loadbalancer.server.port=8080
      - traefik.http.middlewares.cortex-pwa-compress.compress=true

networks:
  traefik-public:
    external: true
